              <div class="metric-card"><div class="metric-label">本月经费余额</div><div class="metric-value">${money(state.funds)}</div></div>
              <div class="metric-card"><div class="metric-label">仪器 / 房间</div><div class="metric-value">${state.instruments.length}<small>/ ${state.rooms.length}</small></div></div>
            </div>
            ${pendingPapers.length ? `<div class="section-label">READY TO SUBMIT · 可以投稿</div><div class="opportunity-list">${pendingPapers.map(({ project, milestone }) => `
              <div class="opportunity">
                <div class="opportunity-copy"><div class="opportunity-title">${escapeHtml(project.title)}</div><div class="opportunity-meta">进度 ${milestone.value}% · ${project.tier} 级 · 待整理</div></div>
                <button class="button button-small button-gold" data-action="open-paper" data-project="${project.id}" data-milestone="${milestone.value}">投稿</button>
              </div>`).join("")}</div>` : `<div class="empty-state" style="padding:16px 12px;margin-top:10px;">还没有可以投稿的数据。先把人放进课题，让实验跑起来。</div>`}
            ${bonds.length ? `<div class="section-label">BONDS · 当前羁绊</div><div class="bond-list">${bonds.map((bond) => `<span class="bond-pill ${bond.effects.progress < 0 ? "is-bad" : "is-good"}" title="${escapeHtml(bond.desc)}">${bond.icon} ${escapeHtml(bond.name)}</span>`).join("")}</div>` : ""}
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <div class="panel-kicker">LAB NOTES · 最近记录</div>
              <div class="panel-title">走廊里的消息</div>
            </div>
          </div>
          <div class="panel-body">
            <div class="log-list">${logs.map((entry) => `<div class="log-entry kind-${entry.kind || "normal"}"><span class="log-month">${C.monthInfo(entry.month).short}</span>${escapeHtml(entry.text)}</div>`).join("") || `<div class="empty-state">还没有记录。</div>`}</div>
          </div>
        </section>
      `;
    },

    personInspector(person) {
      const state = this.state;
      const role = roleOf(person);
      const rarity = rarityOf(person);
      const projects = C.personProjects(state, person);
      const progress = C.studentProgress(state, person);
      const graduation = person.kind === "student" && person.graduationAt != null
        ? Math.max(0, person.graduationAt - state.month)
        : null;
      const eligibleProjects = activeProjectOptions(state).filter((item) => item.team.indexOf(person.id) < 0 && item.team.length < item.teamCap);
      const trainingText = person.training ? `${person.training.icon} ${person.training.name} · ${Math.max(0, person.training.endMonth - state.month)} 月` : "当前没有培训";
      const publications = Array.isArray(person.publications) ? person.publications : [];
      return `
        <section class="panel panel-accent">
          <div class="panel-head">
            <div class="detail-top">
              ${avatarHtml(person)}
              <div>
                <div class="detail-name">${escapeHtml(person.name)} ${person.special ? `<span class="special-pill">人员表</span>` : ""}</div>
                <div class="detail-sub"><span class="rarity-pill rarity-${person.rarity}">${rarity.id}</span>${escapeHtml(role.name)} · ${person.kind === "student" ? "培养岗" : "工作人员"}</div>
              </div>
            </div>
            <button class="modal-close" data-action="back-to-lab" aria-label="返回">×</button>
          </div>
          <div class="panel-body">
            <div class="trait-line trait-line-stack">${traitBadges(person)}</div>
            <div class="trait-description">${traitsOf(person).map((trait) => `<div><b>${escapeHtml(trait.name)}</b> · ${escapeHtml(trait.desc)}</div>`).join("") || "没有特别突出的性格标签。"}</div>
            <div class="field-tags">
              ${fieldTagHtml(person.primaryField, false, C.fieldLevel(person, person.primaryField))}
              ${fieldTagHtml(person.secondaryField, true, C.fieldLevel(person, person.secondaryField))}
            </div>
            <div class="stat-list stat-list-six">
              ${D.STAT_KEYS.map((key) => statBar(`${statIcon(key)} ${statLabel(key)}`, C.effectiveStat(person, key))).join("")}
            </div>
            <div class="person-meta-grid">
              <div class="person-meta">好感度<b>${Math.round(person.favor)} / 100</b></div>
              <div class="person-meta">士气<b>${Math.round(person.morale)} / 100</b></div>
              <div class="person-meta">${person.kind === "student" ? "月津贴" : "月薪"}<b>${money(person.salary)}</b></div>
              <div class="person-meta">${person.kind === "student" ? "距毕业节点" : "在组时间"}<b>${person.kind === "student" ? `${graduation} 个月` : `${person.monthsInLab || 0} 个月`}</b></div>
              <div class="person-meta">参与课题<b>${projects.length} 个 · 效率 ${Math.round((1 / (1 + Math.max(0, projects.length - 1) * 0.35)) * 100)}%</b></div>
              <div class="person-meta">论文 / 一作<b>${progress.papers} / ${progress.firstAuthor}</b></div>
            </div>
            <div class="section-label">PROJECTS · 当前参与的课题</div>
            <div class="person-project-list">
              ${projects.length ? projects.map((project) => `<button class="person-project-link" data-action="select-project" data-project="${project.id}">⌁ <span>${escapeHtml(project.title)}</span><b>${Math.round((project.data / project.dataGoal) * 100)}%</b></button>`).join("") : `<div class="empty-state" style="padding:10px;">☕ 暂时没有课题，在实验室帮忙。</div>`}
            </div>
            <div class="person-meta" style="margin-top:6px;">培训状态<b>${escapeHtml(trainingText)}</b></div>
          </div>
          <div class="panel-actions">
            <button class="button button-small" data-action="talk" data-person="${person.id}" ${person.lastTalkMonth === state.month ? "disabled" : ""}>☕ 谈心·1AP</button>
            <button class="button button-small" data-action="open-training-for" data-person="${person.id}" ${person.training ? "disabled" : ""}>✈ 送培</button>
          </div>
        </section>

        ${person.kind === "student" ? `
        <section class="panel">
          <div class="panel-head"><div><div class="panel-kicker">DEGREE CLOCK · ${escapeHtml(progress.label || role.name)}</div><div class="panel-title">${escapeHtml(progress.requirement ? progress.requirement.after : "培养节点")}条件</div></div></div>
          <div class="panel-body">
            <p class="panel-subtitle">${progress.met ? "已经达到培养要求，可以在节点选择毕业或留组。" : `距离培养节点还有 ${graduation} 个月；未达标会在节点触发延毕，最多延毕 ${progress.requirement ? progress.requirement.maxDelay : 2} 次。`}</p>
            <div class="requirement-grid">
              <span class="requirement-pill ${requirementMet(progress.papers, progress.targetPapers) ? "is-met" : ""}">论文 ${progress.papers}/${progress.targetPapers}</span>
              <span class="requirement-pill ${requirementMet(progress.firstAuthor, progress.targetFirstAuthor) ? "is-met" : ""}">一作 ${progress.firstAuthor}/${progress.targetFirstAuthor}</span>
              <span class="requirement-pill ${requirementMet(progress.totalIF, progress.targetIF) ? "is-met" : ""}">IF ${progress.totalIF}/${progress.targetIF}</span>
              <span class="requirement-pill ${requirementMet(progress.favor, progress.targetFavor) ? "is-met" : ""}">好感 ${progress.favor}/${progress.targetFavor}</span>
            </div>
            <div class="mini-track" style="margin-top:9px;"><i style="width:${C.clamp((progress.papers / Math.max(1, progress.targetPapers)) * 100, 0, 100)}%;background:${progress.met ? "#7ea36e" : "#c29a56"};"></i></div>
            <div class="mini-label-row" style="margin-top:4px;color:#8f7b62;"><span>培养要求完成度</span><b>${progress.met ? "可以毕业" : `已延毕 ${person.delayCount || 0} 次`}</b></div>
          </div>
        </section>` : ""}

        <section class="panel">
          <div class="panel-head"><div><div class="panel-kicker">ASSIGN TO PROJECT · 可同时参与多个</div><div class="panel-title">还有哪张实验台需要人</div></div></div>
          <div class="panel-body">
            ${eligibleProjects.length ? `<div class="opportunity-list">${eligibleProjects.map((item) => `<div class="opportunity"><div class="opportunity-copy"><div class="opportunity-title">${escapeHtml(item.title)}</div><div class="opportunity-meta">${fieldOf(item.field).name} · ${item.team.length}/${item.teamCap} 人 · 再加一个课题会降低效率</div></div><button class="button button-tiny" data-action="assign-person" data-person="${person.id}" data-project="${item.id}">加入</button></div>`).join("")}</div>` : `<div class="empty-state" style="padding:15px 10px;">没有还有空位的课题。去课题面板开新题。</div>`}
          </div>
        </section>

        ${publications.length ? `<section class="panel"><div class="panel-head"><div><div class="panel-kicker">PUBLICATION RECORD</div><div class="panel-title">个人论文记录</div></div></div><div class="panel-body"><div class="paper-archive">${publications.slice().reverse().map((paper) => `<div class="paper-archive-row"><span class="paper-archive-icon">${paper.firstAuthor ? "🥇" : "📄"}</span><span class="paper-archive-copy"><b>${escapeHtml(paper.title)}</b><small>${escapeHtml(paper.journal)} · ${paper.firstAuthor ? "第一作者" : "共同作者"} · ${C.monthInfo(paper.month).calendar}</small></span><span class="paper-archive-if">IF ${paper.impact}</span></div>`).join("")}</div></div></section>` : ""}
      `;
    },

    projectInspector(project) {
      const state = this.state;
      const field = fieldOf(project.field);
      const percent = C.clamp((project.data / project.dataGoal) * 100, 0, 100);
      const team = C.projectTeam(state, project);
      const equipment = C.projectEquipmentBonus(state, project);
      const power = C.projectPower(state, project);
      const requirements = C.projectRequirementStatus(state, project);
      const bonds = C.projectBonds(state, project);
      const readyMilestones = (project.milestones || []).filter((milestone) => milestone.ready);
      const booking = C.externalBookingsFor(state, project.id);
      const requirementLine = requirements.ok
        ? "✓ 房间与设备要求已满足"
        : `缺少：${requirements.missing.join("、")}`;
      return `
        <section class="panel panel-accent">
          <div class="panel-head">
            <div>
              <div class="panel-kicker">${project.tier} TIER · ${field.name} · ${escapeHtml(project.source || "实验室规划")}</div>
              <div class="panel-title">${escapeHtml(project.title)}</div>
              <div class="panel-subtitle">${escapeHtml(project.desc)}</div>
            </div>
            <button class="modal-close" data-action="back-to-lab" aria-label="返回">×</button>
          </div>
          <div class="panel-body">
            <div class="project-progress-large"><i style="width:${percent}%"></i></div>
            <div class="mini-label-row" style="margin-top:5px;"><span>数据进度</span><b>${project.data.toFixed(1)} / ${project.dataGoal}</b></div>
            <div class="project-meta-row">
              <span class="meta-pill">${field.icon} ${field.name}</span>
              <span class="meta-pill">${projectStatus(project)}</span>
              <span class="meta-pill">月产出 ${power.blocked ? 0 : power.power}</span>
              <span class="meta-pill">设备加成 +${equipment}</span>
            </div>
            <div class="requirement-line ${requirements.ok ? "is-met" : "is-missing"}">${requirementLine}</div>
            ${requirements.requiredRoom || requirements.requiredInstrument ? `<div class="project-requirements">
              ${requirements.requiredRoom ? `<span class="requirement-pill ${requirements.room ? "is-met" : ""}">房间 · ${escapeHtml(requirements.roomName)}</span>` : ""}
              ${requirements.requiredInstrument ? `<span class="requirement-pill ${requirements.ownedInstrument || requirements.external ? "is-met" : ""}">仪器 · ${escapeHtml(requirements.instrumentName)}</span>` : ""}
              ${requirements.external ? `<span class="requirement-pill is-met">公共平台 · 本月</span>` : ""}
            </div>` : ""}
            ${booking.length ? `<div class="project-requirements"><span class="requirement-pill is-met">平台预约：${booking.map((item) => escapeHtml(item.name)).join("、")}</span></div>` : ""}
            <div class="section-label">TEAM · 当前小组 ${team.length}/${project.teamCap}</div>
            <div class="team-list">
              ${team.length ? team.map((person) => `<button class="team-row" data-person="${person.id}">${avatarHtml(person)}<span>${escapeHtml(person.name)} · ${escapeHtml(roleOf(person).name)}${person.projects && person.projects.length > 1 ? ` · 兼 ${person.projects.length} 个课题` : ""}</span><b style="color:#7f946d;">${Math.round(person.favor)} ♥</b></button>`).join("") : `<div class="empty-state" style="padding:13px;">还没有人负责这个课题。</div>`}
            </div>
            ${bonds.length ? `<div class="section-label">BONDS · 团队羁绊</div><div class="bond-list">${bonds.map((bond) => `<span class="bond-pill ${bond.effects.progress < 0 ? "is-bad" : "is-good"}" title="${escapeHtml(bond.desc)}">${bond.icon} ${escapeHtml(bond.name)}</span>`).join("")}</div>` : ""}
            <div class="section-label">PAPER WINDOWS · 论文窗口</div>
            ${(project.milestones || []).map((milestone) => `<div class="equipment-line"><span>${milestone.value}% ${milestone.published ? "已发表" : milestone.ready ? "数据可投稿" : "尚未到达"}</span><b>${milestone.published ? "✓" : milestone.ready ? "READY" : "—"}</b></div>`).join("")}
            ${readyMilestones.length ? `<div class="opportunity-list" style="margin-top:8px;">${readyMilestones.map((milestone) => `<button class="opportunity" data-action="open-paper" data-project="${project.id}" data-milestone="${milestone.value}" style="text-align:left;"><div class="opportunity-copy"><div class="opportunity-title">整理 ${milestone.value}% 的数据</div><div class="opportunity-meta">选择期刊并提交 · 需支付投稿费</div></div><span class="button button-tiny button-gold">投稿</span></button>`).join("")}</div>` : ""}
          </div>
          <div class="panel-actions">
            ${project.status === "draft" ? `<button class="button button-small button-gold" data-action="approve-proposal" data-project="${project.id}">开题讨论 · 1AP</button>` : `<button class="button button-small" data-action="open-team" data-project="${project.id}" ${project.status === "completed" ? "disabled" : ""}>调整小组·1AP</button>`}
            ${project.status === "active" ? `<button class="button button-small button-ghost" data-action="open-platform" data-project="${project.id}">公共平台预约</button>` : ""}
          </div>
        </section>
      `;
    },

    roomInspector(room) {
      const state = this.state;
      const info = D.ROOM_TYPES.find((type) => type.id === room.type) || D.ROOM_TYPES[0];
      const instruments = state.instruments.filter((instrument) => instrument.roomSlot === room.slot);
      const capacity = C.roomCapacity(state, room);
      const upgradeCost = info.upgradeCost * room.level;
      return `
        <section class="panel panel-accent">
          <div class="panel-head">
            <div>
              <div class="panel-kicker">ROOM ${room.slot + 1} · ${info.field === "all" ? "综合空间" : fieldOf(info.field).name}</div>
              <div class="panel-title">${escapeHtml(info.name)} <span class="room-level">Lv.${room.level}</span></div>
              <div class="panel-subtitle">${escapeHtml(info.desc)}</div>
            </div>
            <button class="modal-close" data-action="back-to-lab" aria-label="返回">×</button>
          </div>
          <div class="panel-body">
            <div class="metric-grid">
              <div class="metric-card"><div class="metric-label">仪器位</div><div class="metric-value">${instruments.length}<small>/ ${capacity}</small></div></div>
              <div class="metric-card"><div class="metric-label">房间加成</div><div class="metric-value">+${Math.round(info.bonus * 100 * room.level)}<small>%</small></div></div>
            </div>
            <div class="section-label">INSTRUMENTS · 房间里的家伙</div>
            ${instruments.length ? instruments.map((instrument) => {
              const detail = C.instrumentInfo(instrument);
              return `<div class="room-detail-instrument"><span class="instrument-icon">${detail.icon}</span><div class="room-detail-instrument-copy"><div class="room-detail-instrument-name">${escapeHtml(detail.name)}</div><div class="room-detail-instrument-meta">${fieldOf(detail.field).name} · 设备加成 +${detail.bonus} · 每月维护 ${money(detail.upkeep)}</div></div></div>`;
            }).join("") : `<div class="empty-state" style="padding:14px;">这间房还很空。</div>`}
          </div>
          <div class="panel-actions">
            <button class="button button-small" data-action="upgrade-room" data-slot="${room.slot}" ${room.level >= 3 ? "disabled" : ""}>升级房间 · ${money(upgradeCost)}</button>
            <button class="button button-small button-ghost" data-action="open-shop">去采购仪器</button>
          </div>
        </section>
      `;
    },

    renderActionbar() {
      const state = this.state;
      const info = monthText(state);
      const nextInfo = C.monthInfo(Math.min(state.campaignMonths, state.month + 1));
      $("#apDots").innerHTML = Array.from({ length: state.maxAp }, (_, index) => `<span class="ap-dot ${index < state.ap ? "is-filled" : ""}"></span>`).join("");
      $("#apText").textContent = `${state.ap} / ${state.maxAp}`;
      const apBreakdown = $("#apBreakdown");
      if (apBreakdown) apBreakdown.innerHTML = apBreakdownHtml(state);
      const readyPapers = state.projects.reduce((sum, project) => sum + (project.milestones || []).filter((milestone) => milestone.ready).length, 0);
      let hint = "把学生安排进课题，再结束这个月。";
      if (state.phase !== "playing") hint = "这一局已经结束。";
      else if (state.pendingEvents.length) hint = "有手写便条放在你桌上，先处理待办事件。";
      else if (readyPapers) hint = `有 ${readyPapers} 个数据窗口可以投稿，别让数据在硬盘里过夜。`;
      else if (state.ap === 0) hint = "行动点用完了。可以结束本月，让实验自己跑一会儿。";
      else if (!state.projects.some((project) => project.team.length) && state.people.length) hint = "把成员放进课题，实验室才会出数据。";
      else if (state.funds < 100000) hint = "经费有点紧，考虑申请基金或发表论文换版面费。";
      $("#actionHint").textContent = hint;
      $("#advanceDate").textContent = `推进到 ${nextInfo.monthName}`;
      const button = $("#advanceBtn");
      if (state.phase !== "playing") {
        button.disabled = true;
        button.querySelector("span").textContent = "本局已结束";
      } else if (state.pendingEvents.length) {
        button.disabled = false;
        button.querySelector("span").textContent = "处理待办事件";
      } else {
        button.disabled = false;
        button.querySelector("span").textContent = "结束本月";
      }
    },

    updateNavActive() {
      const activePanel = this.modal && this.modal.type === "panel" ? this.modal.panel : null;
      $$(".nav-item").forEach((item) => {
        item.classList.toggle("is-active", (activePanel && item.dataset.panel === activePanel) || (!activePanel && item.dataset.panel === "lab"));
      });
    },

    select(type, id) {
      this.selected = { type, id };
      this.render();
    },

    backToLab() {
      this.selected = { type: "lab", id: null };
      this.render();
    },

    openPanel(panel) {
      this.panel = panel;
      if (panel === "lab") {
        this.closeModal(true);
        this.backToLab();
        return;
      }
      let content = "";
      let title = "";
      let kicker = "";
      let subtitle = "";
      if (panel === "people") {
        title = "实验室成员";
        kicker = "PEOPLE & STUDENTS";
        subtitle = "硕士 3 年、博士 4 年、博后 2 年；每人有 6 项能力、多个特质，未达标会延毕。";
        content = this.peoplePanel();
      } else if (panel === "projects") {
        title = "课题与论文";
        kicker = "RESEARCH PORTFOLIO";
        subtitle = "特定课题需要特定房间和仪器；学生提案要先开题；一个人可以兼多个课题，但会掉效率。";
        content = this.projectsPanel();
      } else if (panel === "recruitment") {
        title = "招生与招聘";
        kicker = "TALENT MARKET";
        subtitle = "每学期 2 次免费刷新，用完后花 ¥25,000 + 1AP。高能力、好特质和高身份都会抬高成本。";
        content = this.recruitmentPanel();
      } else if (panel === "shop") {
        title = "仪器采购";
        kicker = "EQUIPMENT CATALOG";
        subtitle = "仪器必须放进对应房间，占仪器位。每台仪器都有领域/论文 Buff；买不起可以去公共平台。";
        content = this.shopPanel();
      } else if (panel === "training") {
        title = "交流与培训";
        kicker = "TRAINING & CONFERENCES";
        subtitle = "花钱把重点培养对象送出去，换六项能力和领域经验。培训期间不能参与课题。";
        content = this.trainingPanel();
      } else if (panel === "tasks") {
        title = "导师办公室";
        kicker = "SUPERVISOR'S OFFICE";
        subtitle = "周启明教授的任务决定经费、信任和院士提名；院士最终还要过学部投票。";
        content = this.tasksPanel();
      } else {
        title = "实验室手册";
        kicker = "FIELD MANUAL";
        subtitle = "一局五个学年，目标是让周启明教授当选院士。随时点右上角“玩法”查看。";
        content = this.helpPanel();
      }
      this.openModal({
        type: "panel",
        panel,
        kicker,
        title,
        subtitle,
        content,
        wide: panel === "people" || panel === "projects" || panel === "recruitment" || panel === "shop" || panel === "training"
      });
    },

    peoplePanel() {
      const state = this.state;
      const staffList = C.staff(state);
      const studentList = C.students(state);
      const personCard = (person) => {
        const role = roleOf(person);
        const projects = C.personProjects(state, person);
        const progress = C.studentProgress(state, person);
        return `<button class="person-roster-card" data-action="select-person" data-person="${person.id}">
          ${avatarHtml(person)}
          <span class="person-roster-copy"><span class="person-roster-name">${escapeHtml(person.name)} <small class="roster-load">${projects.length ? `兼 ${projects.length} 个课题` : "空闲"}</small></span><span class="person-roster-meta">${role.name} · ${fieldOf(person.primaryField).name} · ${projects[0] ? escapeHtml(projects[0].title) : "待分配"}</span>${person.kind === "student" ? `<span class="person-roster-meta">${progress.papers} 篇 / 一作 ${progress.firstAuthor} · ${progress.met ? "达标" : "培养中"}</span>` : ""}</span>

          <div class="people-roster">${staffList.map(personCard).join("") || `<div class="empty-state">没有工作人员。</div>`}</div>
        </div>
        <div class="people-section">
          <div class="people-section-head"><h3>学生与博后 <span>${studentList.length} 人</span></h3><span>硕士 3 年 · 博士 4 年 · 博后 2 年 · 未达标会延毕</span></div>
          <div class="people-roster">${studentList.map(personCard).join("") || `<div class="empty-state">还没有招到学生。</div>`}</div>

    projectsPanel() {
      const state = this.state;
      const active = state.projects.filter((project) => project.status === "active");
      const drafts = state.projects.filter((project) => project.status === "draft");
      const completed = state.projects.filter((project) => project.status === "completed");
      const available = C.projectTemplatesAvailable(state);
      const activeCard = (project) => {
        const percent = C.clamp((project.data / project.dataGoal) * 100, 0, 100);
        const field = fieldOf(project.field);
        const ready = (project.milestones || []).filter((milestone) => milestone.ready).length;
        const req = C.projectRequirementStatus(state, project);
        return `<button class="project-board-card" data-action="select-project" data-project="${project.id}">
          <div class="project-board-top"><span class="project-board-icon" style="background:${field.pale}">${field.icon}</span><span class="project-board-title">${escapeHtml(project.title)}</span><span class="meta-pill">${project.tier}</span></div>
          <div class="project-board-desc">${escapeHtml(project.desc)}</div>
          <div class="project-progress-large" style="margin-top:9px;"><i style="width:${percent}%"></i></div>
          <div class="project-board-bottom"><span class="project-reward"><b>${percent.toFixed(0)}%</b> 数据 · ${project.team.length}/${project.teamCap} 人${req.ok ? "" : ` · <em class="text-bad">缺 ${escapeHtml(req.missing.join("、"))}</em>`}</span><span class="project-reward">${ready ? `<b>${ready}</b> 个可投稿` : "暂无投稿窗口"}</span></div>
        </button>`;
      };
      const draftCard = (project) => {
        const field = fieldOf(project.field);
        return `<div class="project-board-card draft-card">
          <div class="project-board-top"><span class="project-board-icon" style="background:${field.pale}">${field.icon}</span><span class="project-board-title">${escapeHtml(project.title)}</span><span class="meta-pill">学生提案</span></div>
          <div class="project-board-desc">${escapeHtml(project.desc)}</div>
          <div class="project-board-bottom"><span class="project-reward">等待开题讨论 · 1AP<br><small>${escapeHtml(project.source || "")}</small></span><button class="button button-small button-gold" data-action="approve-proposal" data-project="${project.id}">开题讨论</button></div>
        </div>`;
      };
      const availableCard = (template) => {
        const field = fieldOf(template.field);
        const requirements = [
          template.requiredRoom ? D.ROOM_TYPES.find((room) => room.id === template.requiredRoom)?.name : null,
          template.requiredInstrument ? D.INSTRUMENTS.find((item) => item.id === template.requiredInstrument)?.name : null
        ].filter(Boolean);
        return `<div class="project-board-card">
          <div class="project-board-top"><span class="project-board-icon" style="background:${field.pale}">${field.icon}</span><span class="project-board-title">${escapeHtml(template.title)}</span><span class="meta-pill">${template.tier}</span></div>
          <div class="project-board-desc">${escapeHtml(template.desc)}</div>
          <div class="project-board-bottom"><span class="project-reward">声望 <b>${template.minRep}</b> · ${template.dataGoal} 数据 · ${money(template.grant)} 尾款${requirements.length ? `<br>门槛：${escapeHtml(requirements.join(" + "))}` : "<br>无特殊房间/仪器门槛"}</span><button class="button button-small button-primary" data-action="start-project" data-template="${template.id}">开题·1AP</button></div>
        </div>`;
      };
      return `
        ${active.length ? `<div class="modal-section-title">进行中的课题 <span>${active.length} 个</span></div><div class="projects-board">${active.map(activeCard).join("")}</div>` : `<div class="empty-state">还没有进行中的课题。</div>`}
        ${drafts.length ? `<div class="modal-section-title" style="margin-top:18px;">学生提案 · 待立项 <span>需要开题讨论</span></div><div class="projects-board">${drafts.map(draftCard).join("")}</div>` : ""}
        <div class="modal-section-title" style="margin-top:18px;">可以开的新题 <span>只显示已解锁研究方向</span></div>
        ${available.length ? `<div class="projects-board">${available.map(availableCard).join("")}</div>` : `<div class="empty-state">当前声望/方向还不够解锁更多课题。招一个其他方向的人，可能打开新的交叉学科。</div>`}
        ${completed.length ? `<div class="modal-section-title" style="margin-top:18px;">已结题 <span>历史</span></div><div class="projects-board">${completed.map((project) => `<div class="project-board-card"><div class="project-board-top"><span class="project-board-icon">✓</span><span class="project-board-title">${escapeHtml(project.title)}</span></div><div class="project-board-bottom"><span class="project-reward">结题数据 ${project.dataGoal}%</span><span class="meta-pill">已完成</span></div></div>`).join("")}</div>` : ""}
        ${state.papers.length ? `<div class="modal-section-title" style="margin-top:18px;">已发表论文 <span>${state.papers.length} 篇 · 累计 IF ${C.round(state.totalIF, 1)}</span></div><div class="paper-archive">${state.papers.slice().reverse().map((paper) => `<div class="paper-archive-row"><span class="paper-archive-icon">📄</span><span class="paper-archive-copy"><b>${escapeHtml(paper.title)}</b><small>${escapeHtml(paper.journal)} · ${C.monthInfo(paper.month).calendar} · 第一作者 ${escapeHtml(paper.firstAuthor || "—")} · 作者 ${paper.authors.map(escapeHtml).join("、") || "实验室集体"}</small></span><span class="paper-archive-if">IF ${paper.impact}</span></div>`).join("")}</div>` : ""}
      `;
    },

    recruitmentPanel() {
      const state = this.state;
      const recruiter = C.recruiterBonus(state);
      const freeLeft = state.freeRefreshLeft || 0;
      return `
        <div class="report-hero" style="margin-bottom:12px;">
          <div><div class="report-date">TALENT MARKET / SEMESTER REFRESH</div><div class="report-title">候选池 · ${state.candidates.length} 人</div><div class="panel-subtitle" style="margin-top:4px;">${recruiter ? `在职宣传/社交人员 ${recruiter} 名，候选质量已提升。` : "没有行政宣传或社交达人，候选质量一般。"} 下一次学期刷新：${C.monthInfo(C.nextRefreshMonth(state)).calendar}；免费刷新次数 ${freeLeft}/2。</div></div>
          <div style="text-align:right;"><div class="report-net" style="font-size:17px;">${C.labCapacity(state) - C.activePeople(state).length}<small>编制空位</small></div></div>
        </div>
        <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;">
          <button class="button button-primary" data-action="refresh-free" ${freeLeft <= 0 ? "disabled" : ""}>免费刷新 · 还剩 ${freeLeft} 次</button>
          <button class="button button-ghost" data-action="refresh-candidates">付费刷新 · ${money(25000)} / 1AP</button>
          <span class="meta-pill" style="align-self:center;">免费次数每学期恢复</span>

        ${state.candidates.length ? `<div class="candidate-grid">${state.candidates.map((candidate) => this.candidateCard(candidate)).join("")}</div>` : `<div class="empty-state">候选池空了。等待下一次刷新，或投广告。</div>`}
      `;
    },

    candidateCard(candidate) {
      const role = D.ROLES[candidate.roleId] || D.ROLES.phd;
      const rarity = D.RARITIES[candidate.rarity] || D.RARITIES.C;
      const traits = (candidate.traits || []).map((id) => D.TRAITS.find((item) => item.id === id)).filter(Boolean);
      const cost = candidateCost(candidate);
      const requirement = candidate.studentRequirements || (role.student ? D.STUDENT_REQUIREMENTS[role.student] : null);
      return `<article class="candidate-card" style="${rarityStyle(candidate.rarity)}">
        <div class="candidate-head">
          <div class="candidate-avatar" style="background:${rarity.pale};">${candidate.avatar}</div>
          <div style="min-width:0;flex:1;"><div class="candidate-name">${escapeHtml(candidate.name)} ${candidate.special ? `<span class="special-pill">人员表</span>` : ""}</div><div class="candidate-role">${escapeHtml(candidate.roleName)} · ${role.kind === "student" ? (requirement ? `${requirement.label} · ${requirement.months / 12} 年` : candidate.degree) : "工作人员"}</div></div>
          <span class="rarity-pill rarity-${candidate.rarity} candidate-rarity">${rarity.id}</span>
        </div>
        <div class="candidate-fields">${fieldTagHtml(candidate.primaryField, false, C.fieldLevel(candidate, candidate.primaryField))}${fieldTagHtml(candidate.secondaryField, true, C.fieldLevel(candidate, candidate.secondaryField))}</div>
        <div class="candidate-traits">${traits.map((trait) => `<span class="trait-pill is-${traitTone(trait)}" title="${escapeHtml(trait.desc)}">${escapeHtml(trait.name)}</span>`).join("") || `<span class="trait-pill is-mixed">无标签</span>`}</div>
        <div class="candidate-stats">${D.STAT_KEYS.map((key) => `<div class="candidate-stat"><span>${statLabel(key)}</span><b>${C.effectiveStat(candidate, key)}</b></div>`).join("")}</div>
        <div class="candidate-trait candidate-trait-desc">${traits.map((trait) => `<span class="tone-${traitTone(trait)}">${traitTone(trait) === "good" ? "增益" : traitTone(trait) === "bad" ? "减益" : "双刃"}</span> ${escapeHtml(trait.name)}：${escapeHtml(trait.desc)}`).join("<br>") || "没有特殊标签"}</div>
        ${requirement ? `<div class="candidate-requirement">${escapeHtml(requirement.desc)}</div>` : ""}
        <div class="candidate-bottom"><span class="candidate-cost">${role.kind === "student" ? "培养启动费" : "入职安置费"}<b>${money(cost)}</b><small>${role.kind === "student" ? "月津贴" : "月薪"} ${money(candidate.salary)} · 由能力/特质/身份计算</small></span><button class="button button-small button-primary" data-action="hire" data-candidate="${candidate.id}">${role.kind === "student" ? "录取" : "招聘"}</button></div>
      </article>`;
    },

    shopPanel() {
      const state = this.state;
      return `
        <div class="report-hero" style="margin-bottom:12px;">
          <div><div class="report-date">EQUIPMENT / INVENTORY</div><div class="report-title">让数据跑得快一点</div><div class="panel-subtitle" style="margin-top:4px;">仪器必须放进对应房间，并占用仪器位；买不起的设备可以去公共平台按次预约。</div></div>
          <div style="text-align:right;"><div class="report-net" style="font-size:17px;">${state.instruments.length}<small>台仪器</small></div></div>
        </div>
        <div class="instrument-grid">
          ${D.INSTRUMENTS.map((item) => {
            const field = fieldOf(item.field);
            const owned = state.instruments.filter((instrument) => instrument.key === item.id).length;
            const room = D.ROOM_TYPES.find((candidate) => candidate.id === item.requiresRoom);
            return `<article class="shop-card">
              <div class="shop-card-head"><span class="shop-icon">${item.icon}</span><div><div class="shop-name">${escapeHtml(item.name)}</div><div class="shop-meta">${field.name} · 设备加成 +${item.bonus} · 论文 +${Math.round((item.paperBonus || 0) * 100)}%</div></div></div>

              <div class="shop-bottom"><div class="shop-price">${money(item.price)}<small>维护 ${money(item.upkeep)}/月 · 已拥有 ${owned} 台</small></div><button class="button button-small" data-action="buy-instrument" data-key="${item.id}">采购·1AP</button></div>

        <div class="empty-state" style="text-align:left;margin-top:10px;">在具体课题的详情页里点“公共平台预约”，为那个课题租用一个月；预约可替代该课题要求的仪器，但房间仍然必须是自有房间。</div>
      `;
    },

    trainingPanel() {
      const state = this.state;

      return `
        <div class="report-hero" style="margin-bottom:12px;">

        </div>
        ${trainingPeople.length ? `<div class="empty-state" style="text-align:left;padding:10px 12px;margin-bottom:10px;">正在培训：${trainingPeople.map((person) => `${escapeHtml(person.name)} · ${escapeHtml(person.training.name)}`).join(" / ")}</div>` : ""}

            <div class="training-bottom"><span class="project-reward">需要 1AP</span><button class="button button-small button-primary" data-action="open-training-offer" data-offer="${offer.id}">指派成员</button></div>

    tasksPanel() {
      const state = this.state;
      const task = state.task;
      if (!task) {
        return `<div class="empty-state">导师暂时没有任务。自由发挥，把实验室做大。</div>`;
      }
      const progress = C.taskProgress(state, task);
      const percent = C.clamp((progress / task.target) * 100, 0, 100);
      const deadline = Math.max(0, task.createdAt + task.deadline - state.month);
      return `
        <div class="event-hero">
          <div class="event-kicker">SUPERVISOR'S OFFICE · 周启明</div>
          <div class="event-title">${escapeHtml(task.title)}</div>
          <div class="event-desc">${escapeHtml(task.desc)}<br><br>“小满，实验室的经费不是天上掉下来的。这个月把这件事办了。”</div>
          <div class="task-progress-row" style="margin-top:15px;"><div class="task-track"><i style="width:${percent}%"></i></div><span class="task-progress-text">${progress} / ${task.target} · 剩 ${deadline} 个月</span></div>
          <div class="project-meta-row"><span class="meta-pill">奖励 ${money(task.reward.funds)}</span><span class="meta-pill">声望 +${task.reward.reputation}</span><span class="meta-pill">导师好感 +${task.reward.favor}</span><span class="meta-pill">逾期好感 -${task.penalty.favor}</span></div>
        </div>
        <div class="modal-section-title" style="margin-top:18px;">已经完成的任务 <span>${state.stats.tasksDone} 件</span></div>
        <div class="empty-state" style="text-align:left;">导师任务完成数和你的院士提名积分、经费上限都有关系。不要把每一张便条都留到截止日期。</div>
      `;
    },

      return `
        <div class="event-hero">
          <div class="event-kicker">HOW TO KEEP THE LIGHTS ON · V0.2</div>

          <div class="event-desc">每月行动点有限。把成员安排进课题，结束本月后自动推进数据；数据到 30/60/100% 可以投稿，论文带来经费、声望和院士提名积分。资金为负或人员走光会失败。院士提名达到 100% 后，还要通过学部投票。</div>
        </div>
        <div class="onboarding-steps" style="padding:14px 0 0;">
          <div class="onboarding-step"><div class="onboarding-step-num">01 · PEOPLE</div><div class="onboarding-step-title">学生有培养年限</div><div class="onboarding-step-desc">硕士 3 年、博士 4 年、博后 2 年。毕业/出站要求不同：论文数、第一作者、累计 IF 和导师好感。到年限未达标会延毕 6 个月。</div></div>

        <div class="panel-body" style="padding:0 0 4px;">

    showSetupWizard(locked) {
      if (!this.setupDraft) this.setupDraft = JSON.parse(JSON.stringify(D.DEFAULT_SETUP));
      this.setupLocked = Boolean(locked);
      const draft = this.setupDraft;
      const direction = D.RESEARCH_DIRECTIONS.find((item) => item.id === draft.directionId) || D.RESEARCH_DIRECTIONS[0];
      const projectOptions = direction.startingProjects
        .map((id) => D.PROJECT_TEMPLATES.find((item) => item.id === id))
        .filter(Boolean);
      const roomSelected = (id) => draft.roomTypes.indexOf(id) >= 0;
      const instrumentSelected = (id) => draft.instrumentKeys.indexOf(id) >= 0;
      const projectSelected = (id) => draft.projectIds.indexOf(id) >= 0;
      const roomName = (id) => D.ROOM_TYPES.find((item) => item.id === id)?.name || id;
      const instrumentInfo = (id) => D.INSTRUMENTS.find((item) => item.id === id);
      const projectWarning = (template) => {
        const missing = [];
        if (template.requiredRoom && !roomSelected(template.requiredRoom)) missing.push(roomName(template.requiredRoom));
        if (template.requiredInstrument && !instrumentSelected(template.requiredInstrument)) missing.push(instrumentInfo(template.requiredInstrument)?.name || template.requiredInstrument);
        return missing;
      };
      const directionCards = D.RESEARCH_DIRECTIONS.map((item) => `
        <button class="setup-card setup-direction ${draft.directionId === item.id ? "is-selected" : ""}" data-action="setup-direction" data-value="${item.id}">
          <span class="setup-card-icon" style="background:${item.color}22;">${item.icon}</span>
          <span class="setup-card-copy"><b>${escapeHtml(item.name)}</b><small>${item.fields.map((field) => fieldOf(field).short).join(" · ")}</small><em>${escapeHtml(item.desc)}</em></span>
        </button>`).join("");
      const roomCards = D.ROOM_TYPES.map((room) => `
        <button class="setup-card ${roomSelected(room.id) ? "is-selected" : ""}" data-action="setup-room" data-value="${room.id}">
          <span class="setup-card-icon">${room.icon}</span>
          <span class="setup-card-copy"><b>${escapeHtml(room.name)}</b><small>${room.capacity ? `${room.capacity} 个仪器位` : "人员编制"} · ${room.field === "all" ? "综合" : fieldOf(room.field).short}</small><em>${escapeHtml(room.desc)}</em></span>
        </button>`).join("");
      const instrumentCards = D.STARTING_INSTRUMENT_POOL.map((id) => instrumentInfo(id)).filter(Boolean).map((item) => {
        const roomOk = roomSelected(item.requiresRoom);
        return `<button class="setup-card ${instrumentSelected(item.id) ? "is-selected" : ""} ${roomOk ? "" : "is-unavailable"}" data-action="setup-instrument" data-value="${item.id}">
          <span class="setup-card-icon">${item.icon}</span>
          <span class="setup-card-copy"><b>${escapeHtml(item.name)}</b><small>${roomOk ? `需要 ${roomName(item.requiresRoom)}` : `先选 ${roomName(item.requiresRoom)}`} · 加成 +${item.bonus}</small><em>${escapeHtml(item.buff || item.desc)}</em></span>
        </button>`;
      }).join("");
      const projectCards = projectOptions.map((template) => {
        const missing = projectWarning(template);
        return `<button class="setup-card ${projectSelected(template.id) ? "is-selected" : ""}" data-action="setup-project" data-value="${template.id}">
          <span class="setup-card-icon">${fieldOf(template.field).icon}</span>
          <span class="setup-card-copy"><b>${escapeHtml(template.title)}</b><small>${template.tier} 级 · ${template.dataGoal} 数据 · ${template.teamCap} 人</small><em>${escapeHtml(template.desc)}${missing.length ? `<strong class="setup-warning">缺少：${missing.join("、")}</strong>` : ""}</em></span>
        </button>`;
      }).join("");
      const content = `
        <div class="setup-note">你可以从房间池选 <b>3 间房</b>、从课题池选 <b>2 个课题</b>、从仪器池选 <b>2 台仪器</b>。开局方向决定核心领域；后期招到其他方向的人，会解锁交叉学科。</div>
        <div class="setup-step"><div class="setup-step-head"><span>01 · RESEARCH DIRECTION</span><b>选一个主攻方向</b></div><div class="setup-grid direction-grid">${directionCards}</div></div>
        <div class="setup-step"><div class="setup-step-head"><span>02 · ROOM POOL · ${draft.roomTypes.length}/3</span><b>先搭起三间房</b></div><div class="setup-grid room-grid">${roomCards}</div></div>
        <div class="setup-step"><div class="setup-step-head"><span>03 · INSTRUMENT POOL · ${draft.instrumentKeys.length}/2</span><b>两台起家仪器</b></div><div class="setup-grid instrument-grid">${instrumentCards}</div></div>
        <div class="setup-step"><div class="setup-step-head"><span>04 · PROJECT POOL · ${draft.projectIds.length}/2</span><b>两个起步课题</b></div><div class="setup-grid project-grid">${projectCards}</div></div>
        <div class="setup-summary"><span>起始资金 <b>${money(1300000)}</b></span><span>行动点 <b>4 AP</b></span><span>班底 <b>1 技术员 + 1 博士生</b></span><span>后期 <b>招聘/培训解锁交叉方向</b></span></div>
      `;
      this.openModal({
        type: "setup",
        panel: "setup",
        kicker: "START A NEW LAB · 2026",
        title: "这次，从哪里开始？",
        subtitle: "研究方向、房间、仪器和课题都会改变前两年的节奏。选好后不能在本局中途更换方向。",
        content,
        wide: true,
        locked: this.setupLocked,
        customClass: "setup-modal",
        footer: `${this.setupLocked ? "" : `<button class="button" data-action="close-modal">再看看现在的实验室</button>`}<button class="button button-gold" data-action="setup-confirm">建立我的实验室</button>`
      });
    },

    showEnding() {
      const state = this.state;
      const ending = state.ending || {
        title: "实验室还在继续",
        desc: "这一局结束了。",
        type: state.phase
      };
      const academic = C.academicianStatus(state);
      const icon = state.phase === "won" ? "🏅" : state.phase === "lost" ? "🕯️" : "🌾";
      const content = `<div class="ending-scene">
        <div class="ending-icon">${icon}</div>
        <div class="ending-title">${escapeHtml(ending.title)}</div>
        <div class="ending-desc">${escapeHtml(ending.desc)}</div>
        <div class="ending-stats">
          <div class="ending-stat"><b>${state.month}</b><span>个月</span></div>
          <div class="ending-stat"><b>${state.papers.length}</b><span>篇论文</span></div>
          <div class="ending-stat"><b>${academic.totalIF}</b><span>累计 IF</span></div>
          <div class="ending-stat"><b>${academic.score}</b><span>院士积分</span></div>
          <div class="ending-stat"><b>${state.voteFailures || 0}</b><span>投票失败</span></div>
        </div>
        ${state.phase === "won" ? `<div class="ending-note">结局已解锁。下一局可以换一个研究方向、换一套房间/仪器/课题组合，走完全不同的路线。</div>` : ""}
      </div>`;
      this.openModal({
        type: "ending",
        panel: "ending",
        kicker: state.phase === "won" ? "ELECTION SUCCESS" : state.phase === "lost" ? "LAB CLOSED" : "FIVE YEARS LATER",
        title: state.phase === "won" ? "周启明教授当选院士" : state.phase === "lost" ? "这间实验室的灯灭了" : "五年之后",
        subtitle: "这个项目的阶段结束。你可以重新开始，换一种研究方向。",
        content,
        wide: true,
        locked: true,
        footer: `<button class="button button-primary" data-action="new-game">换个方向 · 重新开始</button>`
      });
    },

    openModal(options) {
      this.modal = { type: options.type || "panel", panel: options.panel || null };
      this.modalLocked = Boolean(options.locked);
      const closeButton = options.locked
        ? ""
        : `<button class="modal-close" data-action="close-modal" aria-label="关闭">×</button>`;
      const modalClass = [
        "modal",
        options.wide ? "modal-wide" : "",
        options.narrow ? "modal-narrow" : "",
        options.customClass || ""
      ].filter(Boolean).join(" ");
      const footer = options.footer ? `<div class="modal-footer">${options.footer}</div>` : "";
      $("#modalRoot").innerHTML = `<div class="modal-backdrop">
        <div class="${modalClass}" role="dialog" aria-modal="true" aria-label="${escapeHtml(options.title || "实验室")}">
          <div class="modal-header">
            <div>
              <div class="modal-kicker">${escapeHtml(options.kicker || "LAB NOTES")}</div>
              <div class="modal-title">${escapeHtml(options.title || "")}</div>
              ${options.subtitle ? `<div class="modal-subtitle">${options.subtitle}</div>` : ""}
            </div>
            ${closeButton}
          </div>
          <div class="modal-body">${options.content || ""}</div>
          ${footer}
        </div>
      </div>`;
      this.updateNavActive();
    },

    closeModal(force) {
      if (this.modalLocked && !force) return;
      $("#modalRoot").innerHTML = "";
      this.modal = null;
      this.modalLocked = false;
      this.updateNavActive();
    },

    toast(message, tone) {
      const root = $("#toastRoot");
      const node = document.createElement("div");
      node.className = `toast ${tone === "bad" ? "is-bad" : tone === "gold" ? "is-gold" : ""}`;
      node.textContent = message;
      root.appendChild(node);
      setTimeout(() => {
        node.style.opacity = "0";
        node.style.transform = "translateY(5px)";
        setTimeout(() => node.remove(), 240);
      }, 3200);
    },

    finishMutation(message, tone) {
      this.saveGame();
      this.render();
      if (message) this.toast(message, tone);
    },

    handleAction(action, element) {
      const state = this.state;
      const dataset = element.dataset;
      switch (action) {
        case "save": {
          this.saveGame();
          this.toast("进度已保存到本机。", "good");
          return true;
        }
        case "community": {
          this.openCommunity(true);
          return true;
        }
        case "login-community": {
          const input = $("#nicknameInput");
          const nickname = window.LabCommunity.setNickname(input ? input.value : "");
          if (!nickname) {
            this.toast("先输入一个昵称（最多 16 个字符）。", "bad");
            return true;
          }
          this.nickname = nickname;
          this.state.nickname = nickname;
          this.saveGame();
          this.closeModal(true);
          this.render();
          if (this.loginEditing) {
            this.loginEditing = false;
            this.syncCommunity(true);
            this.openCommunity(true);
          } else {
            this.syncCommunity(false);
            this.afterLogin();
          }
          return true;
        }
        case "sync-community": {
          this.syncCommunity(true).then(() => this.refreshCommunity(true));
          return true;
        }
        case "refresh-community": {
          this.refreshCommunity(true);
          return true;
        }
        case "visit-player": {
          this.openVisit(dataset.player);
          return true;
        }
        case "back-to-community": {
          this.openCommunity(true);
          return true;
        }
        case "edit-nickname": {
          this.showLogin(true);
          return true;
        }
        case "export-save": {
          this.exportSave();
          return true;
        }
        case "import-save": {
          const input = $("#importSaveInput");
          if (input) input.click();
          return true;
        }
        case "help": {
          this.openPanel("help");
          return true;
        }
        case "open-panel-shop":
        case "open-shop": {
          this.openPanel("shop");
          return true;
        }
        case "close-modal": {
          this.closeModal();
          return true;
        }
        case "back-to-lab": {
          this.backToLab();
          return true;
        }
        case "new-game": {
          this.openModal({
            type: "confirm",
            panel: "confirm",
            kicker: "NEW PROJECT",
            title: "重新开始新项目？",
            subtitle: "确认后会进入研究方向与起始配置选择；当前实验室的进度会被覆盖。",
            content: `<div class="empty-state" style="text-align:left;">你会重新选择方向、3 间房、2 台仪器和 2 个起步课题。当前实验室的存档会被覆盖，这个动作不能撤销。</div>`,
            narrow: true,
            footer: `<button class="button" data-action="close-modal">先不重来</button><button class="button button-coral" data-action="confirm-new-game">进入开局选择</button>`
          });
          return true;
        }
        case "confirm-new-game": {
          this.setupDraft = JSON.parse(JSON.stringify(D.DEFAULT_SETUP));
          this.showSetupWizard(false);
          return true;
        }
        case "start-onboarding": {
          this.setupDraft = JSON.parse(JSON.stringify(D.DEFAULT_SETUP));
          this.showSetupWizard(true);
          return true;
        }
        case "setup-direction": {
          if (!this.setupDraft) return true;
          this.setupDraft.directionId = dataset.value;
          const direction = D.RESEARCH_DIRECTIONS.find((item) => item.id === dataset.value);
          this.setupDraft.projectIds = direction ? direction.startingProjects.slice(0, 2) : [];
          this.showSetupWizard(this.setupLocked);
          return true;
        }
        case "setup-room": {
          if (!this.setupDraft) return true;
          const value = dataset.value;
          const index = this.setupDraft.roomTypes.indexOf(value);
          if (index >= 0) {
            this.setupDraft.roomTypes.splice(index, 1);
            this.setupDraft.instrumentKeys = this.setupDraft.instrumentKeys.filter((key) => {
              const info = D.INSTRUMENTS.find((item) => item.id === key);
              return info && this.setupDraft.roomTypes.indexOf(info.requiresRoom) >= 0;
            });
          } else {
            if (this.setupDraft.roomTypes.length >= 3) {
              this.toast("开局只能选 3 间房，先取消一间。", "bad");
              return true;
            }
            this.setupDraft.roomTypes.push(value);
          }
          this.showSetupWizard(this.setupLocked);
          return true;
        }
        case "setup-instrument": {
          if (!this.setupDraft) return true;
          const value = dataset.value;
          const info = D.INSTRUMENTS.find((item) => item.id === value);
          const index = this.setupDraft.instrumentKeys.indexOf(value);
          if (index >= 0) {
            this.setupDraft.instrumentKeys.splice(index, 1);
          } else {
            if (this.setupDraft.instrumentKeys.length >= 2) {
              this.toast("起始仪器只能选 2 台，先取消一台。", "bad");
              return true;
            }
            if (!info || this.setupDraft.roomTypes.indexOf(info.requiresRoom) < 0) {
              this.toast(`${info.name}需要先在房间池里选择${D.ROOM_TYPES.find((room) => room.id === info.requiresRoom)?.name || "对应房间"}。`, "bad");
              return true;
            }
            this.setupDraft.instrumentKeys.push(value);
          }
          this.showSetupWizard(this.setupLocked);
          return true;
        }
        case "setup-project": {
          if (!this.setupDraft) return true;
          const value = dataset.value;
          const index = this.setupDraft.projectIds.indexOf(value);
          if (index >= 0) {
            this.setupDraft.projectIds.splice(index, 1);
          } else {
            if (this.setupDraft.projectIds.length >= 2) {
              this.toast("起步课题只能选 2 个，先取消一个。", "bad");
              return true;
            }
            this.setupDraft.projectIds.push(value);
          }
          this.showSetupWizard(this.setupLocked);
          return true;
        }
        case "setup-confirm": {
          if (!this.setupDraft) return true;
          const validation = C.validateSetup(this.setupDraft);
          if (!validation.ok) {
            this.toast(validation.errors[0] || "开局配置还不完整。", "bad");
            return true;
          }
          this.state = C.newGame(Math.floor(Date.now() / 1000) >>> 0, validation.setup);
          this.state.seenIntro = true;
          this.selected = { type: "lab", id: null };
          this.setupDraft = null;
          this.saveGame();
          this.closeModal(true);
          this.render();
          this.toast(`新的「${this.state.directionName}」实验室开张了。`, "gold");
          return true;
        }
        case "select-room": {
          this.selected = { type: "room", id: Number(dataset.slot) };
          this.render();
          return true;
        }
        case "select-person": {
          this.selected = { type: "person", id: dataset.person };
          this.closeModal(true);
          this.render();
          return true;
        }
        case "select-project": {
          this.selected = { type: "project", id: dataset.project };
          this.closeModal(true);
          this.render();
          return true;
        }
        case "open-build": {
          this.openBuildPanel(Number(dataset.slot));
          return true;
        }
        case "build-room": {
          const result = C.buildRoom(this.state, Number(dataset.slot), dataset.type);
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.closeModal(true);
          this.finishMutation("新的实验室房间落成。", "good");
          return true;
        }
        case "upgrade-room": {
          const result = C.upgradeRoom(this.state, Number(dataset.slot));
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.finishMutation("房间升级完成。", "good");
          return true;
        }
        case "buy-instrument": {
          const result = C.buyInstrument(this.state, dataset.key);
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.saveGame();
          this.render();
          this.openPanel("shop");
          this.toast(`采购完成：${result.room.name}里多了一台新仪器。`, "good");
          return true;
        }
        case "refresh-free": {
          const result = C.refreshCandidates(this.state, false);
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.saveGame();
          this.render();
          this.openPanel("recruitment");
          this.toast(`候选池已刷新，本学期还剩 ${result.freeLeft} 次免费刷新。`, "good");
          return true;
        }
        case "refresh-candidates": {
          const result = C.refreshCandidates(this.state, true);
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.saveGame();
          this.render();
          this.openPanel("recruitment");
          this.toast("招聘广告已投放，候选池刷新。", "gold");
          return true;
        }
        case "approve-proposal": {
          const result = C.approveProposal(this.state, dataset.project);
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.selected = { type: "project", id: result.project.id };
          this.finishMutation("开题讨论完成，课题正式立项。", "good");
          return true;
        }
        case "open-platform": {
          this.openPlatformPanel(dataset.project);
          return true;
        }
        case "book-platform": {
          const result = C.bookExternalInstrument(this.state, dataset.project, dataset.instrument);
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.closeModal(true);
          this.selected = { type: "project", id: dataset.project };
          this.finishMutation(`公共平台预约成功：${result.booking.name}，支付 ${money(result.fee)}。`, "good");
          return true;
        }
        case "apply-academician": {
          this.openAcademicianVote();
          return true;
        }
        case "vote-cancel": {
          this.closeModal(true);
          return true;
        }
        case "confirm-academician-vote": {
          const result = C.applyForAcademician(this.state);
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.saveGame();
          this.render();
          if (result.success) {
            this.closeModal(true);
            this.showEnding();
          } else {
            this.openModal({
              type: "vote-failed",
              panel: "vote-failed",
              kicker: "ACADEMICIAN VOTE · FAILED",
              title: "学部投票没有通过",
              subtitle: "提名进度倒退，声望与导师信任受损。",
              content: `<div class="ending-scene"><div class="ending-icon">📉</div><div class="ending-title">评审意见很尖锐</div><div class="ending-desc">${escapeHtml(`通过率 ${Math.round(result.chance * 100)}%。这次失败让提名积分减少 ${42}，声望 -12，导师好感 -8。12 个月后才能再次提名。`)}</div><div class="ending-stats"><div class="ending-stat"><b>${this.state.voteFailures}</b><span>失败次数</span></div><div class="ending-stat"><b>${Math.round(C.academicianStatus(this.state).percent)}%</b><span>当前进度</span></div></div></div>`,
              locked: true,
              narrow: true,
              footer: `<button class="button button-primary" data-action="vote-failed-close">回到实验室</button>`
            });
          }
          return true;
        }
        case "vote-failed-close": {
          this.closeModal(true);
          this.render();
          return true;
        }
        case "hire": {
          const result = C.hireCandidate(this.state, dataset.candidate);
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.saveGame();
          this.render();
          this.openPanel("recruitment");
          this.toast(`${result.person.name}加入了实验室。`, "good");
          return true;
        }
        case "start-project": {
          const result = C.startProject(this.state, dataset.template);
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.selected = { type: "project", id: result.project.id };
          this.saveGame();
          this.render();
          this.closeModal(true);
          this.toast(`《${result.project.title}》开题成功。`, "good");
          return true;
        }
        case "open-team": {
          this.openTeamPanel(dataset.project);
          return true;
        }
        case "save-team": {
          const ids = $$('input[name="team"]:checked', $("#modalRoot")).map((input) => input.value);
          const result = C.assignProjectTeam(this.state, dataset.project, ids);
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.saveGame();
          this.closeModal(true);
          this.render();
          this.toast("课题小组已更新。", "good");
          return true;
        }
        case "assign-person": {
          const project = selectedProject(this.state, dataset.project);
          if (!project) return true;
          const team = project.team.slice();
          if (team.indexOf(dataset.person) < 0) team.push(dataset.person);
          const result = C.assignProjectTeam(this.state, dataset.project, team);
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.finishMutation("已把人安排进课题。", "good");
          return true;
        }
        case "talk": {
          const result = C.talkTo(this.state, dataset.person);
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.finishMutation("一杯咖啡的时间，关系近了一点。", "good");
          return true;
        }
        case "open-training-for": {
          this.openTrainingForPerson(dataset.person);
          return true;
        }
        case "open-training-offer": {
          this.openTrainingForOffer(dataset.offer);
          return true;
        }
        case "assign-training": {
          const result = C.assignTraining(this.state, dataset.person, dataset.offer);
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.closeModal(true);
          this.finishMutation(`${result.person.name}出发参加「${result.offer.name}」。`, "good");
          return true;
        }
        case "open-paper": {
          this.openPaper(dataset.project, Number(dataset.milestone));
          return true;
        }
        case "select-journal": {
          if (!this.paperContext) return true;
          const option = this.paperContext.prepared.options[Number(dataset.index)];
          if (!option || option.eligible === false) {
            this.toast(option ? option.eligibilityText : "这个投稿选项不可用。", "bad");
            return true;
          }
          this.paperContext.selected = Number(dataset.index);
          this.renderPaperModal();
          return true;
        }
        case "submit-paper": {
          if (!this.paperContext) return true;
          const result = C.submitPaper(this.state, this.paperContext.projectId, this.paperContext.milestone, this.paperContext.selected);
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.saveGame();
          this.render();
          if (result.accepted) {
            this.openModal({
              type: "paper-result",
              panel: "paper-result",
              kicker: "ACCEPTED · 接收",
              title: "论文发表了",
              subtitle: "这一页纸会变成经费、声望和导师的信任。",
              content: `<div class="paper-result"><div class="paper-result-icon">📄</div><h3>${escapeHtml(result.option.journal)} · IF ${result.option.impact}</h3><p>${escapeHtml(result.message)}</p><div class="paper-result-card"><div class="paper-preview-kicker">NEW PUBLICATION · ${monthText(this.state).calendar}</div><div class="paper-preview-title" style="font-size:15px;">${escapeHtml(result.paper.title)}</div><div class="paper-preview-meta"><span>第一作者：${escapeHtml(result.paper.firstAuthor || "—")}</span><span>作者：${result.paper.authors.map(escapeHtml).join("、") || "实验室集体"}</span><span>投稿费 ${money(result.fee)} · 经费奖励 ${money(result.grant)}</span></div></div></div>`,
              locked: true,
              wide: true,
              footer: `<button class="button button-primary" data-action="paper-result-close">收好这页纸</button>`
            });
          } else {
            this.openModal({
              type: "paper-result",
              panel: "paper-result",
              kicker: "REJECTED · 拒稿",
              title: "期刊说：再补一点数据",
              subtitle: "数据还在，机会没有消失。下个月可以换一本期刊再试。",
              content: `<div class="paper-result"><div class="paper-result-icon" style="background:#f3dfd8;border-color:#c58c7b;">📪</div><h3 style="color:#a4503f;">被 ${escapeHtml(result.option.journal)} 拒稿</h3><p>${escapeHtml(result.message)}</p><div class="paper-preview-meta"><span>投稿费 ${money(result.option.fee)} 不退</span><span>数据保留，可下月重投</span></div></div>`,
              locked: true,
              narrow: true,
              footer: `<button class="button button-primary" data-action="paper-result-close">回到实验室</button>`
            });
          }
          return true;
        }
        case "paper-result-close": {
          this.paperContext = null;
          this.closeModal(true);
          this.render();
          return true;
        }
        case "close-paper": {
          this.paperContext = null;
          this.closeModal(true);
          return true;
        }
        case "apply-grant": {
          const result = C.applyGrant(this.state);
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.finishMutation(result.message, result.success ? "good" : "bad");
          return true;
        }
        case "advance": {
          if (state.pendingEvents.length) {
            this.showNextEvent();
            return true;
          }
          if (state.phase !== "playing") {
            this.showEnding();
            return true;
          }
          const report = C.advanceMonth(this.state);
          if (!report.ok) {
            this.toast(report.message, "bad");
            return true;
          }
          this.saveGame();
          this.render();
          this.openMonthReport(report);
          return true;
        }
        case "report-continue": {
          this.closeModal(true);
          if (this.state.phase !== "playing") {
            this.showEnding();
          } else if (this.state.pendingEvents.length) {
            this.showNextEvent();
          } else {
            this.render();
          }
          return true;
        }
        case "resolve-event": {
          const result = C.resolveEvent(this.state, dataset.event, dataset.option);
          if (!result.ok) {
            this.toast(result.message, "bad");
            return true;
          }
          this.saveGame();
          this.render();
          this.toast(result.message, "good");
          if (this.state.pendingEvents.length) {
            this.showNextEvent();
          } else if (this.state.phase !== "playing") {
            this.showEnding();
          } else {
            this.closeModal(true);
          }
          return true;
        }
        default:
          return false;
      }
    }
  };

  document.addEventListener("click", function (event) {
    const actionElement = event.target.closest("[data-action]");
    const personElement = event.target.closest("[data-person]");

    // A room card is itself a click target, but the little researcher dots
    // inside it should open that person, not the room. Prefer the closest,
    // more specific person target unless the same node also has an action.
    if (
      personElement &&
      (!actionElement ||
        (actionElement !== personElement &&
          actionElement.contains(personElement) &&
          !personElement.hasAttribute("data-action")))
    ) {
      App.selected = { type: "person", id: personElement.dataset.person };
      App.closeModal(true);
      App.render();
      event.preventDefault();
      return;
    }

    if (actionElement) {
      const handled = App.handleAction(actionElement.dataset.action, actionElement);
      if (handled) {
        event.preventDefault();
        return;
      }
    }

    const panelButton = event.target.closest("[data-panel]");
    if (panelButton) {
      App.openPanel(panelButton.dataset.panel);
      event.preventDefault();
      return;
    }

    const projectElement = event.target.closest("[data-project]");
    if (projectElement) {
      App.selected = { type: "project", id: projectElement.dataset.project };
      App.closeModal(true);
      App.render();
      event.preventDefault();
      return;
    }

    if (event.target.classList.contains("modal-backdrop")) {
      App.closeModal();
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") App.closeModal();
  });

  const importInput = document.getElementById("importSaveInput");
  if (importInput) importInput.addEventListener("change", (event) => App.importSaveFromFile(event));

  const ACTION_TIPS = {
    save: "手动保存到当前浏览器。游戏也会自动存档。",
    "export-save": "导出一份 JSON 存档，换电脑或清缓存前使用。",
    "import-save": "导入 JSON 存档；会覆盖当前浏览器里的进度。",
    help: "打开玩法手册：学生培养、特质/羁绊、行动点、房间/仪器、投稿费和院士投票。",
    "new-game": "重新选择方向、3 间房、2 台仪器和 2 个起步课题。",
    advance: "推进一个月：研究自动结算、发工资/维护费，并恢复行动点。",
    "refresh-free": "使用本学期的一次免费候选池刷新；每学期恢复 2 次。",
    "refresh-candidates": "花 ¥25,000 + 1AP 投放招聘广告，刷新候选池并略微提升质量。",
    hire: "支付培养启动费/入职安置费并占用编制；学生到年限会触发毕业或延毕。",

    "build-room": "确认在这个空位建造房间。",
    "upgrade-room": "升级房间，增加仪器位；办公室升级还会增加行动点。",
    "buy-instrument": "购买仪器并放进对应房间；占用仪器位，每月增加维护费。",
    "open-team": "调整课题小组。一个人可以加入多个课题，但效率会下降。",
    "save-team": "确认本课题的小组名单，消耗 1AP。",
    "assign-person": "把这个人加入课题；不会自动退出其他课题，兼组会降效。",

    "book-platform": "支付平台使用费并预约一个月；本月结算时生效。",
    "apply-academician": "提交院士提名，支付材料费 + 2AP，进入学部投票。",
    "approve-proposal": "为学生提案完成开题讨论，花 1AP 正式立项。",
    talk: "和成员谈心，花 1AP 提升好感与士气。",
    "open-training-for": "为这位成员选择培训项目；培训期间不能参与课题。",
    "assign-training": "确认送培并支付费用，1AP。",
    "setup-confirm": "用当前方向、房间、仪器和课题建立新实验室。"
  };
  const hoverTip = document.getElementById("hoverTip");
  function showHoverTip(target) {
    if (!hoverTip) return;
    const text =
      target.getAttribute("data-tip") ||
      target.getAttribute("title") ||
      ACTION_TIPS[target.dataset.action] ||
      "";
    if (!text) return;
    hoverTip.textContent = text;
    hoverTip.classList.add("is-visible");
    const rect = target.getBoundingClientRect();
    const width = Math.min(230, window.innerWidth - 16);
    hoverTip.style.width = `${width}px`;
    let left = rect.left + rect.width / 2 - width / 2;
    left = Math.max(8, Math.min(window.innerWidth - width - 8, left));
    let top = rect.top - 8;
    hoverTip.style.left = `${left}px`;
    hoverTip.style.top = `${top}px`;
    hoverTip.style.transform = "translateY(-100%)";
  }
  function hideHoverTip() {
    if (!hoverTip) return;
    hoverTip.classList.remove("is-visible");
  }
  document.addEventListener("mouseover", (event) => {
    const target = event.target.closest("[data-tip], [title]");
    if (!target) return;
    showHoverTip(target);
  });
  document.addEventListener("mouseout", (event) => {
    if (!event.target.closest("[data-tip], [title]")) return;
    hideHoverTip();
  });
  document.addEventListener("focusin", (event) => {
    const target = event.target.closest("[data-tip], [title]");
    if (target) showHoverTip(target);
  });
  document.addEventListener("focusout", hideHoverTip);
  window.addEventListener("scroll", hideHoverTip, true);

  window.LabApp = App;
  App.init();
})();

</script>

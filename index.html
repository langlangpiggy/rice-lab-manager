        targetLabel: "新进人员",
        reward: { funds: 90000, reputation: 3, favor: 8 },
        penalty: { favor: 5 }
      },
      publish: {
        title: "先把论文写出来",
        desc: "没有论文的实验室就像没有稻穗的田。完成并发表论文。",
        targetLabel: "发表论文",
        reward: { funds: 120000, reputation: 4, favor: 10 },
        penalty: { favor: 6 }
      },
      paper_if: {
        title: "导师的野心",
        desc: "周老师想在高影响因子期刊上留个名字。发表累计影响因子达到目标。",
        targetLabel: "累计影响因子",
        reward: { funds: 160000, reputation: 5, favor: 12 },
        penalty: { favor: 7 }
      },
      reputation: {
        title: "让同行记住我们",
        desc: "课题组不能只在楼道里出名。把实验室声望提升到目标值。",
        targetLabel: "实验室声望",
        reward: { funds: 100000, reputation: 2, favor: 9 },
        penalty: { favor: 5 }
      },
      build: {
        title: "把实验室撑大一点",
        desc: "仪器已经挤到走廊了。扩建一间新的实验室房间。",
        targetLabel: "新建房间",
        reward: { funds: 110000, reputation: 3, favor: 8 },
        penalty: { favor: 4 }
      },
      atmosphere: {
        title: "别让组会变成战场",
        desc: "有人抱怨实验室气氛紧张。把实验室氛围提升到目标值。",
        targetLabel: "实验室氛围",
        reward: { funds: 80000, reputation: 2, favor: 10 },
        penalty: { favor: 6 }
      },
      project: {
        title: "拿出一个完整的故事",
        desc: "导师想看到一条从表型到机制的完整课题线。完成一个研究课题。",
        targetLabel: "完成课题",
        reward: { funds: 180000, reputation: 5, favor: 12 },
        penalty: { favor: 7 }
      }
    };
    const def = definitions[type] || definitions.recruit;
    return {
      id: uid(state, "task"),
      type,
      title: def.title,
      desc: def.desc,
      targetLabel: def.targetLabel,
      target,
      deadline: deadline || 6,
      createdAt: state.month,
      progress: 0,
      rewarded: false,
      reward: def.reward,
      penalty: def.penalty,
      start: {
        peopleHired: state.stats.peopleHired,
        papers: state.papers.length,
        totalIF: state.totalIF,
        rooms: state.rooms.length,
        projectsCompleted: state.stats.projectsCompleted
      }
    };
  }

  function chooseNextTask(state) {
    const cycle = ["publish", "reputation", "build", "paper_if", "project", "recruit", "atmosphere"];
    const type = cycle[state.stats.tasksDone % cycle.length];
    if (type === "publish") return makeTask(state, type, 1, 6);
    if (type === "paper_if") return makeTask(state, type, Math.max(4, Math.round(4 + state.papers.length * 1.5)), 7);
    if (type === "reputation") return makeTask(state, type, Math.min(80, Math.max(18, state.reputation + 10)), 6);
    if (type === "build") return makeTask(state, type, 1, 7);
    if (type === "project") return makeTask(state, type, 1, 8);
    if (type === "atmosphere") return makeTask(state, type, Math.min(85, state.lab.atmosphere + 8), 6);
    return makeTask(state, "recruit", 1, 5);
  }

  function taskProgress(state, task) {
    if (!task) return 0;
    if (task.type === "recruit") return Math.max(0, state.stats.peopleHired - task.start.peopleHired);
    if (task.type === "publish") return Math.max(0, state.papers.length - task.start.papers);
    if (task.type === "paper_if") return round(Math.max(0, state.totalIF - task.start.totalIF), 1);
    if (task.type === "reputation") return state.reputation;
    if (task.type === "build") return Math.max(0, state.rooms.length - task.start.rooms);
    if (task.type === "atmosphere") return state.lab.atmosphere;
    if (task.type === "project") return Math.max(0, state.stats.projectsCompleted - task.start.projectsCompleted);
    return 0;
  }

  function directionInfo(id) {
    return D.RESEARCH_DIRECTIONS.find((direction) => direction.id === id) || D.RESEARCH_DIRECTIONS[0];
  }

  function normalizeSetup(setup) {
    const source = setup || {};
    const direction = directionInfo(source.directionId);
    const roomTypes = Array.isArray(source.roomTypes) && source.roomTypes.length === 3
      ? source.roomTypes
      : D.DEFAULT_SETUP.roomTypes;
    const instrumentKeys = Array.isArray(source.instrumentKeys) && source.instrumentKeys.length === 2
      ? source.instrumentKeys
      : D.DEFAULT_SETUP.instrumentKeys;
    const projectIds = Array.isArray(source.projectIds) && source.projectIds.length === 2
      ? source.projectIds
      : (Object.keys(source).length ? direction.startingProjects.slice(0, 2) : D.DEFAULT_SETUP.projectIds);
    return {
      directionId: direction.id,
      roomTypes: roomTypes.slice(0, 3),
      instrumentKeys: instrumentKeys.slice(0, 2),
      projectIds: projectIds.slice(0, 2)
    };
  }

  function validateSetup(setup) {
    const raw = setup || {};
    const normalized = normalizeSetup(setup);
    const direction = directionInfo(normalized.directionId);
    const errors = [];
    if (raw.roomTypes !== undefined && (!Array.isArray(raw.roomTypes) || raw.roomTypes.length !== 3)) {
      errors.push("请选择 3 个不同的起始房间。");
    }
    if (raw.instrumentKeys !== undefined && (!Array.isArray(raw.instrumentKeys) || raw.instrumentKeys.length !== 2)) {
      errors.push("请选择 2 台不同的起始仪器。");
    }
    if (raw.projectIds !== undefined && (!Array.isArray(raw.projectIds) || raw.projectIds.length !== 2)) {
      errors.push("请选择 2 个不同的起步课题。");
    }
    const uniqueRooms = new Set(normalized.roomTypes);
    if (uniqueRooms.size !== 3 || normalized.roomTypes.some((id) => !D.ROOM_TYPES.some((room) => room.id === id))) {
      errors.push("请选择 3 个不同的起始房间。");
    }
    const uniqueInstruments = new Set(normalized.instrumentKeys);
    if (uniqueInstruments.size !== 2 || normalized.instrumentKeys.some((id) => D.STARTING_INSTRUMENT_POOL.indexOf(id) < 0)) {
      errors.push("请选择 2 台不同的起始仪器。");
    }
    for (const key of normalized.instrumentKeys) {
      const info = D.INSTRUMENTS.find((item) => item.id === key);
      if (info && normalized.roomTypes.indexOf(info.requiresRoom) < 0) {
        errors.push(`${info.name} 需要先选 ${D.ROOM_TYPES.find((room) => room.id === info.requiresRoom)?.name || info.requiresRoom}。`);
      }
    }
    const uniqueProjects = new Set(normalized.projectIds);
    if (uniqueProjects.size !== 2 || normalized.projectIds.some((id) => direction.startingProjects.indexOf(id) < 0)) {
      errors.push("请从该方向的课题池里选择 2 个不同课题。");
    }
    return { ok: errors.length === 0, errors, setup: normalized, direction };
  }

  function startingSetupOptions(state) {
    return {
      directions: D.RESEARCH_DIRECTIONS,
      rooms: D.ROOM_TYPES,
      instruments: D.STARTING_INSTRUMENT_POOL
        .map((id) => D.INSTRUMENTS.find((item) => item.id === id))
        .filter(Boolean),
      projects: D.PROJECT_TEMPLATES,
      defaultSetup: D.DEFAULT_SETUP
    };
  }

  function placeStarterInstrument(state, key, roomTypes) {
    const info = D.INSTRUMENTS.find((item) => item.id === key);
    if (!info) return null;
    const used = {};
    for (const instrument of state.instruments) used[instrument.roomSlot] = (used[instrument.roomSlot] || 0) + 1;
    const candidates = state.rooms
      .filter((room) => room.type === info.requiresRoom)
      .filter((room) => {
        const capacity = roomInfo(room).capacity;
        return capacity > 0 && (used[room.slot] || 0) < capacity;
      })
      .sort((a, b) => (used[a.slot] || 0) - (used[b.slot] || 0));
    const fallback = state.rooms
      .filter((room) => roomInfo(room).capacity > 0)
      .filter((room) => (used[room.slot] || 0) < roomInfo(room).capacity);
    const room = candidates[0] || fallback[0];
    if (!room) return null;
    const instrument = { id: uid(state, "instrument"), key, roomSlot: room.slot };
    state.instruments.push(instrument);
    return instrument;
  }

  function newGame(seed, setup) {
    const validation = validateSetup(setup);
    const chosen = validation.ok ? validation.setup : normalizeSetup(D.DEFAULT_SETUP);
    const direction = directionInfo(chosen.directionId);
    const actualSeed = (Number(seed) || Math.floor(Math.random() * 1e9)) >>> 0;
    const state = {
      version: 2,
      seed: actualSeed,
      rng: actualSeed,
      createdAt: Date.now(),
      month: 0,
      ap: 4,
      maxAp: 4,
      funds: 1300000,
      reputation: 8,
      supervisorFavor: 50,
      supervisorName: "周启明",
      supervisorAvatar: "👨‍🏫",
      directionId: direction.id,
      directionName: direction.name,
      coreFields: direction.fields.slice(),
      researchFields: direction.fields.slice(),
      lab: { atmosphere: 66, conflicts: 0 },
      rooms: [],
      instruments: [],
      people: [],
      candidates: [],
      namedSeen: [],
      projects: [],
      trainingOffers: [],
      trainingHistory: [],
      papers: [],
      totalIF: 0,
      freeRefreshLeft: 2,
      externalBookings: [],
      voteFailures: 0,
      votePenalty: 0,
      voteCooldownUntil: -1,
      tasksDone: 0,
      stats: {
        peopleHired: 2,
        papersPublished: 0,
        grantsWon: 0,
        projectsCompleted: 0,
        trainings: 0,
        alumni: 0,
        rejected: 0,
        tasksDone: 0
      },
      pendingEvents: [],
      log: [],
      nextId: 1,
      lastGrantMonth: -99,
      phase: "playing",
      task: null,
      projectIdeas: [],
      lastReport: null,
      campaignMonths: D.CAMPAIGN_MONTHS,
      setup: chosen
    };

    const slots = [0, 1, 4];
    chosen.roomTypes.forEach((typeId, index) => {
      const type = D.ROOM_TYPES.find((room) => room.id === typeId);
      state.rooms.push({
        id: uid(state, "room"),
        slot: slots[index],
        type: type.id,
        level: 1,
        name: type.name
      });
    });
    for (const key of chosen.instrumentKeys) placeStarterInstrument(state, key, chosen.roomTypes);

    for (const person of D.START_PEOPLE) {
      const copy = JSON.parse(JSON.stringify(person));
      copy.id = uid(state, "person");
      copy.status = "active";
      copy.projects = [];
      copy.assignedProject = null;
      copy.training = null;
      if (copy.kind === "student") {
        const requirement = studentInfo(copy);
        copy.enrolledAt = 0;
        copy.graduationAt = requirement ? requirement.months : 48;
        copy.delayCount = 0;
        copy.publications = [];
        copy.primaryField = direction.fields[0];
        copy.secondaryField = direction.fields[1] || direction.fields[0];
        copy.fieldLevels = {
          [copy.primaryField]: 3,
          [copy.secondaryField]: 2
        };
      } else {
        copy.fieldLevels = Object.assign({}, copy.fieldLevels || {});
        copy.fieldLevels[direction.fields[0]] = Math.max(1, copy.fieldLevels[direction.fields[0]] || 0);
      }
      state.people.push(copy);
    }

    for (const projectId of chosen.projectIds) {
      const template = D.PROJECT_TEMPLATES.find((item) => item.id === projectId);
      if (template) createProject(state, template, "开局课题池");
    }
    state.task = makeTask(state, "recruit", 1, 6);
    state.candidates = generateCandidatePool(state, 5, false);
    state.trainingOffers = generateTrainingOffers(state, 3);
    state.lab.atmosphere = atmosphere(state);
    state.maxAp = actionPointBreakdown(state).total;
    state.ap = state.maxAp;
    log(state, `2026年9月，你接手了「${direction.name}」方向的实验室，从房间池、课题池和仪器池里搭起了自己的起点。`, "story");
    log(state, "周启明教授：方向已经定了，但实验室能走多远，要看你怎么把人、设备和钱放在一起。", "supervisor");
    log(state, "提示：研究课题需要对应房间和仪器；没有设备可以去公共平台按次预约。", "system");
    return state;
  }

  function hireCandidate(state, candidateId) {
    if (state.phase !== "playing") return { ok: false, message: "这局已经结束。" };
    if (state.ap < 1) return { ok: false, message: "这个月行动点不够了。" };
    const index = state.candidates.findIndex((candidate) => candidate.id === candidateId);
    if (index < 0) return { ok: false, message: "这位候选人已经不在池子里了。" };
    if (activePeople(state).length >= labCapacity(state)) {
      return { ok: false, message: "实验室编制满了，先扩建办公室或会议室。" };
    }
    const candidate = state.candidates[index];
    const signing = candidate.signingCost || (candidate.kind === "staff" ? candidate.salary : candidate.salary * 2);
    if (!canAfford(state, signing)) {
      return { ok: false, message: `需要 ¥${signing.toLocaleString()} 入职安置费，资金不够。` };
    }
    spend(state, signing);
    spendAP(state, 1);
    const person = JSON.parse(JSON.stringify(candidate));
    person.id = uid(state, "person");
    person.roleName = D.ROLES[person.roleId].name;
    person.status = "active";
    person.assignedProject = null;
    person.projects = [];
    person.training = null;
    person.monthsInLab = 0;
    person.publications = person.publications || [];
    if (person.kind === "student") {
      const requirement = studentInfo(person);
      person.enrolledAt = state.month;
      person.graduationAt = state.month + (requirement ? requirement.months : 48);
      person.delayCount = 0;
    }
    state.people.push(person);
    state.candidates.splice(index, 1);
    state.stats.peopleHired += 1;
    updateResearchFields(state);
    refreshAtmosphere(state);
    const beforeMax = state.maxAp;
    refreshMaxAp(state);
    if (state.maxAp > beforeMax) state.ap += state.maxAp - beforeMax;
    log(state, `${person.name}（${person.roleName}）加入了课题组。入职安置费 ¥${signing.toLocaleString()}。`, "good");
    return { ok: true, person, cost: signing };
  }

  function refreshCandidates(state, paid) {
    if (state.phase !== "playing") return { ok: false, message: "这局已经结束。" };
    const isPaid = paid === true || paid === "paid";
    if (isPaid) {
      if (state.ap < 1) return { ok: false, message: "行动点不足。" };
      if (!spend(state, 25000)) return { ok: false, message: "招聘宣传费不足 ¥25,000。" };
      spendAP(state, 1);
    } else {
      if ((state.freeRefreshLeft || 0) <= 0) {
        return { ok: false, message: "本学期的免费刷新已经用完，可以花 ¥25,000 + 1 AP 投放招聘广告。" };
      }
      state.freeRefreshLeft -= 1;
    }
    state.candidates = generateCandidatePool(state, 5, isPaid);
    log(
      state,
      isPaid
        ? "你投放了一轮招聘广告，候选人池刷新，质量略有提升。"
        : `你使用了一次免费刷新，本学期还剩 ${state.freeRefreshLeft} 次。`,
      isPaid ? "good" : "system"
    );
    return { ok: true, candidates: state.candidates, paid: isPaid, freeLeft: state.freeRefreshLeft };
  }

  function buildRoom(state, slot, typeId) {
    if (state.phase !== "playing") return { ok: false, message: "这局已经结束。" };
    const safeSlot = Number(slot);
    if (getRoom(state, safeSlot)) return { ok: false, message: "这个位置已经有房间了。" };
    const type = D.ROOM_TYPES.find((room) => room.id === typeId);
    if (!type) return { ok: false, message: "没有这种房间图纸。" };
    if (state.ap < 2) return { ok: false, message: "扩建需要 2 点行动点。" };
    if (!canAfford(state, type.cost)) return { ok: false, message: `扩建需要 ¥${type.cost.toLocaleString()}。` };
    spend(state, type.cost);
    spendAP(state, 2);
    state.rooms.push({
      id: uid(state, "room"),
      slot: safeSlot,
      type: type.id,
      level: 1,
      name: type.name
    });
    refreshAtmosphere(state);
    const beforeMax = state.maxAp;
    refreshMaxAp(state);
    if (state.maxAp > beforeMax) state.ap += state.maxAp - beforeMax;
    log(state, `新的${type.name}落成了。实验室规模 +1。`, "good");
    return { ok: true, room: getRoom(state, safeSlot), cost: type.cost };
  }

  function upgradeRoom(state, slot) {
    if (state.phase !== "playing") return { ok: false, message: "这局已经结束。" };
    const room = getRoom(state, slot);
    if (!room) return { ok: false, message: "这里没有房间。" };
    if (room.level >= 3) return { ok: false, message: "房间已经升到满级。" };
    const info = roomInfo(room);
    const cost = info.upgradeCost * room.level;
    if (state.ap < 1) return { ok: false, message: "升级需要 1 点行动点。" };
    if (!canAfford(state, cost)) return { ok: false, message: `升级需要 ¥${cost.toLocaleString()}。` };
    spend(state, cost);
    spendAP(state, 1);
    room.level += 1;
    refreshAtmosphere(state);
    const before = state.maxAp;
    refreshMaxAp(state);
    if (state.maxAp > before) state.ap += state.maxAp - before;
    log(state, `${room.name}升到了 ${room.level} 级，设备与空间更从容了。`, "good");
    return { ok: true, room, cost };
  }

  function roomInstrumentCount(state, room) {
    return state.instruments.filter((instrument) => instrument.roomSlot === room.slot).length;
  }

  function roomCapacity(state, room) {
    return roomInfo(room).capacity + Math.max(0, room.level - 1);
  }

  function buyInstrument(state, key, preferredSlot) {
    if (state.phase !== "playing") return { ok: false, message: "这局已经结束。" };
    const info = D.INSTRUMENTS.find((instrument) => instrument.id === key);
    if (!info) return { ok: false, message: "没有这件仪器。" };
    if (state.ap < 1) return { ok: false, message: "采购需要 1 点行动点。" };
    if (!canAfford(state, info.price)) return { ok: false, message: `这台仪器需要 ¥${info.price.toLocaleString()}。` };
    let targetRoom = null;
    if (preferredSlot != null) {
      const candidate = getRoom(state, preferredSlot);
      if (
        candidate &&
        candidate.type === info.requiresRoom &&
        roomInstrumentCount(state, candidate) < roomCapacity(state, candidate)
      ) {
        targetRoom = candidate;
      }
    }
    if (!targetRoom) {
      const matching = state.rooms
        .filter((room) => room.type === info.requiresRoom)
        .filter((room) => roomInstrumentCount(state, room) < roomCapacity(state, room))
        .sort((a, b) => roomInfo(b).bonus - roomInfo(a).bonus);
      targetRoom = matching[0] || null;
    }
    if (!targetRoom) {
      const roomName = D.ROOM_TYPES.find((room) => room.id === info.requiresRoom)?.name || "对应房间";
      return { ok: false, message: `${info.name}需要放在${roomName}，且有空余仪器位；先扩建或升级。` };
    }
    spend(state, info.price);
    spendAP(state, 1);
    const instrument = {
      id: uid(state, "instrument"),
      key: info.id,
      roomSlot: targetRoom.slot
    };
    state.instruments.push(instrument);
    const beforeMax = state.maxAp;
    refreshMaxAp(state);
    if (state.maxAp > beforeMax) state.ap += state.maxAp - beforeMax;
    log(state, `购入${info.name}，安置在${targetRoom.name}。`, "good");
    return { ok: true, instrument, room: targetRoom, cost: info.price };
  }

  function bookExternalInstrument(state, projectId, instrumentKey) {
    if (state.phase !== "playing") return { ok: false, message: "这局已经结束。" };
    const project = getProject(state, projectId);
    if (!project || project.status !== "active") return { ok: false, message: "这个课题当前不能预约平台。" };
    if (state.ap < 1) return { ok: false, message: "平台预约需要 1 点行动点。" };
    const platform = D.EXTERNAL_PLATFORM.find((item) => item.instrument === instrumentKey);
    if (!platform) return { ok: false, message: "公共平台没有这项服务。" };
    const exists = externalBookingsFor(state, project.id).some((booking) => booking.instrumentKey === instrumentKey);
    if (exists) return { ok: false, message: "这个课题本月已经预约了同类设备。" };
    if (!canAfford(state, platform.fee)) return { ok: false, message: `平台使用费需要 ¥${platform.fee.toLocaleString()}。` };
    spend(state, platform.fee);
    spendAP(state, 1);
    const booking = {
      id: uid(state, "external"),
      projectId: project.id,
      projectTitle: project.title,
      instrumentKey,
      name: platform.name,
      fee: platform.fee,
      startMonth: state.month,
      expiresMonth: state.month + 1
    };
    state.externalBookings.push(booking);
    log(state, `预约了${platform.name}，支付 ¥${platform.fee.toLocaleString()}；本月《${project.title}》可使用该设备。`, "normal");
    return { ok: true, booking, fee: platform.fee };
  }

  function projectTemplatesAvailable(state) {
    const fields = state.researchFields || state.coreFields || D.FIELD_LIST;
    return D.PROJECT_TEMPLATES.filter((template) => {
      if (state.projects.some((project) => project.templateId === template.id && project.status !== "completed")) {
        return false;
      }
      if (fields.indexOf(template.field) < 0) return false;
      return state.reputation >= template.minRep;
    });
  }

  function startProject(state, templateId) {
    if (state.phase !== "playing") return { ok: false, message: "这局已经结束。" };
    if (state.ap < 1) return { ok: false, message: "开题需要 1 点行动点。" };
    const template = D.PROJECT_TEMPLATES.find((item) => item.id === templateId);
    if (!template) return { ok: false, message: "没有这个课题。" };
    if ((state.researchFields || []).indexOf(template.field) < 0) {
      return { ok: false, message: `这个课题属于${D.FIELDS[template.field].name}，需要先通过人员或培训解锁该交叉方向。` };
    }
    if (state.reputation < template.minRep) {
      return { ok: false, message: `这个课题需要声望 ${template.minRep}。` };
    }
    if (state.projects.some((project) => project.templateId === template.id && project.status !== "completed")) {
      return { ok: false, message: "这个课题已经在组里了。" };
    }
    spendAP(state, 1);
    const project = createProject(state, template, "课题组自主开题");
    log(state, `新课题《${project.title}》开题。先组队，再等数据。`, "good");
    return { ok: true, project };
  }

  function approveProposal(state, projectId) {
    if (state.phase !== "playing") return { ok: false, message: "这局已经结束。" };
    const project = getProject(state, projectId);
    if (!project || project.status !== "draft") return { ok: false, message: "这不是待立项的学生提案。" };
    if (state.ap < 1) return { ok: false, message: "开题讨论需要 1 点行动点。" };
    spendAP(state, 1);
    project.status = "active";
    state.supervisorFavor = clamp(state.supervisorFavor + 2, 0, 100);
    log(state, `经过开题讨论，《${project.title}》正式立项。提出人：${getPerson(state, project.proposalPersonId)?.name || "学生"}。`, "good");
    return { ok: true, project };
  }

  function assignProjectTeam(state, projectId, personIds) {
    if (state.phase !== "playing") return { ok: false, message: "这局已经结束。" };
    const project = getProject(state, projectId);
    if (!project) return { ok: false, message: "课题不存在。" };
    if (project.status === "completed") return { ok: false, message: "这个课题已经结题了。" };
    if (project.status === "draft") return { ok: false, message: "这个学生提案还没有立项，先在课题面板完成开题讨论。" };
    if (state.ap < 1) return { ok: false, message: "调整课题小组需要 1 点行动点。" };
    const ids = Array.from(new Set(personIds || []));
    if (ids.length > project.teamCap) return { ok: false, message: `这个课题最多 ${project.teamCap} 人。` };
    const people = ids.map((id) => getPerson(state, id)).filter(Boolean);
    if (people.length !== ids.length) return { ok: false, message: "有人不在实验室。" };
    if (people.some((person) => person.status !== "active" || person.training)) {
      return { ok: false, message: "有人正在培训或已经离组，暂时不能加入课题。" };
    }
    project.team = ids;
    syncPersonProjects(state);
    spendAP(state, 1);
    log(state, `《${project.title}》小组调整为 ${people.length} 人。一个人可以同时参与多个课题，但每个课题的效率会下降。`, "normal");
    return { ok: true, project, team: people };
  }

  function assignTraining(state, personId, offerId) {
    if (state.phase !== "playing") return { ok: false, message: "这局已经结束。" };
    const person = getPerson(state, personId);
    const offer = trainingOfferById(offerId);
    if (!person || person.status !== "active") return { ok: false, message: "找不到这位成员。" };
    if (person.training) return { ok: false, message: "这个人已经在培训了。" };
    if (!offer) return { ok: false, message: "培训项目不存在。" };
    if (state.ap < 1) return { ok: false, message: "送培需要 1 点行动点。" };
    if (!canAfford(state, offer.cost)) return { ok: false, message: `培训需要 ¥${offer.cost.toLocaleString()}。` };
    spend(state, offer.cost);
    spendAP(state, 1);
    person.training = {
      offerId: offer.id,
      name: offer.name,
      icon: offer.icon,
      endMonth: state.month + 1
    };
    for (const project of state.projects) {
      project.team = project.team.filter((id) => id !== person.id);
    }
    syncPersonProjects(state);
    log(state, `${person.name}出发参加「${offer.name}」，一个月后回来。`, "normal");
    return { ok: true, person, offer, cost: offer.cost };
  }

  function talkTo(state, personId) {
    if (state.phase !== "playing") return { ok: false, message: "这局已经结束。" };
    const person = getPerson(state, personId);
    if (!person || person.status !== "active") return { ok: false, message: "找不到这位成员。" };
    if (person.lastTalkMonth === state.month) return { ok: false, message: "这个月已经聊过了。" };
    if (state.ap < 1) return { ok: false, message: "谈心需要 1 点行动点。" };
    spendAP(state, 1);
    person.favor = clamp(person.favor + 5, 0, 100);
    person.morale = clamp(person.morale + 5, 0, 100);
    person.lastTalkMonth = state.month;
    refreshAtmosphere(state);
    log(state, `你和小${person.name.slice(-1)}在楼下走了两圈。好感度与士气提升了。`, "good");
    return { ok: true, person };
  }

  function applyGrant(state) {
    if (state.phase !== "playing") return { ok: false, message: "这局已经结束。" };
    if (state.ap < 1) return { ok: false, message: "写本子需要 1 点行动点。" };
    if (state.month - state.lastGrantMonth < 3) return { ok: false, message: "上一个本子还在评审，再等等。" };
    spendAP(state, 1);
    state.lastGrantMonth = state.month;
    const successChance = clamp(0.5 + state.reputation / 250 + state.papers.length * 0.015, 0.3, 0.92);
    const success = rand(state) < successChance;
    if (!success) {
      log(state, "基金申请没有中。评审意见：创新性尚可，前期基础不足。", "bad");
      return { ok: true, success: false, message: "基金没中，评审意见很委婉。", chance: successChance };
    }
    const amount = Math.round((120000 + state.reputation * 5000 + state.totalIF * 8000) / 1000) * 1000;
    state.funds += amount;
    state.stats.grantsWon += 1;
    state.supervisorFavor = clamp(state.supervisorFavor + 2, 0, 100);
    log(state, `拿下了一项校级基金 ¥${amount.toLocaleString()}！`, "good");
    return { ok: true, success: true, amount, message: `基金到账：¥${amount.toLocaleString()}` };
  }

  function syncPersonProjects(state) {
    for (const person of activePeople(state)) {
      const memberships = state.projects
        .filter((project) => project.status === "active" && project.team.indexOf(person.id) >= 0)
        .map((project) => project.id);
      person.projects = memberships;
      person.assignedProject = memberships[0] || null;
    }
  }

  function cleanProjectTeams(state) {
    for (const project of state.projects) {
      project.team = project.team.filter((id) => {
        const person = getPerson(state, id);
        return person && person.status === "active" && !person.training;
      });
    }
    syncPersonProjects(state);
  }

  function addMilestones(state, project) {
    const opportunities = [];
    for (const milestone of project.milestones) {
      if (project.data >= milestone.value && !milestone.published && !milestone.ready) {
        milestone.ready = true;
        opportunities.push({
          projectId: project.id,
          projectTitle: project.title,
          milestone: milestone.value
        });
        log(state, `《${project.title}》数据达到 ${milestone.value}%，可以整理投稿了。`, "paper");
      }
    }
    return opportunities;
  }

  function completeProjectIfNeeded(state, project) {
    if (project.status !== "active" || project.data < project.dataGoal) return false;
    project.status = "completed";
    project.completedAt = state.month;
    project.data = project.dataGoal;
    const teamPeople = project.team.map((id) => getPerson(state, id)).filter(Boolean);
    project.authors = teamPeople.map((person) => person.name);
    project.authorIds = teamPeople.map((person) => person.id);
    project.firstAuthorId = teamPeople.slice().sort((a, b) => {
      return (
        effectiveStat(b, "writing") * 0.6 +
        effectiveStat(b, "int") * 0.4 -
        (effectiveStat(a, "writing") * 0.6 + effectiveStat(a, "int") * 0.4)
      );
    })[0]?.id || null;
    project.paperBonus = project.team.reduce((sum, id) => {
      const person = getPerson(state, id);
      return sum + (person ? person.paperBonus || 0 : 0);
    }, 0);
    state.funds += project.grant;
    state.reputation = clamp(state.reputation + 2, 0, 100);
    state.stats.projectsCompleted += 1;
    project.team = [];
    syncPersonProjects(state);
    log(state, `课题《${project.title}》结题，尾款 ¥${project.grant.toLocaleString()} 到账。`, "good");
    return true;
  }

  function trainingEffectText(offer) {
    const parts = [];
    const labels = { hands: "动手", int: "分析", eq: "情商", res: "抗压", innovation: "创新", writing: "写作", management: "管理" };
    for (const key of Object.keys(offer.effects || {})) {
      if (labels[key]) parts.push(`${labels[key]}+${offer.effects[key]}`);
      if (key === "paper") parts.push(`论文质量+${Math.round(offer.effects[key] * 100)}%`);
    }
    if (offer.field === "all") parts.push("主领域经验+1");
    else if (offer.field && D.FIELDS[offer.field]) parts.push(`${D.FIELDS[offer.field].name}领域+1`);
    if (offer.reputation) parts.push(`声望+${offer.reputation}`);
    return parts.join(" · ");
  }

  function finishTraining(state) {
    const completed = [];
    for (const person of activePeople(state)) {
      if (!person.training) continue;
      if (person.training.endMonth > state.month) continue;
      const offer = trainingOfferById(person.training.offerId);
      person.training = null;
      if (!offer) continue;
      for (const key of D.STAT_KEYS) {
        if (offer.effects[key]) {
          person.stats[key] = clamp((person.stats[key] || 0) + offer.effects[key], 1, 99);
        }
      }
      if (offer.effects.paper) {
        person.paperBonus = (person.paperBonus || 0) + offer.effects.paper;
      }
      if (offer.effects.management) {
        person.management = (person.management || 0) + offer.effects.management;
      }
      const learnedField = offer.field === "all" ? person.primaryField : offer.field;
      if (learnedField) {
        person.fieldLevels[learnedField] = clamp((person.fieldLevels[learnedField] || 0) + 1, 1, 5);
      }
      if (offer.reputation) state.reputation = clamp(state.reputation + offer.reputation, 0, 100);
      person.favor = clamp(person.favor + (offer.favor || 0), 0, 100);
      person.morale = clamp(person.morale + 4, 0, 100);
      state.stats.trainings += 1;
      state.trainingHistory.push({
        personName: person.name,
        offerName: offer.name,
        month: state.month,
        field: offer.field === "all" ? null : offer.field
      });
      updateResearchFields(state);
      completed.push({ person, offer });
      log(state, `${person.name}从「${offer.name}」回来了，能力提升。`, "good");
    }
    return completed;
  }

  function updatePeopleMonthly(state) {
    const changes = [];
    for (const person of activePeople(state)) {
      const beforeMorale = person.morale;
      const beforeFavor = person.favor;
      person.monthsInLab = (person.monthsInLab || 0) + 1;
      const projectCount = (person.projects || []).length;
      if (person.training) {
        person.morale = clamp(person.morale + 3, 0, 100);
      } else if (projectCount > 0) {
        person.morale = clamp(person.morale - 3 - (projectCount - 1) * 3 + Math.round(person.stats.eq / 50), 0, 100);
        person.favor = clamp(person.favor + 1, 0, 100);
      } else {
        person.morale = clamp(person.morale + 2, 0, 100);
      }
      person.favor = clamp(person.favor - 1, 0, 100);
      if (person.morale < 18 && person.kind === "staff" && rand(state) < 0.2) {
        changes.push({ person, type: "leave" });
      }
      if (beforeMorale !== person.morale || beforeFavor !== person.favor) {
        changes.push({ person, type: "mood", fromMorale: beforeMorale, toMorale: person.morale });
      }
    }
    return changes;
  }

  function removePerson(state, personId, reason) {
    const person = getPerson(state, personId);
    if (!person) return null;
    person.status = "left";
    state.people = state.people.filter((item) => item.id !== personId);
    for (const project of state.projects) project.team = project.team.filter((id) => id !== personId);
    syncPersonProjects(state);
    log(state, `${person.name}离开了课题组。${reason || ""}`, "bad");
    return person;
  }

  function makeGraduationEvent(state, person) {
    const progress = studentProgress(state, person);
    const role = roleInfo(person);
    const requirement = progress.requirement;
    const canStay =
      person.favor >= (requirement ? requirement.favor : 60) &&
      Boolean(requirement && (requirement.nextRole || person.roleId === "postdoc"));
    const after = requirement ? requirement.after : "毕业";
    const stayLabel =
      person.roleId === "master"
        ? "留组硕博连读"
        : person.roleId === "phd"
          ? "留组做博士后"
          : "出站留组转聘";
    return {
      id: uid(state, "event"),
      type: "graduation",
      personId: person.id,
      title: `${person.name}达到${after}条件`,
      desc: `${person.name}的${role.name}阶段走到节点：${progress.papers} 篇论文、第一作者 ${progress.firstAuthor} 篇、累计 IF ${progress.totalIF}，导师好感 ${progress.favor}。${canStay ? "她/他愿意留下来，也可以选择离开。" : "好感不足，学生没有表达留组意愿。"}`,
      options: canStay
        ? [
            {
              id: "stay",
              label: stayLabel,
              desc:
                person.roleId === "master"
                  ? "转为博士生，重新计算 48 个月培养期，能力提升。"
                  : person.roleId === "phd"
                    ? "转为博士后，24 个月培养期，津贴上浮。"
                    : "转为助理研究员，成为正式 staff，不再触发毕业。",
              tone: "good"
            },
            { id: "graduate", label: `送学生${after}`, desc: "腾出位置，声望 +2。", tone: "normal" }
          ]
        : [{ id: "graduate", label: `送学生${after}`, desc: "好感不足，只能送别。", tone: "normal" }]
    };
  }

  function makeDelayEvent(state, person) {
    const progress = studentProgress(state, person);
    const requirement = progress.requirement;
    const maxDelay = requirement ? requirement.maxDelay : 2;
    const missing = [];
    if (progress.papers < progress.targetPapers) missing.push(`论文 ${progress.papers}/${progress.targetPapers}`);
    if (progress.firstAuthor < progress.targetFirstAuthor) missing.push(`一作 ${progress.firstAuthor}/${progress.targetFirstAuthor}`);
    if (progress.totalIF < progress.targetIF) missing.push(`IF ${progress.totalIF}/${progress.targetIF}`);
    if (progress.favor < progress.targetFavor) missing.push(`好感 ${progress.favor}/${progress.targetFavor}`);
    const canDelay = (person.delayCount || 0) < maxDelay;
    return {
      id: uid(state, "event"),
      type: "delay",
      personId: person.id,
      title: `${person.name}需要延毕`,
      desc: `${person.name}到了培养年限，但还没达到${requirement ? requirement.label : "毕业"}要求：${missing.join("、")}。这是第 ${(person.delayCount || 0) + 1} 次延毕评估。`,
      options: canDelay
        ? [
            { id: "delay", label: "安排延毕 6 个月", desc: "毕业时间推迟 6 个月；士气 -8，导师好感 -3，声望 -1。", tone: "normal" },
            { id: "leave", label: "劝其转组/退学", desc: "直接移除该学生，声望 -2，实验室少一个人。", tone: "bad" }
          ]
        : [{ id: "leave", label: "按最长年限退学处理", desc: "已没有延毕次数，只能离开；声望 -2。", tone: "bad" }]
    };
  }

  function makeConflictEvent(state) {
    const candidates = [];
    for (const project of state.projects) {
      if (project.team.length < 2) continue;
      const members = project.team.map((id) => getPerson(state, id)).filter(Boolean);
      for (let i = 0; i < members.length; i += 1) {
        for (let j = i + 1; j < members.length; j += 1) {
          const a = members[i];
          const b = members[j];
          const badA = traitInfos(a).some((trait) => trait.tone === "bad");
          const badB = traitInfos(b).some((trait) => trait.tone === "bad");
          if (a.stats.eq + b.stats.eq < 115 || badA || badB) {
            candidates.push({ a, b, project });
          }
        }
      }
    }
    if (!candidates.length) return null;
    const pair = pick(state, candidates);
    return {
      id: uid(state, "event"),
      type: "conflict",
      personIds: [pair.a.id, pair.b.id],
      projectId: pair.project.id,
      title: "组会气氛有点僵",
      desc: `${pair.a.name}和${pair.b.name}在《${pair.project.title}》的分工上顶了起来。${pair.a.name}觉得对方不靠谱，${pair.b.name}觉得被冒犯。`,
      options: [
        { id: "mediate", label: "拉去楼下喝咖啡", desc: "花 ¥20,000，双方好感 +6，氛围 +5。", tone: "good" },
        { id: "separate", label: "先拆开两个人", desc: "把一个人调出课题，好感 -3，但不再冲突。", tone: "normal" },
        { id: "ignore", label: "让他们自己消化", desc: "氛围 -10，双方好感 -5，项目推进受损。", tone: "bad" }
      ]
    };
  }

  function makeProposalEvent(state) {
    const people = activePeople(state).filter((person) => person.favor >= 50);
    if (!people.length) return null;
    const person = pick(state, people);
    const templates = D.PROJECT_TEMPLATES.filter((template) => {
      if (state.reputation < template.minRep) return false;
      if ((state.researchFields || []).indexOf(template.field) < 0) return false;
      if (state.projects.some((project) => project.templateId === template.id && project.status !== "completed")) return false;
      return true;
    });
    if (!templates.length) return null;
    const sorted = templates.filter((template) => template.field === person.primaryField || template.field === person.secondaryField);
    const template = pick(state, sorted.length ? sorted : templates);
    return {
      id: uid(state, "event"),
      type: "proposal",
      personId: person.id,
      templateId: template.id,
      title: "有人敲开了你办公室的门",
      desc: `${person.name}拿来一页皱巴巴的设想：想做《${template.title}》。${template.desc}`,
      options: [
        { id: "accept", label: "进入开题讨论", desc: "先作为学生提案进入课题库；之后要花 1 AP 完成立项讨论。", tone: "good" },
        { id: "decline", label: "先放一放", desc: "拒绝一个想法，好感 -2。", tone: "normal" }
      ]
    };
  }

  function makeBreakdownEvent(state) {
    if (!state.instruments.length) return null;
    const instrument = pick(state, state.instruments);
    const info = instrumentInfo(instrument);
    const repairCost = Math.round((info.price * 0.06) / 1000) * 1000;
    const project = state.projects.find((item) => item.status === "active" && item.field === info.field);
    return {
      id: uid(state, "event"),
      type: "breakdown",
      instrumentId: instrument.id,
      projectId: project ? project.id : null,
      title: `${info.name}发出了一声怪响`,
      desc: `深夜的实验室里，${info.name}突然报警。维修工程师说：${repairCost.toLocaleString()} 元，修不修？`,
      options: [
        { id: "repair", label: "马上修", desc: `支付 ¥${repairCost.toLocaleString()}，设备恢复。`, tone: "good" },
        { id: "ignore", label: "先用别的凑合", desc: project ? `《${project.title}》损失 10 点数据，氛围 -3。` : "氛围 -3。", tone: "bad" }
      ],
      repairCost
    };
  }

  function makePoachEvent(state) {
    const people = activePeople(state).filter((person) => {
      return person.stats.int + person.stats.hands > 110;
    });
    if (!people.length) return null;
    const person = pick(state, people);
    const raise = Math.round(person.salary * 0.12 / 100) * 100;
    const counter = person.salary * 3;
    return {
      id: uid(state, "event"),
      type: "poach",
      personId: person.id,
      title: "同行来挖人了",
      desc: `隔壁研究所给${person.name}发了 offer，薪水更高，平台更大。${person.name}还没有答应，但把邮件转给了你。`,
      options: [
        {
          id: "retain",
          label: "加薪挽留",
          desc: `一次性支付 ¥${counter.toLocaleString()}，月薪 +¥${raise.toLocaleString()}，好感 +6。`,
          tone: "good"
        },
        { id: "release", label: "祝福，放人", desc: "失去这位成员，声望 +1。", tone: "bad" }
      ],
      counter,
      raise
    };
  }

  function makeCollaborationEvent(state) {
    if (state.reputation < 24) return null;
    const candidates = D.PROJECT_TEMPLATES.filter((template) => {
      if (["seed_industry", "climate_smart", "microbiome", "effector_screen"].indexOf(template.id) < 0) return false;
      if ((state.researchFields || []).indexOf(template.field) < 0) return false;
      if (state.projects.some((project) => project.templateId === template.id && project.status !== "completed")) return false;
      return true;
    });
    if (!candidates.length) return null;
    const template = pick(state, candidates);
    const partner = pick(state, D.COMPANIES);
    return {
      id: uid(state, "event"),
      type: "collab",
      templateId: template.id,
      partner,
      title: `${partner}想谈一个合作`,
      desc: `${partner}的项目经理带来一个应用课题：《${template.title}》。他们愿意先付一笔前期款，但要求论文和材料共享。`,
      options: [
        { id: "accept", label: "接洽并立项", desc: `立即立项，企业前期款 ¥80,000，声望 +2。`, tone: "good" },
        { id: "decline", label: "婉拒这次合作", desc: "不增加课题，也不得罪人。", tone: "normal" }
      ]
    };
  }

  function eventChance(state, threshold) {
    return rand(state) < threshold;
  }

  function generateMonthlyEvents(state) {
    const events = [];
    const graduating = activePeople(state).filter((person) => {
      return person.kind === "student" && state.month >= person.graduationAt && !person.pendingGraduation;
    });
    for (const person of graduating) {
      person.pendingGraduation = true;
      const progress = studentProgress(state, person);
      events.push(progress.met ? makeGraduationEvent(state, person) : makeDelayEvent(state, person));
    }
    if (eventChance(state, 0.18)) {
      const conflict = makeConflictEvent(state);
      if (conflict) events.push(conflict);
    } else if (eventChance(state, 0.16)) {
      const proposal = makeProposalEvent(state);
      if (proposal) events.push(proposal);
    } else if (eventChance(state, 0.1)) {
      const breakdown = makeBreakdownEvent(state);
      if (breakdown) events.push(breakdown);
    } else if (eventChance(state, 0.06)) {
      const poach = makePoachEvent(state);
      if (poach) events.push(poach);
    } else if (eventChance(state, 0.06)) {
      const collab = makeCollaborationEvent(state);
      if (collab) events.push(collab);
    }
    return events;
  }

  function resolveEvent(state, eventId, optionId) {
    const index = state.pendingEvents.findIndex((event) => event.id === eventId);
    if (index < 0) return { ok: false, message: "这个事件已经处理过了。" };
    const event = state.pendingEvents[index];
    const option = event.options.find((item) => item.id === optionId);
    if (!option) return { ok: false, message: "这个选项不存在。" };
    let resolution = "";

    if (event.type === "graduation") {
      const person = getPerson(state, event.personId);
      if (!person) {
        state.pendingEvents.splice(index, 1);
        return { ok: true, message: "学生已经不在实验室。" };
      }
      person.pendingGraduation = false;
      if (optionId === "stay") {
        const oldRole = person.roleId;
        const requirement = studentInfo(person);
        const nextRole = requirement && requirement.nextRole;
        if (oldRole === "master" && nextRole) {
          person.roleId = "phd";
          person.roleName = D.ROLES.phd.name;
          person.kind = "student";
          person.enrolledAt = state.month;
          person.graduationAt = state.month + D.STUDENT_REQUIREMENTS.phd.months;
          person.delayCount = 0;
          person.stats.int = clamp(person.stats.int + 4, 1, 99);
          person.stats.writing = clamp(person.stats.writing + 3, 1, 99);
          person.salary = Math.round((person.salary * 1.2) / 100) * 100;
          resolution = `${person.name}转为博士生，开始新的 48 个月培养期。`;
        } else if (oldRole === "phd" && nextRole) {
          person.roleId = "postdoc";
          person.roleName = D.ROLES.postdoc.name;
          person.kind = "student";
          person.enrolledAt = state.month;
          person.graduationAt = state.month + D.STUDENT_REQUIREMENTS.postdoc.months;
          person.delayCount = 0;
          person.stats.innovation = clamp(person.stats.innovation + 4, 1, 99);
          person.stats.writing = clamp(person.stats.writing + 3, 1, 99);
          person.salary = Math.round((person.salary * 1.45) / 100) * 100;
          resolution = `${person.name}转为博士后，开始 24 个月的出站周期。`;
        } else {
          person.roleId = "researcher";
          person.roleName = D.ROLES.researcher.name;
          person.kind = "staff";
          person.graduationAt = null;
          person.delayCount = 0;
          person.stats.innovation = clamp(person.stats.innovation + 3, 1, 99);
          person.stats.writing = clamp(person.stats.writing + 3, 1, 99);
          person.salary = Math.max(person.salary, D.ROLES.researcher.salary[0]);
          resolution = `${person.name}出站后留组转聘为助理研究员。`;
        }
        person.favor = clamp(person.favor + 6, 0, 100);
        person.morale = clamp(person.morale + 5, 0, 100);
        log(state, resolution, "good");
      } else {
        removePerson(state, person.id, "培养期结束。");
        state.reputation = clamp(state.reputation + 2, 0, 100);
        state.stats.alumni += 1;
        resolution = `${person.name}完成培养阶段，带着论文和一点不舍离开了实验室。`;
        log(state, resolution, "normal");
      }
    } else if (event.type === "delay") {
      const person = getPerson(state, event.personId);
      if (!person) {
        state.pendingEvents.splice(index, 1);
        return { ok: true, message: "学生已经不在实验室。" };
      }
      person.pendingGraduation = false;
      if (optionId === "delay") {
        person.delayCount = (person.delayCount || 0) + 1;
        person.graduationAt = state.month + 6;
        person.morale = clamp(person.morale - 8, 0, 100);
        person.favor = clamp(person.favor - 3, 0, 100);
        state.reputation = clamp(state.reputation - 1, 0, 100);
        resolution = `${person.name}延毕 6 个月，压力写在脸上。`;
        log(state, resolution, "bad");
      } else {
        removePerson(state, person.id, "延毕评估未通过，转组/退学。");
        state.reputation = clamp(state.reputation - 2, 0, 100);
        resolution = `${person.name}离开课题组，实验室空出了一个位置。`;
        log(state, resolution, "bad");
      }
    } else if (event.type === "conflict") {
      const [aId, bId] = event.personIds;
      const a = getPerson(state, aId);
      const b = getPerson(state, bId);
      const project = getProject(state, event.projectId);
      if (optionId === "mediate") {
        if (!spend(state, 20000)) {
          return { ok: false, message: "经费不足以支付这轮咖啡和调解。" };
        }
        if (a) {
          a.favor = clamp(a.favor + 6, 0, 100);
          a.morale = clamp(a.morale + 3, 0, 100);
        }
        if (b) {
          b.favor = clamp(b.favor + 6, 0, 100);
          b.morale = clamp(b.morale + 3, 0, 100);
        }
        state.lab.conflicts = Math.max(0, state.lab.conflicts - 1);
        resolution = "一杯咖啡没白花，两个人重新分了工。";
      } else if (optionId === "separate") {
        const target = a && b ? (a.stats.eq <= b.stats.eq ? a : b) : a || b;
        if (target && project) project.team = project.team.filter((id) => id !== target.id);
        if (target) {
          target.favor = clamp(target.favor - 3, 0, 100);
        }
        syncPersonProjects(state);
        state.lab.conflicts = Math.max(0, state.lab.conflicts - 1);
        resolution = "你把两个人拆开，冲突暂时平息，但被拆的人不太高兴。";
      } else {
        if (a) {
          a.favor = clamp(a.favor - 5, 0, 100);
          a.morale = clamp(a.morale - 4, 0, 100);
        }
        if (b) {
          b.favor = clamp(b.favor - 5, 0, 100);
          b.morale = clamp(b.morale - 4, 0, 100);
        }
        if (project) project.data = Math.max(0, project.data - 8);
        state.lab.conflicts = clamp(state.lab.conflicts + 1, 0, 4);
        resolution = "你选择不介入。实验台保住了，但组会空气冷了一整周。";
      }
    } else if (event.type === "proposal") {
      const person = getPerson(state, event.personId);
      const template = D.PROJECT_TEMPLATES.find((item) => item.id === event.templateId);
      if (optionId === "accept" && template) {
        const proposal = createProject(state, template, `${person ? person.name : "成员"}的提案`, {
          draft: true,
          proposalPersonId: person ? person.id : null
        });
        if (person) person.favor = clamp(person.favor + 6, 0, 100);
        resolution = `《${template.title}》进入学生提案库。需要 1 点行动点完成开题讨论后才能正式立项。`;
      } else {
        if (person) person.favor = clamp(person.favor - 2, 0, 100);
        resolution = "你把提案先放进了抽屉，对方嘴上说理解，眼神有点失落。";
      }
    } else if (event.type === "breakdown") {
      if (optionId === "repair") {
        if (!spend(state, event.repairCost)) {
          return { ok: false, message: "维修费不够，只能先让仪器罢工。" };
        }
        resolution = "工程师换了块板子，仪器重新发出正常的嗡嗡声。";
      } else {
        const project = getProject(state, event.projectId);
        if (project) project.data = Math.max(0, project.data - 10);
        state.lab.conflicts += 1;
        resolution = "你让仪器先带病工作。数据质量下降了，实验室里弥漫着焦味。";
      }
    } else if (event.type === "collab") {
      const template = D.PROJECT_TEMPLATES.find((item) => item.id === event.templateId);
      if (optionId === "accept" && template) {
        const project = createProject(state, template, `校企合作 · ${event.partner}`);
        state.funds += 80000;
        state.reputation = clamp(state.reputation + 2, 0, 100);
        resolution = `《${project.title}》作为校企合作项目立项，企业前期款 ¥80,000 到账。`;
        log(state, resolution, "good");
      } else {
        resolution = `你婉拒了${event.partner}的合作邀请。对方说保持联系。`;
      }
    } else if (event.type === "poach") {
      const person = getPerson(state, event.personId);
      if (optionId === "retain") {
        if (!spend(state, event.counter)) return { ok: false, message: "拿不出挽留的现金。" };
        if (person) {
          person.salary += event.raise;
          person.favor = clamp(person.favor + 6, 0, 100);
          person.morale = clamp(person.morale + 6, 0, 100);
        }
        resolution = "你把 offer 放了回去，也把新的薪水数字写在纸上。人留下了。";
      } else {
        if (person) removePerson(state, person.id, "接受了外面的 offer。");
        state.reputation = clamp(state.reputation + 1, 0, 100);
        resolution = "你祝福了对方。办公室空了一格，但圈子不大，日后好相见。";
      }
    }

    state.pendingEvents.splice(index, 1);
    state.lab.atmosphere = atmosphere(state);
    cleanProjectTeams(state);
    checkEndConditions(state);
    return { ok: true, message: resolution, event };
  }

  function checkEndConditions(state) {
    if (state.phase !== "playing") return state.phase;
    if (state.funds <= 0) {
      state.phase = "lost";
      state.ending = {
        type: "funds",
        title: "账上清零了",
        desc: "工资、耗材和仪器维护把最后一笔经费吃光了。实验室的灯灭了。",
        score: academicianStatus(state)
      };
      return state.phase;
    }
    if (activePeople(state).length === 0) {
      state.phase = "lost";
      state.ending = {
        type: "people",
        title: "实验室里没有人了",
        desc: "最后一个人也收拾了工位。你独自站在走廊尽头，连组会都开不起来。",
        score: academicianStatus(state)
      };
      return state.phase;
    }
    if (state.month >= state.campaignMonths) {
      const status = academicianStatus(state);
      state.phase = "ended";
      state.ending = {
        type: "ended",
        title: status.requirementMet ? "获得提名，但未通过学部投票" : "差一点，但也不错了",
        desc: status.requirementMet
          ? "材料进了学部，但投票没有通过。周老师没有责怪你，只说：下一届再来。实验室还在这里。"
          : "周老师没有当选。但实验室从几间房长成了有名字的地方，论文和人都留了下来。也许下一届还有机会。",
        score: status
      };
    }
    return state.phase;
  }

  function updateSupervisorTask(state) {
    if (!state.task) return { completed: false, failed: false };
    const progress = taskProgress(state, state.task);
    state.task.progress = progress;
    const target = state.task.target;
    if (progress >= target) {
      state.funds += state.task.reward.funds;
      state.reputation = clamp(state.reputation + state.task.reward.reputation, 0, 100);
      state.supervisorFavor = clamp(state.supervisorFavor + state.task.reward.favor, 0, 100);
      state.stats.tasksDone += 1;
      log(state, `导师任务完成：${state.task.title}。经费 +¥${state.task.reward.funds.toLocaleString()}，声望 +${state.task.reward.reputation}。`, "good");
      state.task = chooseNextTask(state);
      return { completed: true, task: state.task };
    }
    if (state.month >= state.task.createdAt + state.task.deadline) {
      state.supervisorFavor = clamp(state.supervisorFavor - state.task.penalty.favor, 0, 100);
      log(state, `导师任务逾期：${state.task.title}。导师好感 -${state.task.penalty.favor}。`, "bad");
      state.task = chooseNextTask(state);
      return { failed: true, task: state.task };
    }
    return { completed: false, failed: false };
  }

  function trainingCompletedThisMonth(state, offer) {
    return {
      offer,
      text: trainingEffectText(offer)
    };
  }

  function advanceMonth(state) {
    if (state.phase !== "playing") return { ok: false, message: "这局已经结束。" };
    if (state.pendingEvents.length) return { ok: false, message: "先处理待办事件，再推进时间。" };
    const from = state.month;
    const beforeFunds = state.funds;
    const report = {
      ok: true,
      from,
      to: state.month + 1,
      fromInfo: monthInfo(from),
      toInfo: monthInfo(state.month + 1),
      income: 0,
      expenses: 0,
      net: 0,
      fundsBefore: beforeFunds,
      fundsAfter: beforeFunds,
      projectProgress: [],
      paperOpportunities: [],
      trainingCompleted: [],
      moodChanges: [],
      events: [],
      taskUpdate: null,
      logStart: state.log.length,
      completedProjects: []
    };

    for (const project of state.projects) {
      if (project.status !== "active") continue;
      if (!project.team.length) continue;
      const power = projectPower(state, project);
      const before = project.data;
      if (power.blocked) {
        report.projectProgress.push({
          id: project.id,
          title: project.title,
          added: 0,
          data: round(project.data, 1),
          dataGoal: project.dataGoal,
          power: 0,
          blocked: true,
          missing: power.missing,
          completed: false
        });
        continue;
      }
      project.data = Math.min(project.dataGoal, project.data + power.power);
      project.quality = clamp(
        Math.round(power.avgStat + projectEquipmentBonus(state, project) * 0.28 + project.tierLevel * 5),
        1,
        100
      );
      const added = project.data - before;
      if (added > 0) {
        const opportunities = addMilestones(state, project);
        if (opportunities.length) {
          report.paperOpportunities.push(...opportunities);
          project.milestones.forEach((milestone) => {
            if (opportunities.some((item) => item.milestone === milestone.value)) milestone.ready = true;
          });
        }
        const completed = completeProjectIfNeeded(state, project);
        if (completed) report.completedProjects.push(project.title);
      }
      report.projectProgress.push({
        id: project.id,
        title: project.title,
        added: round(added, 1),
        data: round(project.data, 1),
        dataGoal: project.dataGoal,
        power: power.power,
        completed: project.status === "completed"
      });
    }

    report.moodChanges = updatePeopleMonthly(state);
    for (const change of report.moodChanges) {
      if (change.type === "leave" && change.person.status === "active") {
        removePerson(state, change.person.id, "士气太低，递交了离职信。");
      }
    }
    cleanProjectTeams(state);

    const income = monthlyIncome(state);
    const expenses = monthlyExpenses(state);
    state.funds += income - expenses;
    report.income = income;
    report.expenses = expenses;
    report.net = income - expenses;

    state.month += 1;
    const completedTraining = finishTraining(state);
    report.trainingCompleted = completedTraining.map((item) => ({
      personName: item.person.name,
      offerName: item.offer.name,
      text: trainingEffectText(item.offer)
    }));
    refreshAtmosphere(state);
    const taskUpdate = updateSupervisorTask(state);
    report.taskUpdate = taskUpdate;

    state.externalBookings = (state.externalBookings || []).filter((booking) => Number(booking.expiresMonth) > state.month);
    if (state.month % 6 === 0) {
      state.candidates = generateCandidatePool(state, 5, false);
      state.trainingOffers = generateTrainingOffers(state, 3);
      state.freeRefreshLeft = 2;
      log(state, "新学期开始，人才市场与培训项目刷新了；免费刷新次数恢复为 2 次。", "system");
    }
    refreshMaxAp(state);
    state.ap = state.maxAp;
    const events = generateMonthlyEvents(state);
    state.pendingEvents = events;
    report.events = events;
    report.fundsAfter = state.funds;
    report.funds = state.funds;
    report.atmosphere = state.lab.atmosphere;
    report.academician = academicianStatus(state);
    state.lastReport = report;
    log(state, `进入${monthInfo(state.month).calendar}。本月收支 ${income - expenses >= 0 ? "+" : ""}¥${(income - expenses).toLocaleString()}。`, "system");
    checkEndConditions(state);
    return report;
  }

  function preparePaper(state, projectId, milestoneValue) {
    const project = getProject(state, projectId);
    if (!project) return { ok: false, message: "课题不存在。" };
    const milestone = project.milestones.find((item) => item.value === Number(milestoneValue));
    if (!milestone || !milestone.ready) return { ok: false, message: "这个进度还没有可投稿的数据。" };
    if (!project.paperPreviews) project.paperPreviews = {};
    if (project.paperPreviews[milestoneValue]) return project.paperPreviews[milestoneValue];
    const power = projectPower(state, project);
    const equipment = projectEquipmentBonus(state, project);
    const team = project.team.length
      ? project.team.map((id) => getPerson(state, id)).filter(Boolean)
      : (project.authorIds || []).map((id) => getPerson(state, id)).filter(Boolean);
    const teamWriting = team.length
      ? team.reduce((sum, person) => sum + effectiveStat(person, "writing"), 0) / team.length
      : 42;
    const teamQuality = project.quality || power.avgStat || 50;
    const paperBonus = project.paperBonus || project.team.reduce((sum, id) => {
      const person = getPerson(state, id);
      return sum + (person ? (person.paperBonus || 0) + (personMods(person).paper || 0) : 0);
    }, 0);
    const bondPaper = projectBonds(state, project).reduce((sum, bond) => sum + (bond.effects.paperQuality || 0), 0);
    const quality = clamp(
      Math.round(
        teamQuality +
          teamWriting * 0.2 +
          equipment * 0.25 +
          project.tierLevel * 6 +
          (project.data / project.dataGoal) * 7 +
          paperBonus * 100 +
          bondPaper +
          (projectEquipmentPaperBonus(state, project) * 100) +
          rand(state) * 6 -
          5
      ),
      15,
      100
    );
    const milestoneFactor = milestoneValue >= 100 ? 1.12 : milestoneValue >= 60 ? 0.9 : 0.58;
    const baseIF = project.baseIF * milestoneFactor * (0.5 + quality / 100 * 0.9);
    const tierIndex = { C: 0, B: 1, A: 2, S: 3 };
    const journalInfo = [
      { journal: D.JOURNALS[0], style: "稳妥", styleTone: "safe" },
      {
        journal: project.tierLevel >= 2 ? D.JOURNALS[3] : D.JOURNALS[2],
        style: "主投",
        styleTone: "standard"
      },
      {
        journal: project.tierLevel >= 3 ? D.JOURNALS[5] : D.JOURNALS[4],
        style: "冲刺",
        styleTone: "stretch"
      }
    ];
    const options = journalInfo.map((entry) => {
      const journal = entry.journal;
      const tierOk = (tierIndex[project.tier] || 0) >= (tierIndex[journal.minTier] || 0);
      const milestoneOk = Number(milestoneValue) >= journal.minMilestone;
      const eligible = tierOk && milestoneOk;
      const impact = round(baseIF * journal.multiplier, 1);
      const rawAcceptance =
        journal.acceptance +
        (quality - 60) * 0.0035 +
        state.reputation * 0.0008 +
        (project.tierLevel * 0.015) +
        teamWriting * 0.0012 +
        (milestoneValue >= 100 ? 0.02 : 0) -
        journal.tier * 0.035;
      const acceptance = eligible ? clamp(rawAcceptance, 0.03, 0.82) : 0;
      return {
        style: entry.style,
        styleTone: entry.styleTone,
        journal: journal.name,
        journalId: journal.id,
        color: journal.color,
        impact,
        acceptance: round(acceptance, 2),
        projected: true,
        fee: journal.fee,
        minTier: journal.minTier,
        minMilestone: journal.minMilestone,
        eligible,
        eligibilityText: eligible
          ? "可投"
          : tierOk
            ? `需要数据进度达到 ${journal.minMilestone}%`
            : `课题等级至少 ${journal.minTier}`
      };
    });
    const preview = {
      ok: true,
      project,
      milestone,
      quality,
      writing: round(teamWriting, 1),
      baseIF: round(baseIF, 1),
      title: pickPaperTitle(state, project.field),
      options
    };
    project.paperPreviews[milestoneValue] = preview;
    return preview;
  }

  function pickPaperTitle(state, field) {
    const titles = D.PAPER_TITLE_PARTS[field] || D.PAPER_TITLE_PARTS.blast;
    const base = pick(state, titles);
    const gene = pick(state, ["Pik", "Pi9", "Pita", "Pib", "Pid2", "Pikm", "NLR"]);
    return `${base}：${gene} 视角`;
  }

  function submitPaper(state, projectId, milestoneValue, optionIndex) {
    if (state.phase !== "playing") return { ok: false, message: "这局已经结束。" };
    if (state.ap < 1) return { ok: false, message: "投稿需要 1 点行动点。" };
    const project = getProject(state, projectId);
    if (!project) return { ok: false, message: "课题不存在。" };
    const milestone = project.milestones.find((item) => item.value === Number(milestoneValue));
    if (!milestone || !milestone.ready) return { ok: false, message: "这个里程碑已经投过了。" };
    const prepared = preparePaper(state, projectId, milestoneValue);
    if (!prepared.ok) return prepared;
    const option = prepared.options[Number(optionIndex) || 0];
    if (!option) return { ok: false, message: "投稿选项无效。" };
    if (option.eligible === false) return { ok: false, message: option.eligibilityText || "这个期刊不接受当前阶段的稿件。" };
    if (!canAfford(state, option.fee || 0)) return { ok: false, message: `投稿费需要 ¥${Number(option.fee || 0).toLocaleString()}。` };
    spend(state, option.fee || 0);
    spendAP(state, 1);
    const accepted = rand(state) <= option.acceptance;
    if (!accepted) {
      state.stats.rejected += 1;
      if (project.paperPreviews) delete project.paperPreviews[milestoneValue];
      state.supervisorFavor = clamp(state.supervisorFavor - 1, 0, 100);
      log(state, `投稿《${prepared.title}》被 ${option.journal} 拒了，¥${Number(option.fee).toLocaleString()} 投稿费不退。`, "bad");
      return {
        ok: true,
        accepted: false,
        project,
        milestone,
        paper: null,
        option,
        prepared,
        message: `被 ${option.journal} 拒稿了。数据还在，可以下个月再试；投稿费不退。`
      };
    }
    const activeTeam = project.team.map((id) => getPerson(state, id)).filter((person) => person && person.status === "active");
    const snapshotAuthors = (project.authorIds || []).map((id) => getPerson(state, id)).filter((person) => person && person.status === "active");
    const authorPeople = activeTeam.length ? activeTeam : snapshotAuthors;
    let firstAuthor = null;
    if (project.firstAuthorId && authorPeople.some((person) => person.id === project.firstAuthorId)) {
      firstAuthor = authorPeople.find((person) => person.id === project.firstAuthorId);
    }
    if (!firstAuthor && authorPeople.length) {
      firstAuthor = authorPeople.slice().sort((a, b) => {
        return (
          effectiveStat(b, "writing") * 0.6 +
          effectiveStat(b, "int") * 0.4 -
          (effectiveStat(a, "writing") * 0.6 + effectiveStat(a, "int") * 0.4)
        );
      })[0];
    }
    const authors = authorPeople.length ? authorPeople.map((person) => person.name) : (project.authors || []).slice();
    const paper = {
      id: uid(state, "paper"),
      title: prepared.title,
      journal: option.journal,
      impact: option.impact,
      field: project.field,
      projectId: project.id,

      id = "player_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      localStorage.setItem(PLAYER_KEY, id);

  }

    if (!clean) return "";

    return clean;
  }

  function clearNickname() {
    localStorage.removeItem(NICK_KEY);
  }

  function todayLabel(state) {
    try {
      return window.LabCore.monthInfo(state.month).calendar;
    } catch (error) {
      return `${state.month || 0} 月`;
    }
  }

  function makeSnapshot(state, nickname) {
    const direction = (window.LabData.RESEARCH_DIRECTIONS || []).find((item) => item.id === state.directionId);
    const players = Array.isArray(state.people) ? state.people.filter((person) => person.status === "active") : [];
    const projects = Array.isArray(state.projects) ? state.projects : [];
    const papers = Array.isArray(state.papers) ? state.papers : [];
    const instruments = Array.isArray(state.instruments) ? state.instruments : [];
    const rooms = Array.isArray(state.rooms) ? state.rooms : [];
    return {
      playerId: getPlayerId(),
      nickname: String(nickname || "").slice(0, 16),
      direction: direction ? direction.name : "未选择",

        } catch (error) {

        }
      })(),
      peopleCount: players.length,
      people: players.slice(0, 10).map((person) => ({

        level: room.level || 1
      })),
      instruments: instruments.slice(0, 15).map((instrument) => instrument.key || ""),
      updatedAt: Date.now()
    };
  }

  async function request(url, options) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);
    try {
      const response = await fetch(url, Object.assign({}, options, { signal: controller.signal, cache: "no-store" }));
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response;
    } finally {
      clearTimeout(timer);
    }
  }

  async function readBoard() {
    const response = await request(`${ENDPOINT}?t=${Date.now()}`);
    const data = await response.json();
    if (!data || typeof data !== "object") return { version: 1, players: {}, updatedAt: null };
    if (!data.players || typeof data.players !== "object") data.players = {};
    data.version = 1;
    return data;
  }

  async function writeBoard(board) {
    board.version = 1;
    board.updatedAt = Date.now();
    const response = await request(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(board)
    });
    const result = await response.json().catch(() => null);
    return result || board;
  }

  function cacheBoard(board) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify(board));
    } catch (error) {
      // ignore quota errors
    }
  }

  function cachedBoard() {
    try {
      return JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    } catch (error) {
      return null;
    }
  }

  async function sync(state, nickname) {
    const clean = String(nickname || "").trim();
    if (!clean) throw new Error("还没有昵称。");
    const snapshot = makeSnapshot(state, clean);
    let lastError = null;
    for (let attempt = 0; attempt < 3; attempt += 1) {
      try {
        const board = await readBoard();
        board.players[snapshot.playerId] = snapshot;
        const saved = await writeBoard(board);
        cacheBoard(saved);
        return saved;
      } catch (error) {
        lastError = error;
        await new Promise((resolve) => setTimeout(resolve, 400 + attempt * 700));
      }
    }
    throw lastError || new Error("联机同步失败。");
  }

  async function fetchPlayers() {
    const board = await readBoard();
    cacheBoard(board);
    return Object.values(board.players || {}).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  }

  function listCachedPlayers() {
    const board = cachedBoard();
    return Object.values((board && board.players) || {}).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  }

  function timeAgo(timestamp) {
    if (!timestamp) return "从未同步";
    const seconds = Math.max(0, Math.floor((Date.now() - timestamp) / 1000));
    if (seconds < 60) return `${seconds} 秒前`;
    if (seconds < 3600) return `${Math.floor(seconds / 60)} 分钟前`;
    if (seconds < 86400) return `${Math.floor(seconds / 3600)} 小时前`;
    return `${Math.floor(seconds / 86400)} 天前`;
  }

  root.LabCommunity = {
    ENDPOINT,
    getPlayerId,
    getNickname,
    setNickname,
    clearNickname,
    makeSnapshot,
    sync,
    fetchPlayers,
    listCachedPlayers,
    timeAgo
  };
})(window);

    exportSave() {
      if (!this.state) return;
      const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, "");
      const filename = `rice-lab-save-${stamp}.json`;
      const blob = new Blob([JSON.stringify(this.state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1200);
      this.toast("存档已导出为 JSON 文件。", "good");
    },

    importSaveFromFile(event) {
      const input = event.target;
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(String(reader.result || ""));
          if (
            !imported ||
            imported.version !== 2 ||
            !Array.isArray(imported.people) ||
            !Array.isArray(imported.projects) ||
            !imported.lab ||
            typeof imported.month !== "number"
          ) {
            throw new Error("invalid-save");
          }
          if (!window.confirm("导入会覆盖当前浏览器里的实验室存档，继续吗？")) return;
          imported.seenIntro = true;
          for (const project of imported.projects) project.paperPreviews = project.paperPreviews || {};
          this.state = imported;
          this.selected = { type: "lab", id: null };
          this.paperContext = null;
          C.refreshAtmosphere(this.state);
          this.saveGame();
          this.closeModal(true);
          this.render();
          if (this.state.pendingEvents && this.state.pendingEvents.length) this.showNextEvent();
          else if (this.state.phase !== "playing") this.showEnding();
          else this.toast("存档已导入，欢迎回到实验室。", "gold");
        } catch (error) {
          this.toast("这个文件不是有效的稻可道存档。", "bad");
        } finally {
          input.value = "";
        }
      };
      reader.onerror = () => {
        this.toast("读取文件失败，请重试。", "bad");
        input.value = "";
      };
      reader.readAsText(file);
    },

      this.renderActionbar();
      this.updateNavActive();
    },

    renderLabMap() {
      const state = this.state;
      const rooms = state.rooms;
      const roomsBySlot = new Map(rooms.map((room) => [room.slot, room]));
      const peopleByRoom = new Map();
      for (const person of C.activePeople(state)) {
        let room = null;
        const project = C.personProject(state, person);
        const targetField = project ? project.field : person.primaryField;
        const matching = rooms.find((candidate) => {
          const info = D.ROOM_TYPES.find((type) => type.id === candidate.type);
          return info && (info.field === targetField || info.field === "all");
        });
        room = matching || rooms.find((candidate) => candidate.type === "office") || rooms[0];
        if (room) {
          if (!peopleByRoom.has(room.slot)) peopleByRoom.set(room.slot, []);
          peopleByRoom.get(room.slot).push(person);
        }
      }

      let html = "";
      for (let slot = 0; slot < 12; slot += 1) {
        const room = roomsBySlot.get(slot);
        if (!room) {
          html += `<button class="room-card empty-room-card" data-action="open-build" data-slot="${slot}" aria-label="扩建实验室">
            <span class="empty-plus">+</span>
            <span class="room-empty-label">扩建空间<span>EMPTY LAB SLOT · 点击选择房间</span></span>
          </button>`;
          continue;
        }
        const info = D.ROOM_TYPES.find((type) => type.id === room.type) || D.ROOM_TYPES[0];
        const instruments = state.instruments.filter((instrument) => instrument.roomSlot === room.slot);
        const roomPeople = peopleByRoom.get(room.slot) || [];
        const capacity = C.roomCapacity(state, room);
        const linkedProject = state.projects.find((project) => {
          return project.status === "active" && C.fieldsCompatible(project.field, info.field);
        });
        const linkedPercent = linkedProject ? C.clamp((linkedProject.data / linkedProject.dataGoal) * 100, 0, 100) : 0;
        const instrumentHtml = instruments.slice(0, 4).map((instrument) => {
          const detail = C.instrumentInfo(instrument);
          return `<span class="instrument-token" title="${escapeHtml(detail.name)}">${detail.icon}<small>${escapeHtml(detail.name.slice(0, 3))}</small></span>`;
        }).join("");
        const extraInstrument = instruments.length > 4 ? `<span class="room-person-more">+${instruments.length - 4}</span>` : "";
        const peopleHtml = roomPeople.slice(0, 5).map((person) => {
          return `<button class="room-person-dot" data-person="${person.id}" title="${escapeHtml(person.name)} · ${roleOf(person).name}" aria-label="${escapeHtml(person.name)}">${person.avatar}</button>`;
        }).join("");
        const extraPeople = roomPeople.length > 5 ? `<span class="room-person-more">+${roomPeople.length - 5}</span>` : "";
        html += `<div class="room-card ${this.selected.type === "room" && Number(this.selected.id) === room.slot ? "is-selected" : ""}" style="${roomStyle(room)}" data-action="select-room" data-slot="${slot}" role="button" tabindex="0" aria-label="${escapeHtml(info.name)}">
          <div class="room-top">
            <div class="room-name-row">
              <span class="room-type-icon">${info.icon}</span>
              <span class="room-name">${escapeHtml(info.name)}</span>
            </div>
            <span class="room-level">Lv.${room.level}</span>
          </div>
          <div class="room-sub"><span>${info.field === "all" ? "综合空间" : fieldOf(info.field).name}</span><b>${instruments.length}/${capacity} 台</b></div>
          <div class="room-project ${linkedProject ? "" : "is-empty"}">${linkedProject ? `⌁ ${escapeHtml(linkedProject.title)} <b>${linkedPercent.toFixed(0)}%</b>` : "暂无对应课题"}</div>
          <div class="room-content">
            <div class="instrument-shelf">${instrumentHtml || `<span class="empty-instruments">还没有仪器</span>`}${extraInstrument}</div>
            <div class="room-people">${peopleHtml || `<span class="room-person-more">空位</span>`}${extraPeople}</div>
          </div>
        </div>`;
      }
      $("#labMap").innerHTML = html;
    },

      const state = this.state;
      const people = C.activePeople(state);
      $("#peopleStrip").innerHTML = people.length
        ? people.map((person) => `<button class="person-chip ${person.kind === "student" ? "is-student" : ""}" data-person="${person.id}" title="${escapeHtml(person.name)} · ${roleOf(person).name}" aria-label="${escapeHtml(person.name)}">${person.avatar}<span class="chip-mood" style="background:${moodColor(person)}"></span></button>`).join("")

      const projects = activeProjectOptions(this.state).slice(0, 3);

      });

    renderInspector() {
      const state = this.state;
      if (this.selected.type === "person") {
        const person = selectedPerson(state, this.selected.id);
        if (person) {
          $("#inspector").innerHTML = this.personInspector(person);
          return;
        }
      }
      if (this.selected.type === "project") {
        const project = selectedProject(state, this.selected.id);
        if (project) {
          $("#inspector").innerHTML = this.projectInspector(project);
          return;
        }
      }
      if (this.selected.type === "room") {
        const room = selectedRoom(state, this.selected.id);
        if (room) {
          $("#inspector").innerHTML = this.roomInspector(room);
          return;
        }
      }
      $("#inspector").innerHTML = this.dashboardInspector();

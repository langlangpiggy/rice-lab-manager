<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#244338">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="稻可道 · 实验室管家：一个水稻抗病基因组课题组的模拟经营原型。">
  <title>稻可道 · 实验室管家</title>
  <style>
:root {
  --ink: #24372d;
  --ink-soft: #4c5f51;
  --muted: #8b7b67;
  --paper: #f5eddc;
  --paper-light: #fbf7ec;
  --paper-deep: #ece0c9;
  --line: #d8c8ae;
  --line-dark: #9c8a70;
  --green: #2d5a47;
  --green-deep: #203d31;
  --green-soft: #4c7f66;
  --leaf: #78a36b;
  --gold: #cf9b3e;
  --gold-pale: #f6e5b7;
  --coral: #c66f55;
  --coral-pale: #f7dfd5;
  --blue: #55779f;
  --violet: #7d6a9e;
  --danger: #a8493f;
  --shadow: 0 8px 24px rgba(64, 49, 31, 0.1);
  --shadow-soft: 0 3px 10px rgba(64, 49, 31, 0.08);
  --radius: 12px;
  --font-body: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-display: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
  --font-mono: "SFMono-Regular", "Cascadia Code", "Consolas", monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  color: var(--ink);
  background:
    radial-gradient(circle at 15% 12%, rgba(177, 132, 73, 0.1), transparent 28%),
    radial-gradient(circle at 82% 84%, rgba(69, 121, 92, 0.1), transparent 32%),
    repeating-linear-gradient(0deg, transparent 0, transparent 27px, rgba(94, 70, 42, 0.035) 27px, rgba(94, 70, 42, 0.035) 28px),
    var(--paper);
  font-family: var(--font-body);
  font-size: 14px;
  overflow: hidden;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

h1,
h2,
h3,
h4,
p {
  margin: 0;
}

h1,
h2,
h3 {
  font-family: var(--font-display);
  font-weight: 700;
}

.game-shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-height: 620px;
}

/* ---------------- Top bar ---------------- */

.topbar {
  position: relative;
  z-index: 10;
  display: grid;
  grid-template-columns: minmax(270px, 1.1fr) 168px minmax(430px, 1.5fr) auto;
  align-items: center;
  gap: 18px;
  min-height: 84px;
  padding: 12px 22px;
  color: #f5ecd9;
  background:
    radial-gradient(circle at 92% -40%, rgba(212, 170, 92, 0.15), transparent 42%),
    linear-gradient(120deg, #203e31 0%, #294c3b 56%, #315a46 100%);
  border-bottom: 1px solid rgba(255, 251, 240, 0.15);
  box-shadow: 0 5px 18px rgba(30, 42, 32, 0.2);
}

.topbar::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 3px;
  opacity: 0.45;
  background: repeating-linear-gradient(90deg, #d9b76b 0, #d9b76b 14px, transparent 14px, transparent 22px);
}

.brand-block {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: 12px;
}

.brand-seal {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 46px;
  height: 50px;
  color: var(--green-deep);
  background:
    linear-gradient(150deg, #f4dd9b 0%, #d6a948 100%);
  border: 1px solid #f8eec8;
  border-radius: 6px 6px 12px 4px;
  box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.12);
  font-family: var(--font-display);
  font-size: 27px;
  font-weight: 800;
  transform: rotate(-2deg);
}

.brand-copy {
  min-width: 0;
}

.brand-title {
  overflow: hidden;
  color: #fff7e5;
  font-family: var(--font-display);
  font-size: 25px;
  font-weight: 700;
  letter-spacing: 1px;
  line-height: 1.15;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.brand-title span {
  margin-left: 6px;
  color: #d8c5a3;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 2px;
}

.brand-sub {
  overflow: hidden;
  margin-top: 4px;
  color: #aebfae;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.7px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.date-block {
  min-width: 0;
  padding: 6px 16px 5px;
  border-right: 1px solid rgba(255, 247, 230, 0.16);
  border-left: 1px solid rgba(255, 247, 230, 0.16);
}

.date-kicker {
  color: #d3bb8e;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
}

.date-main {
  margin-top: 1px;
  color: #fff6df;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
}

.campaign-track {
  height: 4px;
  margin-top: 6px;
  overflow: hidden;
  background: rgba(250, 240, 218, 0.17);
  border-radius: 999px;
}

.campaign-track span {
  display: block;
  width: 2%;
  height: 100%;
  background: #e0bd6b;
  border-radius: inherit;
  transition: width 0.4s ease;
}

.date-sub {
  overflow: hidden;
  margin-top: 3px;
  color: #9eb3a1;
  font-family: var(--font-mono);
  font-size: 8px;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.top-resources {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}

.resource-chip {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 90px;
  padding: 5px 9px;
  border: 1px solid rgba(255, 245, 224, 0.14);
  border-radius: 7px;
  background: rgba(255, 249, 237, 0.055);
}

.resource-icon {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 22px;
  height: 22px;
  color: #ecd69d;
  border: 1px solid rgba(235, 209, 149, 0.35);
  border-radius: 50%;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
}

.resource-chip b {
  display: block;
  color: #fff7e4;
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.15;
}

.resource-chip small {
  display: block;
  margin-top: 1px;
  color: #a8baaa;
  font-size: 9px;
  line-height: 1.2;
}

.resource-chip small em {
  color: #e3c678;
  font-style: normal;
}

.resource-paper {
  min-width: 102px;
}

.academic-mini {
  min-width: 132px;
  margin-left: auto;
}

.academic-mini-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  color: #b9c9b8;
  font-size: 9px;
  white-space: nowrap;
}

.academic-mini-head b {
  color: #e7ca7a;
  font-family: var(--font-mono);
  font-size: 11px;
}

.academic-track {
  height: 5px;
  margin-top: 4px;
  overflow: hidden;
  background: rgba(248, 240, 223, 0.15);
  border-radius: 999px;
}

.academic-track i {
  display: block;
  width: 0;
  height: 100%;
  background: linear-gradient(90deg, #d4a34d, #f1d58c);
  border-radius: inherit;
  transition: width 0.4s ease;
}

.top-actions {
  display: flex;
  gap: 7px;
}

.icon-button {
  display: grid;
  place-items: center;
  width: 31px;
  height: 31px;
  padding: 0;
  color: #e8ddc7;
  background: transparent;
  border: 1px solid rgba(246, 232, 204, 0.23);
  border-radius: 50%;
  font-family: var(--font-mono);
  font-size: 13px;
  transition: 0.15s ease;
}

.icon-button:hover {
  color: var(--green-deep);
  background: #f8edd4;
  border-color: #f8edd4;
}

/* ---------------- Main layout ---------------- */

.main-shell {
  display: grid;
  flex: 1;
  grid-template-columns: 220px minmax(480px, 1fr) 342px;
  gap: 13px;
  min-height: 0;
  padding: 13px 17px;
}

.side-rail,
.inspector {
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(94, 72, 43, 0.25) transparent;
}

.side-rail::-webkit-scrollbar,
.inspector::-webkit-scrollbar,
.modal-body::-webkit-scrollbar {
  width: 5px;
}

.side-rail::-webkit-scrollbar-thumb,
.inspector::-webkit-scrollbar-thumb,
.modal-body::-webkit-scrollbar-thumb {
  background: rgba(100, 79, 49, 0.23);
  border-radius: 999px;
}

.side-rail {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.supervisor-card {
  position: relative;
  overflow: hidden;
  flex: 0 0 auto;
  padding: 13px;
  color: #f8edd9;
  background:
    radial-gradient(circle at 100% 0, rgba(226, 194, 120, 0.16), transparent 42%),
    linear-gradient(150deg, #2c5543, #223f33);
  border: 1px solid #193329;
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
}

.supervisor-card::after {
  content: "PI";
  position: absolute;
  top: 7px;
  right: 11px;
  color: rgba(236, 216, 172, 0.2);
  font-family: var(--font-display);
  font-size: 34px;
  font-weight: 800;
  line-height: 1;
}

.supervisor-top {
  display: flex;
  align-items: center;
  gap: 9px;
}

.supervisor-avatar {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 43px;
  height: 43px;
  border: 2px solid rgba(244, 221, 166, 0.55);
  border-radius: 50%;
  background: #e8d4a1;
  font-size: 25px;
}

.supervisor-name {
  color: #fff7e5;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
}

.supervisor-role {
  margin-top: 1px;
  color: #b7c7ae;
  font-size: 10px;
}

.supervisor-favor {
  margin-top: 10px;
}

.mini-label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #aac0ad;
  font-size: 10px;
}

.mini-label-row b {
  color: #e6ca80;
  font-family: var(--font-mono);
  font-size: 11px;
}

.mini-track {
  height: 5px;
  margin-top: 4px;
  overflow: hidden;
  background: rgba(246, 235, 207, 0.14);
  border-radius: 99px;
}

.mini-track i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #d2a34b, #eed18a);
  border-radius: inherit;
}

.supervisor-task {
  padding-top: 9px;
  margin-top: 9px;
  border-top: 1px solid rgba(255, 246, 226, 0.12);
}

.supervisor-task-kicker {
  color: #d1b576;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 1.2px;
}

.supervisor-task-title {
  display: block;
  overflow: hidden;
  margin-top: 3px;
  color: #f8edd8;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.supervisor-task-desc {
  display: block;
  overflow: hidden;
  margin-top: 2px;
  color: #afc1b2;
  font-size: 10px;
  line-height: 1.45;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav-list {
  display: flex;
  flex: 0 0 auto;
  flex-direction: column;
  gap: 3px;
  padding: 5px;
  background: rgba(252, 247, 236, 0.57);
  border: 1px solid rgba(189, 166, 132, 0.45);
  border-radius: var(--radius);
}

.nav-item {
  display: flex;
  align-items: center;
  min-height: 34px;
  padding: 0 9px;
  color: var(--ink-soft);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 7px;
  text-align: left;
  transition: 0.15s ease;
}

.nav-item:hover {
  color: var(--green-deep);
  background: rgba(225, 211, 185, 0.48);
}

.nav-item.is-active {
  color: var(--green-deep);
  background: #fff9eb;
  border-color: rgba(176, 149, 106, 0.4);
  box-shadow: 1px 1px 0 rgba(102, 78, 44, 0.06);
}

.nav-icon {
  display: grid;
  place-items: center;
  width: 22px;
  margin-right: 7px;
  color: var(--green-soft);
  font-family: var(--font-mono);
  font-size: 14px;
}

.nav-item > span:nth-child(2) {
  flex: 1;
  font-size: 12px;
  font-weight: 600;
}

.nav-item small {
  color: #a18c70;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.2px;
}

.rail-note {
  padding: 11px 12px;
  background: rgba(251, 246, 235, 0.7);
  border: 1px solid rgba(190, 166, 130, 0.45);
  border-radius: var(--radius);
}

.rail-note-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 8px;
  border-bottom: 1px dashed rgba(147, 121, 85, 0.3);
  color: var(--muted);
  font-size: 9px;
}

.rail-note-head b {
  color: var(--green);
  font-family: var(--font-mono);
  font-size: 11px;
}

.rail-note-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 7px;
  color: #776957;
  font-size: 10px;
}

.rail-note-row b {
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 11px;
}

.rail-note .button {
  width: 100%;
  margin-top: 10px;
}

.rail-footer {
  display: flex;
  justify-content: space-between;
  margin-top: auto;
  padding: 4px 2px;
  color: #9d8d78;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.35px;
}

/* ---------------- Workspace and lab ---------------- */

.workspace {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  gap: 9px;
}

.lab-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex: 0 0 auto;
  padding: 0 3px;
}

.section-kicker {
  color: #a38c6e;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 1.6px;
}

.lab-heading h1 {
  margin-top: 2px;
  color: var(--ink);
  font-size: clamp(20px, 1.85vw, 28px);
  letter-spacing: 0.5px;
  line-height: 1.1;
}

.lab-heading-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.weather-note {
  color: #9a866e;
  font-size: 9px;
  letter-spacing: 0.25px;
}

.lab-scale-pill {
  display: flex;
  align-items: baseline;
  gap: 5px;
  padding: 5px 9px;
  color: #8f7551;
  background: rgba(251, 246, 235, 0.65);
  border: 1px solid rgba(185, 159, 123, 0.43);
  border-radius: 5px;
}

.lab-scale-pill span {
  font-family: var(--font-mono);
  font-size: 7px;
  letter-spacing: 0.8px;
}

.lab-scale-pill b {
  color: var(--green);
  font-family: var(--font-mono);
  font-size: 14px;
}

.lab-map {
  position: relative;
  display: grid;
  flex: 1;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: 9px;
  min-height: 410px;
  padding: 13px;
  overflow: hidden;
  background:
    linear-gradient(90deg, transparent 49.7%, rgba(228, 211, 176, 0.09) 49.7%, rgba(228, 211, 176, 0.09) 50.3%, transparent 50.3%),
    linear-gradient(0deg, transparent 49.7%, rgba(228, 211, 176, 0.07) 49.7%, rgba(228, 211, 176, 0.07) 50.3%, transparent 50.3%),
    radial-gradient(circle at 80% 18%, rgba(202, 172, 111, 0.08), transparent 26%),
    #284d3d;
  border: 1px solid #173729;
  border-radius: 14px;
  box-shadow: inset 0 0 0 4px rgba(18, 49, 36, 0.25), 0 9px 24px rgba(48, 43, 29, 0.14);
}

.lab-map::before {
  content: "CORRIDOR / 走廊";
  position: absolute;
  right: 18px;
  bottom: 6px;
  color: rgba(232, 212, 169, 0.28);
  font-family: var(--font-mono);
  font-size: 7px;
  letter-spacing: 1.5px;
}

.lab-map::after {
  content: "";
  position: absolute;
  top: 13px;
  right: 13px;
  bottom: 13px;
  left: 13px;
  pointer-events: none;
  border: 1px dashed rgba(231, 211, 169, 0.15);
  border-radius: 7px;
}

.room-card {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  padding: 11px 11px 9px;
  overflow: hidden;
  color: var(--ink);
  background:
    linear-gradient(135deg, rgba(255, 253, 244, 0.5), transparent 42%),
    var(--room-pale, #e5ead8);
  border: 2px solid rgba(248, 238, 218, 0.85);
  border-radius: 9px;
  box-shadow: 0 3px 0 rgba(13, 36, 26, 0.18), inset 0 -10px 20px rgba(52, 67, 48, 0.06);
  cursor: pointer;
  transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
}

.room-card:hover {
  z-index: 2;
  border-color: #f6d894;
  box-shadow: 0 8px 18px rgba(15, 39, 29, 0.27), inset 0 -10px 20px rgba(52, 67, 48, 0.04);
  transform: translateY(-2px);
}

.room-card.is-selected {
  border-color: #f1c362;
  box-shadow: 0 0 0 2px rgba(245, 205, 119, 0.3), 0 8px 18px rgba(15, 39, 29, 0.27);
}

.room-card::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 4px;
  background: var(--room-accent, #5b876a);
  opacity: 0.75;
}

.room-card::after {
  content: "";
  position: absolute;
  right: 23%;
  bottom: -2px;
  left: 23%;
  height: 5px;
  background: #2c4d3c;
  border-top: 2px solid rgba(255, 245, 222, 0.45);
  border-radius: 4px 4px 0 0;
}

.room-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 6px;
}

.room-name-row {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: 5px;
}

.room-type-icon {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 23px;
  height: 23px;
  border: 1px solid rgba(72, 85, 60, 0.14);
  border-radius: 6px;
  background: rgba(255, 252, 240, 0.58);
  font-size: 14px;
}

.room-name {
  overflow: hidden;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.15;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.room-level {
  flex: 0 0 auto;
  padding: 2px 5px;
  color: #806846;
  background: rgba(255, 250, 235, 0.54);
  border: 1px solid rgba(140, 112, 73, 0.2);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 7px;
}

.room-sub {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-top: 4px;
  color: rgba(45, 62, 45, 0.62);
  font-size: 8px;
}

.room-sub b {
  color: var(--room-dark, #315943);
  font-family: var(--font-mono);
  font-size: 8px;
}

.room-project {
  display: flex;
  align-items: center;
  gap: 3px;
  overflow: hidden;
  padding: 4px 5px;
  margin-top: 6px;
  color: rgba(63, 89, 61, 0.82);
  background: rgba(255, 251, 238, 0.42);
  border-left: 2px solid rgba(87, 120, 80, 0.45);
  border-radius: 2px;
  font-family: var(--font-display);
  font-size: 8px;
  font-weight: 600;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.room-project b {
  margin-left: auto;
  color: rgba(83, 113, 75, 0.85);
  font-family: var(--font-mono);
  font-size: 7px;
}

.room-project.is-empty {
  color: rgba(87, 100, 77, 0.43);
  border-left-color: rgba(87, 100, 77, 0.18);
  font-family: var(--font-body);
  font-size: 7px;
}

.room-content {
  display: flex;
  flex: 1;
  flex-direction: column;
  justify-content: space-between;
  gap: 5px;
  min-height: 0;
  padding-top: 7px;
}

.instrument-shelf {
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 4px;
  min-height: 26px;
}

.instrument-token {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  max-width: 100%;
  padding: 3px 4px;
  color: #5e503d;
  background: rgba(255, 251, 239, 0.67);
  border: 1px solid rgba(137, 111, 74, 0.18);
  border-radius: 4px;
  font-size: 12px;
  line-height: 1;
}

.instrument-token small {
  overflow: hidden;
  max-width: 42px;
  color: #8c7657;
  font-size: 7px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.empty-instruments {
  display: flex;
  align-items: center;
  height: 26px;
  color: rgba(80, 93, 72, 0.55);
  font-size: 8px;
  font-style: italic;
}

.room-people {
  display: flex;
  align-items: center;
  min-height: 22px;
  gap: 3px;
}

.room-person-dot {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 21px;
  height: 21px;
  border: 1px solid rgba(57, 74, 53, 0.17);
  border-radius: 50%;
  background: rgba(255, 249, 232, 0.72);
  font-size: 12px;
  box-shadow: 0 1px 2px rgba(40, 50, 35, 0.1);
}

.room-person-more {
  color: #806c50;
  font-family: var(--font-mono);
  font-size: 8px;
}

.room-empty-label {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: rgba(53, 73, 50, 0.62);
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 1px;
}

.room-empty-label span {
  display: block;
  margin-top: 5px;
  color: rgba(62, 82, 58, 0.5);
  font-family: var(--font-mono);
  font-size: 7px;
  letter-spacing: 0.7px;
}

.room-empty:hover .room-empty-label {
  color: var(--green);
}

.empty-room-card {
  align-items: center;
  justify-content: center;
  color: #5d7a5d;
  background:
    repeating-linear-gradient(135deg, rgba(217, 234, 211, 0.17) 0, rgba(217, 234, 211, 0.17) 5px, transparent 5px, transparent 12px),
    rgba(190, 216, 186, 0.17);
  border: 1px dashed rgba(211, 233, 199, 0.4);
  box-shadow: none;
  cursor: pointer;
}

.empty-room-card::before,
.empty-room-card::after {
  display: none;
}

.empty-room-card:hover {
  background: rgba(214, 233, 204, 0.25);
  border-color: #efd693;
  transform: none;
}

.empty-plus {
  display: grid;
  place-items: center;
  width: 25px;
  height: 25px;
  margin-bottom: 5px;
  color: #e6d19a;
  border: 1px solid rgba(239, 218, 165, 0.58);
  border-radius: 50%;
  font-family: var(--font-mono);
  font-size: 14px;
}

.map-footer {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: space-between;
  min-height: 30px;
  gap: 10px;
  padding: 0 3px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 11px;
  color: #917d64;
  font-size: 8px;
}

.legend span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.legend-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.legend-field { background: #9eaa62; }
.legend-molecular { background: #a38dbb; }
.legend-office { background: #c49e66; }
.legend-empty { background: transparent; border: 1px dashed #b6a385; }

.people-strip {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  min-width: 0;
  gap: 4px;
}

.person-chip {
  position: relative;
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 27px;
  height: 27px;
  padding: 0;
  color: var(--ink);
  background: #fbf6e9;
  border: 1px solid rgba(142, 117, 80, 0.3);
  border-radius: 50%;
  font-size: 15px;
  box-shadow: 1px 1px 0 rgba(81, 60, 35, 0.06);
  transition: 0.15s ease;
}

.person-chip:hover {
  z-index: 2;
  border-color: var(--gold);
  transform: translateY(-2px);
}

.person-chip.is-student {
  border-color: rgba(81, 117, 157, 0.35);
}

.person-chip .chip-mood {
  position: absolute;
  right: -1px;
  bottom: -1px;
  width: 6px;
  height: 6px;
  border: 1px solid #fbf6e9;
  border-radius: 50%;
  background: #80a769;
}

.mini-projects {
  display: grid;
  flex: 0 0 auto;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
  min-height: 56px;
}

.mini-project {
  display: flex;
  align-items: center;
  min-width: 0;
  padding: 7px 9px;
  text-align: left;
  background: rgba(252, 247, 236, 0.67);
  border: 1px solid rgba(186, 161, 126, 0.4);
  border-radius: 7px;
  transition: 0.15s ease;
}

.mini-project:hover {
  background: #fff9eb;
  border-color: #d1ad6d;
}

.mini-project-icon {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 25px;
  height: 25px;
  margin-right: 7px;
  border-radius: 6px;
  background: #e9eed8;
  font-size: 14px;
}

.mini-project-copy {
  min-width: 0;
  flex: 1;
}

.mini-project-title {
  overflow: hidden;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mini-project-meta {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
  color: #9b8364;
  font-family: var(--font-mono);
  font-size: 7px;
}

.mini-project-track {
  flex: 1;
  height: 3px;
  overflow: hidden;
  background: rgba(140, 108, 65, 0.14);
  border-radius: 99px;
}

.mini-project-track i {
  display: block;
  height: 100%;
  background: var(--green-soft);
  border-radius: inherit;
}

.mini-project.is-empty {
  justify-content: center;
  color: #a18e73;
  border-style: dashed;
  font-size: 9px;
}

/* ---------------- Inspector ---------------- */

.inspector {
  padding: 1px;
}

.panel {
  overflow: hidden;
  margin-bottom: 9px;
  background: rgba(252, 247, 236, 0.84);
  border: 1px solid rgba(181, 155, 118, 0.45);
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
}

.panel-accent {
  border-top: 3px solid var(--green-soft);
}

.panel-accent.gold {
  border-top-color: var(--gold);
}

.panel-accent.coral {
  border-top-color: var(--coral);
}

.panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding: 11px 12px 8px;
}

.panel-kicker {
  color: #a18b6f;
  font-family: var(--font-mono);
  font-size: 7px;
  letter-spacing: 1.25px;
}

.panel-title {
  margin-top: 2px;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  line-height: 1.25;
}

.panel-subtitle {
  margin-top: 3px;
  color: #8e7d68;
  font-size: 10px;
  line-height: 1.5;
}

.panel-body {
  padding: 0 12px 12px;
}

.panel-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 9px 12px 12px;
  border-top: 1px dashed rgba(143, 117, 80, 0.26);
}

.section-label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 10px 0 6px;
  color: #8c7355;
  font-family: var(--font-mono);
  font-size: 7px;
  letter-spacing: 1.1px;
}

.section-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(153, 125, 86, 0.22);
}

.dashboard-task {
  padding: 11px;
  background:
    linear-gradient(135deg, rgba(245, 224, 172, 0.4), transparent 64%),
    #fff9e9;
  border: 1px solid rgba(190, 154, 84, 0.4);
  border-radius: 8px;
}

.dashboard-task-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 7px;
}

.dashboard-task-title {
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.3;
}

.task-deadline {
  flex: 0 0 auto;
  padding: 3px 6px;
  color: #876331;
  background: #f6e7c7;
  border: 1px solid rgba(167, 123, 48, 0.3);
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 7px;
}

.dashboard-task-desc {
  margin-top: 5px;
  color: #826f56;
  font-size: 10px;
  line-height: 1.55;
}

.task-progress-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.task-track {
  flex: 1;
  height: 5px;
  overflow: hidden;
  background: rgba(151, 113, 50, 0.15);
  border-radius: 99px;
}

.task-track i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #d3a64d, #e8ca7b);
  border-radius: inherit;
}

.task-progress-text {
  color: #8b6b38;
  font-family: var(--font-mono);
  font-size: 8px;
  white-space: nowrap;
}

.metric-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}

.metric-card {
  padding: 8px 9px;
  background: rgba(247, 239, 223, 0.65);
  border: 1px solid rgba(182, 157, 119, 0.3);
  border-radius: 7px;
}

.metric-label {
  color: #9a8469;
  font-family: var(--font-mono);
  font-size: 7px;
  letter-spacing: 0.5px;
}

.metric-value {
  margin-top: 3px;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  line-height: 1.15;
}

.metric-value small {
  margin-left: 3px;
  color: #927e63;
  font-family: var(--font-body);
  font-size: 8px;
  font-weight: 500;
}

.academic-card {
  padding: 10px;
  background:
    radial-gradient(circle at 100% 0, rgba(216, 174, 79, 0.18), transparent 50%),
    #fbf4e1;
  border: 1px solid rgba(194, 156, 80, 0.42);
  border-radius: 8px;
}

.academic-card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.academic-card-head span {
  color: #876c3e;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
}

.academic-score {
  color: #a26f1f;
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 800;
}

.academic-score small {
  color: #9e8964;
  font-size: 9px;
  font-weight: 500;
}

.academic-card p {
  margin-top: 4px;
  color: #907b5e;
  font-size: 9px;
  line-height: 1.4;
}

.academic-requirements {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}

.requirement-pill {
  padding: 2px 5px;
  color: #8c7040;
  background: rgba(255, 251, 238, 0.6);
  border: 1px solid rgba(173, 137, 73, 0.24);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 7px;
}

.requirement-pill.is-met {
  color: #47765b;
  border-color: rgba(78, 126, 91, 0.33);
  background: rgba(223, 239, 219, 0.52);
}

.opportunity-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.opportunity {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
  padding: 7px 8px;
  background: #f8fbf3;
  border: 1px solid rgba(86, 128, 84, 0.26);
  border-radius: 6px;
}

.opportunity-copy {
  min-width: 0;
  flex: 1;
}

.opportunity-title {
  overflow: hidden;
  color: #335644;
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.opportunity-meta {
  margin-top: 2px;
  color: #819477;
  font-family: var(--font-mono);
  font-size: 7px;
}

.log-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.log-entry {
  position: relative;
  padding-left: 10px;
  color: #7d6c57;
  font-size: 9px;
  line-height: 1.45;
}

.log-entry::before {
  content: "";
  position: absolute;
  top: 5px;
  left: 0;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #b9a68a;
}

.log-entry.kind-good::before { background: #6f9a6a; }
.log-entry.kind-bad::before { background: #ba6658; }
.log-entry.kind-paper::before { background: #c19b46; }
.log-entry.kind-story::before { background: var(--green-soft); }
.log-entry.kind-supervisor::before { background: #d2a35b; }

.log-month {
  margin-right: 4px;
  color: #a4927c;
  font-family: var(--font-mono);
  font-size: 7px;
}

/* detail views */

.detail-top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 48px;
  height: 48px;
  border: 2px solid rgba(255, 249, 235, 0.93);
  border-radius: 50%;
  background: #efe1c2;
  box-shadow: 0 0 0 1px rgba(124, 103, 71, 0.24);
  font-size: 26px;
}

.avatar.rarity-A { background: #dbe6f3; }
.avatar.rarity-S { background: #f4e5ba; }
.avatar.rarity-SSR { background: #f3d6d0; }

.detail-name {
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  line-height: 1.2;
}

.detail-sub {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  margin-top: 3px;
  color: #8b7860;
  font-size: 9px;
}

.rarity-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 15px;
  padding: 0 4px;
  color: #fff8e8;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 8px;
  font-weight: 800;
}

.rarity-C { background: #8e8478; }
.rarity-B { background: #4d7e6d; }
.rarity-A { background: #4d6da8; }
.rarity-S { background: #a77927; }
.rarity-SSR { background: #b45151; }

.trait-line {
  display: flex;
  align-items: flex-start;
  gap: 5px;
  padding: 7px 8px;
  margin-top: 9px;
  color: #7d6c56;
  background: rgba(242, 232, 212, 0.54);
  border: 1px solid rgba(177, 151, 111, 0.25);
  border-radius: 6px;
  font-size: 9px;
  line-height: 1.45;
}

.trait-line b {
  color: #5e4b34;
}

.field-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 8px;
}

.field-tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 5px;
  color: #59735a;
  background: rgba(228, 237, 217, 0.68);
  border: 1px solid rgba(115, 146, 108, 0.24);
  border-radius: 4px;
  font-size: 8px;
}

.field-tag.secondary {
  color: #9a8468;
  background: rgba(245, 236, 218, 0.64);
  border-color: rgba(181, 154, 115, 0.22);
}

.stat-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
  margin-top: 9px;
}

.stat-item {
  padding: 6px 7px;
  background: rgba(249, 243, 230, 0.7);
  border: 1px solid rgba(182, 154, 115, 0.2);
  border-radius: 5px;
}

.stat-item-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #8e7b61;
  font-size: 8px;
}

.stat-item-head b {
  color: #536b54;
  font-family: var(--font-mono);
  font-size: 10px;
}

.stat-track {
  height: 4px;
  margin-top: 4px;
  overflow: hidden;
  background: rgba(122, 101, 71, 0.13);
  border-radius: 99px;
}

.stat-track i {
  display: block;
  height: 100%;
  background: #7e9c75;
  border-radius: inherit;
}

.stat-item:nth-child(2) .stat-track i { background: #7792b0; }
.stat-item:nth-child(3) .stat-track i { background: #c39852; }
.stat-item:nth-child(4) .stat-track i { background: #a0849e; }

.person-meta-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 5px;
  margin-top: 9px;
}

.person-meta {
  padding: 5px 7px;
  color: #8b7861;
  background: rgba(248, 241, 228, 0.6);
  border-radius: 4px;
  font-size: 8px;
}

.person-meta b {
  display: block;
  margin-top: 2px;
  color: #4e604d;
  font-family: var(--font-mono);
  font-size: 10px;
}

.person-project-link {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px;
  margin-top: 8px;
  color: #4e634d;
  background: rgba(228, 238, 218, 0.48);
  border: 1px solid rgba(106, 137, 94, 0.23);
  border-radius: 5px;
  font-size: 9px;
}

.person-project-link span {
  overflow: hidden;
  flex: 1;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.project-progress-large {
  height: 7px;
  margin-top: 7px;
  overflow: hidden;
  background: rgba(104, 87, 61, 0.13);
  border-radius: 99px;
}

.project-progress-large i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #799b6d, #aecb8e);
  border-radius: inherit;
}

.project-meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 9px;
}

.meta-pill {
  padding: 3px 6px;
  color: #816b4e;
  background: rgba(246, 238, 222, 0.8);
  border: 1px solid rgba(173, 145, 104, 0.25);
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 8px;
}

.team-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 6px;
}

.team-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 6px;
  color: #6f5e49;
  background: rgba(247, 240, 226, 0.7);
  border: 1px solid rgba(181, 155, 115, 0.18);
  border-radius: 5px;
  font-size: 9px;
}

.team-row .avatar {
  width: 24px;
  height: 24px;
  font-size: 14px;
  border-width: 1px;
}

.team-row span {
  overflow: hidden;
  flex: 1;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.equipment-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px dashed rgba(155, 128, 90, 0.21);
  color: #88745c;
  font-size: 9px;
}

.equipment-line:last-child {
  border-bottom: 0;
}

.equipment-line b {
  color: #536b54;
  font-family: var(--font-mono);
  font-size: 9px;
}

.room-detail-instrument {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 0;
  border-bottom: 1px dashed rgba(153, 126, 86, 0.22);
}

.room-detail-instrument:last-child {
  border-bottom: 0;
}

.room-detail-instrument .instrument-icon {
  display: grid;
  place-items: center;
  width: 29px;
  height: 29px;
  background: rgba(236, 242, 224, 0.7);
  border: 1px solid rgba(137, 160, 120, 0.22);
  border-radius: 6px;
  font-size: 16px;
}

.room-detail-instrument-copy {
  flex: 1;
  min-width: 0;
}

.room-detail-instrument-name {
  overflow: hidden;
  color: #4e5e49;
  font-size: 9px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.room-detail-instrument-meta {
  margin-top: 2px;
  color: #928069;
  font-size: 8px;
}

/* buttons */

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 31px;
  padding: 6px 11px;
  color: var(--green-deep);
  background: #fbf5e7;
  border: 1px solid #bca27b;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  line-height: 1.1;
  transition: 0.15s ease;
}

.button:hover {
  background: #fffdf5;
  border-color: #9e8054;
}

.button-primary {

/* ---------------- Action bar ---------------- */

.actionbar {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 15px;
  min-height: 68px;
  padding: 9px 19px;
  background:
    linear-gradient(180deg, rgba(255, 252, 244, 0.84), #f8f0df),
    var(--paper-light);
  border-top: 1px solid rgba(173, 147, 109, 0.46);
  box-shadow: 0 -4px 15px rgba(70, 52, 31, 0.06);
}

.ap-block {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 194px;
}

.ap-label {
  color: #88745b;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.8px;
}

.ap-dots {
  display: flex;
  gap: 4px;
}

.ap-dot {
  width: 12px;
  height: 12px;
  border: 1px solid #b89562;
  border-radius: 50%;
  background: #fff7e7;
  box-shadow: inset 0 0 0 2px #f8efdb;
}

.ap-dot.is-filled {
  background: #cf9c3f;
  border-color: #a16f25;
  box-shadow: inset 0 0 0 2px #f4dfaa;
}

.ap-text {
  color: #7d674e;
  font-family: var(--font-mono);
  font-size: 10px;
}

.action-hint {
  flex: 1;
  overflow: hidden;
  color: #8e7b64;
  font-family: var(--font-display);
  font-size: 11px;
  line-height: 1.4;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.action-buttons {
  display: flex;
  align-items: center;
  gap: 8px;
}

.advance-button {
  display: flex;
  flex-direction: column;
  min-width: 140px;
  height: 42px;
  padding: 5px 17px;
  line-height: 1.1;
}

.advance-button span {
  font-family: var(--font-display);
  font-size: 14px;
}

.advance-button small {
  margin-top: 2px;
  color: rgba(255, 247, 228, 0.68);
  font-family: var(--font-mono);
  font-size: 7px;
  font-weight: 400;
}

/* ---------------- Modals ---------------- */

.modal-backdrop {
  position: fixed;
  z-index: 100;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(24, 38, 29, 0.58);
  backdrop-filter: blur(4px);
  animation: fadeIn 0.18s ease both;
}

.modal {
  display: flex;
  flex-direction: column;
  width: min(780px, calc(100vw - 44px));
  max-height: min(88vh, 820px);
  overflow: hidden;
  color: var(--ink);
  background:
    radial-gradient(circle at 100% 0, rgba(200, 161, 85, 0.09), transparent 35%),
    var(--paper-light);
  border: 1px solid rgba(249, 238, 214, 0.8);
  border-radius: 14px;
  box-shadow: 0 24px 65px rgba(13, 26, 18, 0.35);
  animation: modalIn 0.22s cubic-bezier(0.2, 0.75, 0.25, 1) both;
}

.modal-wide {
  width: min(990px, calc(100vw - 44px));
}

.modal-narrow {
  width: min(520px, calc(100vw - 44px));
}

.modal-header {
  display: flex;
  flex: 0 0 auto;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 20px 14px;
  background:
    linear-gradient(135deg, rgba(255, 249, 235, 0.72), transparent 60%),
    #f3e9d7;
  border-bottom: 1px solid rgba(168, 140, 99, 0.3);
}

.modal-kicker {
  color: #a1855d;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 1.5px;
}

.modal-title {
  margin-top: 3px;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 23px;
  font-weight: 700;
  line-height: 1.2;
}

.modal-subtitle {
  max-width: 630px;
  margin-top: 5px;
  color: #8e7b64;
  font-size: 10px;
  line-height: 1.55;
}

.modal-close {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 30px;
  height: 30px;
  padding: 0;
  color: #7f6a52;
  background: rgba(255, 250, 238, 0.55);
  border: 1px solid rgba(157, 128, 86, 0.35);
  border-radius: 50%;
  font-family: var(--font-mono);
  font-size: 15px;
  line-height: 1;
}

.modal-close:hover {
  color: var(--green-deep);
  background: #fffdf3;
}

.modal-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 20px;
}

.modal-footer {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  padding: 11px 20px;
  background: rgba(245, 234, 215, 0.57);
  border-top: 1px solid rgba(170, 143, 101, 0.27);
}

.modal-section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 4px 0 9px;
  color: #5d4932;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
}

.modal-section-title span {
  color: #9e8769;
  font-family: var(--font-body);
  font-size: 9px;
  font-weight: 400;
}

/* grids */

.candidate-grid {

.candidate-card {

  font-size: 10px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.paper-archive-copy small {
  display: block;
  overflow: hidden;
  margin-top: 2px;
  color: #968066;
  font-size: 8px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.paper-archive-if {
  flex: 0 0 auto;
  color: #9a6b29;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
}

/* report */

.report-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 12px 14px;
  background: #f0e5d0;
  border: 1px solid rgba(167, 136, 88, 0.3);
  border-radius: 8px;
}

.report-date {
  color: #8e7759;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.8px;
}

.report-title {
  margin-top: 3px;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 700;
}

.report-net {
  color: #4d7659;
  font-family: var(--font-mono);
  font-size: 23px;
  font-weight: 800;
  text-align: right;
}

.report-net.is-negative {
  color: #a84c3f;
}

.report-net small {
  display: block;
  color: #8e7b63;
  font-family: var(--font-body);
  font-size: 8px;
  font-weight: 400;
}

.report-finance {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
  margin-top: 10px;
}

.report-finance-item {
  padding: 8px 9px;
  background: rgba(249, 243, 231, 0.7);
  border: 1px solid rgba(174, 145, 103, 0.24);
  border-radius: 5px;
  color: #8b7861;
  font-size: 9px;
}

.report-finance-item b {
  display: block;
  margin-top: 3px;
  color: #465e4c;
  font-family: var(--font-mono);
  font-size: 13px;
}

.report-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.report-project {
  padding: 8px 9px;
  background: #fffaf0;
  border: 1px solid rgba(174, 145, 103, 0.25);
  border-radius: 6px;
}

.report-project-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  color: #5b4b36;
  font-size: 9px;
}

.report-project-head b {
  color: #567452;
  font-family: var(--font-mono);
  font-size: 8px;
}

.report-project-track {
  height: 4px;
  margin-top: 5px;
  overflow: hidden;
  background: rgba(124, 101, 66, 0.12);
  border-radius: 99px;
}

.report-project-track i {
  display: block;
  height: 100%;
  background: #82a370;
  border-radius: inherit;
}

/* event */

.event-hero {
  position: relative;
  padding: 18px;
  overflow: hidden;
  background:
    radial-gradient(circle at 90% 0, rgba(218, 171, 82, 0.17), transparent 40%),
    #f0e4ce;
  border: 1px solid rgba(169, 137, 86, 0.36);
  border-radius: 8px;
}

.event-hero::after {
  content: "EVENT";
  position: absolute;
  right: 10px;
  bottom: -8px;
  color: rgba(109, 82, 43, 0.09);
  font-family: var(--font-display);
  font-size: 56px;
  font-weight: 800;
}

.event-kicker {
  color: #a38658;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 1.2px;
}

.event-title {
  margin-top: 5px;
  color: #433422;
  font-family: var(--font-display);
  font-size: 23px;
  font-weight: 700;
  line-height: 1.3;
}

.event-desc {
  max-width: 630px;
  margin-top: 8px;
  color: #7e6b53;
  font-size: 10px;
  line-height: 1.65;
}

.event-options {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-top: 12px;
}

.event-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 11px;
  text-align: left;
  background: #fffaf0;
  border: 1px solid rgba(174, 145, 103, 0.34);
  border-radius: 7px;
  transition: 0.15s ease;
}

.event-option:hover {
  border-color: #c3974f;
  background: #fffdf5;
}

.event-option-index {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 23px;
  height: 23px;
  color: #8d6b38;
  background: #f5e8cc;
  border: 1px solid rgba(173, 138, 76, 0.27);
  border-radius: 50%;
  font-family: var(--font-mono);
  font-size: 9px;
}

.event-option-copy {
  flex: 1;
  min-width: 0;
}

.event-option-label {
  color: #4e3d2a;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
}

.event-option-desc {
  margin-top: 2px;
  color: #8b7860;
  font-size: 9px;
  line-height: 1.4;
}

/* onboarding / ending */

.onboarding-modal {
  width: min(900px, calc(100vw - 44px));
}

.onboarding-hero {
  position: relative;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 24px;
  overflow: hidden;
  color: #f8ecd6;
  background:
    radial-gradient(circle at 90% 0, rgba(226, 195, 119, 0.17), transparent 40%),
    #244638;
  border-bottom: 1px solid rgba(247, 233, 204, 0.16);
}

.onboarding-hero::after {
  content: "稻田、基因组、还有你";
  position: absolute;
  right: 24px;
  bottom: 14px;
  color: rgba(241, 222, 178, 0.24);
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 2px;
}

.onboarding-portrait {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 92px;
  height: 92px;
  border: 2px solid rgba(244, 223, 169, 0.6);
  border-radius: 50%;
  background: #dfc791;
  font-size: 52px;
  box-shadow: 0 0 0 7px rgba(244, 222, 173, 0.1);
}

.onboarding-kicker {
  color: #c8b383;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 2px;
}

.onboarding-title {
  margin-top: 4px;
  color: #fff5df;
  font-family: var(--font-display);
  font-size: 31px;
  font-weight: 700;
  line-height: 1.18;
}

.onboarding-sub {
  max-width: 610px;
  margin-top: 8px;
  color: #b8c7b6;
  font-size: 11px;
  line-height: 1.65;
}

.onboarding-steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  padding: 18px 24px 6px;
}

.onboarding-step {
  padding: 12px;
  background: #fffaf0;
  border: 1px solid rgba(178, 148, 104, 0.36);
  border-radius: 8px;
}

.onboarding-step-num {
  color: #b58c4a;
  font-family: var(--font-mono);
  font-size: 9px;
}

.onboarding-step-title {
  margin-top: 6px;
  color: #483823;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
}

.onboarding-step-desc {
  margin-top: 4px;
  color: #8e7a61;
  font-size: 9px;
  line-height: 1.6;
}

.onboarding-note {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 11px 13px;
  margin: 12px 24px 20px;
  color: #846f52;
  background: #f4e9d4;
  border-left: 3px solid #c39a53;
  border-radius: 4px;
  font-size: 9px;
  line-height: 1.6;
}

.ending-scene {
  padding: 27px 22px;
  text-align: center;
  background:
    radial-gradient(circle at 50% 0, rgba(224, 193, 126, 0.2), transparent 44%),
    #f3e8d4;
  border-radius: 9px;
}

.ending-icon {
  display: grid;
  place-items: center;
  width: 77px;
  height: 77px;
  margin: 0 auto 10px;
  border: 2px solid rgba(193, 151, 71, 0.44);
  border-radius: 50%;
  background: #f6e3b0;
  font-size: 40px;
}

.ending-title {
  color: #443522;
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
}

.ending-desc {
  max-width: 600px;
  margin: 8px auto 0;
  color: #836e54;
  font-size: 11px;
  line-height: 1.7;
}

.ending-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 7px;
  margin-top: 16px;
}

.ending-stat {
  padding: 9px;
  background: rgba(255, 250, 238, 0.68);
  border: 1px solid rgba(179, 147, 98, 0.27);
  border-radius: 6px;
}

.ending-stat b {
  display: block;
  color: #4a604a;
  font-family: var(--font-mono);
  font-size: 18px;
}

.ending-stat span {
  display: block;
  margin-top: 2px;
  color: #967f61;
  font-size: 8px;
}

/* toast and tip */

.toast-root {
  position: fixed;
  z-index: 200;
  right: 22px;
  bottom: 82px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 7px;
  pointer-events: none;
}

.toast {
  max-width: min(390px, calc(100vw - 40px));
  padding: 9px 13px;
  color: #f9efd8;
  background: rgba(29, 56, 43, 0.95);
  border: 1px solid rgba(245, 228, 190, 0.24);
  border-radius: 6px;
  box-shadow: 0 7px 18px rgba(31, 40, 28, 0.2);
  font-size: 10px;
  line-height: 1.5;
  animation: toastIn 0.2s ease both;
}

.toast.is-bad {
  background: rgba(113, 57, 48, 0.96);
}

.toast.is-gold {
  color: #4e3a1e;
  background: #f3d68e;
  border-color: #c59b48;
}

.hover-tip {
  position: fixed;
  z-index: 300;
  max-width: 230px;
  padding: 5px 7px;
  color: #fff7e7;
  background: rgba(26, 44, 33, 0.94);
  border: 1px solid rgba(247, 231, 198, 0.2);
  border-radius: 4px;
  font-size: 9px;
  line-height: 1.4;
  pointer-events: none;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.12s ease, transform 0.12s ease;
}

.hover-tip.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.noscript {
  padding: 30px;
  color: #7d3d34;
  background: #fff2e0;
  text-align: center;
}

/* ---------------- animations ---------------- */

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(9px) scale(0.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(6px) rotateX(8deg); }
  to { opacity: 1; transform: translateY(0) rotateX(0); }
}

@keyframes toastIn {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseSoft {
  0%, 100% { box-shadow: 0 0 0 0 rgba(202, 157, 76, 0); }
  50% { box-shadow: 0 0 0 4px rgba(202, 157, 76, 0.12); }
}

.pulse {
  animation: pulseSoft 2.6s ease-in-out infinite;
}

/* ---------------- responsive ---------------- */

@media (max-width: 1260px) {
  .main-shell {
    grid-template-columns: 202px minmax(430px, 1fr) 310px;
    gap: 10px;
    padding: 10px 12px;
  }

  .topbar {
    grid-template-columns: minmax(220px, 1fr) 150px minmax(370px, 1.35fr) auto;
    gap: 10px;
    padding: 10px 16px;
  }

  .brand-sub {
    max-width: 250px;
  }

  .resource-chip {
    min-width: 78px;
    padding: 4px 6px;
  }

  .academic-mini {
    min-width: 110px;
  }

  .inspector {
    font-size: 13px;
  }
}

@media (max-width: 1080px) {
  body {
    overflow: auto;
  }

  .game-shell {
    height: auto;
    min-height: 100vh;
  }

  .topbar {
    grid-template-columns: 1fr 155px;
    grid-template-areas:
      "brand date"
      "resources actions";
    gap: 8px 12px;
    padding: 11px 15px;
  }

  .brand-block { grid-area: brand; }
  .date-block { grid-area: date; border-right: 0; padding-right: 0; }
  .top-resources { grid-area: resources; flex-wrap: wrap; }
  .top-actions { grid-area: actions; justify-content: flex-end; }

  .main-shell {
    grid-template-columns: 184px minmax(420px, 1fr);
    min-height: 680px;
  }

  .side-rail {
    grid-row: span 2;
  }

  .inspector {
    grid-column: 2;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
    overflow: visible;
  }

  .inspector .panel {
    margin-bottom: 0;
  }

  .lab-map {
    min-height: 500px;
  }

  .actionbar {
    position: sticky;
    bottom: 0;
    z-index: 8;
  }
}

@media (max-width: 820px) {
  .topbar {
    grid-template-columns: 1fr;
    grid-template-areas:
      "brand"
      "date"
      "resources"
      "actions";
  }

  .date-block {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 0;
    border: 0;
  }

  .campaign-track,
  .date-sub {
    display: none;
  }

  .date-main {
    font-size: 17px;
  }

  .top-actions {
    position: absolute;
    top: 10px;
    right: 13px;
  }

  .main-shell {
    display: flex;
    flex-direction: column;
    padding: 9px;
    min-height: 0;
  }

  .side-rail {
    display: block;
    order: 1;
  }

  .supervisor-card {
    display: none;
  }

  .nav-list {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .nav-item {
    justify-content: center;
    padding: 4px;
    text-align: center;
  }

  .nav-icon {
    margin-right: 3px;
  }

  .nav-item small {
    display: none;
  }

  .rail-note {
    display: none;
  }

  .rail-footer {
    display: none;
  }

  .workspace {
    order: 2;
  }

  .lab-map {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(4, minmax(0, 1fr));
    min-height: 560px;
    gap: 5px;
    padding: 7px;
  }

  .room-project {
    display: none;
  }

  .room-card {
    padding: 7px;
  }

  .room-name {
    font-size: 10px;
  }

  .room-type-icon {
    display: none;
  }

  .instrument-token small {
    display: none;
  }

  .inspector {
    order: 3;
    display: block;
  }

  .lab-heading {
    align-items: flex-start;
  }

  .lab-heading-right {
    display: none;
  }

  .people-strip {
    flex-wrap: wrap;
  }

  .legend {
    display: none;
  }

  .map-footer {
    min-height: 27px;
  }

  .people-strip {
    justify-content: flex-start;
  }

  .mini-projects {
    grid-template-columns: 1fr;
  }

  .mini-project.is-empty {
    display: none;
  }

  .actionbar {
    flex-wrap: wrap;
    padding: 8px 10px;
    gap: 8px;
  }

  .ap-block {
    min-width: 155px;
  }

  .action-hint {
    order: 3;
    flex-basis: 100%;
    white-space: normal;
  }

  .action-buttons {
    margin-left: auto;
  }

  .modal-backdrop {
    padding: 10px;
  }

  .modal {
    max-height: 92vh;
  }

  .journal-options {
    grid-template-columns: 1fr;
  }

  .onboarding-steps {
    grid-template-columns: 1fr;
  }

  .onboarding-hero {
    align-items: flex-start;
    padding: 18px;
  }

  .onboarding-portrait {
    width: 58px;
    height: 58px;
    font-size: 33px;
  }

  .onboarding-title {
    font-size: 24px;
  }

  .ending-stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

    const traits = members.flatMap((person) => traitInfos(person));
    const hasTrait = (id) => traits.some((trait) => trait.id === id);
    const fieldMembers = members.filter((person) => {
      return fieldsCompatible(person.primaryField, project.field) || fieldsCompatible(person.secondaryField, project.field);
    });
    const paperMembers = members.filter((person) => {
      return person.stats.writing >= 60 || traitInfos(person).some((trait) => trait.tags.indexOf("paper") >= 0);
    });
    const nightMembers = members.filter((person) => {
      return traitInfos(person).some((trait) => trait.tags.indexOf("night") >= 0);
    });
    const mentor = members.some((person) => ["phd", "postdoc"].indexOf(person.roleId) >= 0);
    const junior = members.some((person) => ["master", "phd"].indexOf(person.roleId) >= 0);
    const negative = members.filter((person) => traitInfos(person).some((trait) => trait.tone === "bad"));
    const bonds = [];
    if (fieldMembers.length >= 2) bonds.push(D.BONDS.find((bond) => bond.id === "field_pair"));
    if (paperMembers.length >= 2) bonds.push(D.BONDS.find((bond) => bond.id === "paper_club"));
    if (nightMembers.length >= 2) bonds.push(D.BONDS.find((bond) => bond.id === "night_shift"));
    if (mentor && junior && members.length >= 2) bonds.push(D.BONDS.find((bond) => bond.id === "mentor_pair"));
    if (negative.length >= 2) bonds.push(D.BONDS.find((bond) => bond.id === "rival_pair"));
    return bonds.filter(Boolean);
  }

  function labBonds(state) {
    const people = activePeople(state);
    const socials = people.filter((person) => {
      return person.stats.eq >= 65 || traitInfos(person).some((trait) => trait.tags.indexOf("social") >= 0);
    });
    return socials.length >= 2 ? [D.BONDS.find((bond) => bond.id === "social_glue")].filter(Boolean) : [];
  }

  function activePeople(state) {
    return state.people.filter((person) => person.status === "active");
  }

  function staff(state) {
    return activePeople(state).filter((person) => person.kind === "staff");
  }

  function students(state) {
    return activePeople(state).filter((person) => person.kind === "student");
  }

  function getPerson(state, id) {
    return state.people.find((person) => person.id === id) || null;
  }

  function getProject(state, id) {
    return state.projects.find((project) => project.id === id) || null;
  }

  function getRoom(state, slot) {
    return state.rooms.find((room) => room.slot === Number(slot)) || null;
  }

  function roomInfo(room) {
    return D.ROOM_TYPES.find((type) => type.id === room.type) || D.ROOM_TYPES[0];
  }

  function instrumentInfo(instrument) {
    return D.INSTRUMENTS.find((item) => item.id === instrument.key) || D.INSTRUMENTS[0];
  }

  function labScale(state) {
    const roomLevels = state.rooms.reduce((sum, room) => sum + Math.max(0, room.level - 1), 0);
    return state.rooms.length + state.instruments.length + roomLevels;
  }

  function labCapacity(state) {
    const offices = state.rooms.filter((room) => room.type === "office").length;
    const meetings = state.rooms.filter((room) => room.type === "meeting").length;
    return 6 + offices * 2 + meetings;
  }

  function recruiterBonus(state) {
    return activePeople(state).filter((person) => {
      return person.roleId === "admin" || traitInfos(person).some((trait) => trait.tags.indexOf("social") >= 0);
    }).length;
  }

  function atmosphere(state) {
    const people = activePeople(state);
    if (!people.length) return 12;
    const avgEq = people.reduce((sum, person) => sum + person.stats.eq, 0) / people.length;
    const avgMorale = people.reduce((sum, person) => sum + person.morale, 0) / people.length;
    const meeting = state.rooms.some((room) => room.type === "meeting") ? 3 : 0;
    const social = people.filter((person) => traitInfos(person).some((trait) => trait.tags.indexOf("social") >= 0)).length * 2;
    const admin = people.filter((person) => person.roleId === "admin").length * 2;
    const bondBonus = labBonds(state).reduce((sum, bond) => sum + (bond.effects.atmosphere || 0), 0);
    const conflictPenalty = (state.lab.conflicts || 0) * 9;
    const value = 32 + avgEq * 0.32 + avgMorale * 0.22 + meeting + social + admin + bondBonus - conflictPenalty;
    return clamp(Math.round(value), 5, 100);
  }

  function researchMultiplier(state) {
    return 0.7 + state.lab.atmosphere / 250;
  }

  function monthlyIncome(state) {
    return Math.round(60000 + state.reputation * 500 + labScale(state) * 1500);
  }

  function monthlyExpenses(state) {
    let staffCost = 0;
    for (const person of activePeople(state)) {
      staffCost += person.salary;
      const mods = personMods(person);
      if (mods.cost) staffCost += mods.cost;
    }
    const instrumentCost = state.instruments.reduce((sum, instrument) => {
      return sum + instrumentInfo(instrument).upkeep;
    }, 0);
    const roomCost = state.rooms.reduce((sum, room) => sum + roomInfo(room).upkeep, 0);
    return staffCost + instrumentCost + roomCost;
  }

  function refreshAtmosphere(state) {
    state.lab.atmosphere = atmosphere(state);
    return state.lab.atmosphere;
  }

  function baseAcademicianScore(state) {
    return Math.round(
      state.papers.length * 3 +
        state.totalIF * 2.5 +
        labScale(state) * 1.2 +
        state.reputation * 0.35 +
        state.supervisorFavor * 0.2 +
        (state.stats.tasksDone || 0) * 1.2
    );
  }

  function academicianScore(state) {
    return Math.max(0, baseAcademicianScore(state) - (state.votePenalty || 0));
  }

  function academicianVoteChance(state) {
    const raw =
      0.18 +
      state.reputation / 280 +
      state.supervisorFavor / 430 +
      state.papers.length * 0.012 +
      state.totalIF / 480 +
      (labScale(state) - D.TARGET_SCALE) * 0.008 -
      (state.voteFailures || 0) * 0.05;
    return clamp(raw, 0.08, 0.75);
  }

  function academicianStatus(state) {
    const score = academicianScore(state);
    const papersOk = state.papers.length >= D.TARGET_PAPERS;
    const ifOk = state.totalIF >= D.TARGET_IF;
    const scaleOk = labScale(state) >= D.TARGET_SCALE;
    const reputationOk = state.reputation >= D.TARGET_REPUTATION;
    const scoreOk = score >= D.ACADEMICIAN_TARGET;
    const cooldownLeft = Math.max(0, (state.voteCooldownUntil || -1) - state.month);
    return {
      score,
      baseScore: baseAcademicianScore(state),
      votePenalty: state.votePenalty || 0,
      target: D.ACADEMICIAN_TARGET,
      percent: clamp(Math.round((score / D.ACADEMICIAN_TARGET) * 100), 0, 100),
      papers: state.papers.length,
      targetPapers: D.TARGET_PAPERS,
      papersOk,
      totalIF: round(state.totalIF, 1),
      targetIF: D.TARGET_IF,
      ifOk,
      scale: labScale(state),
      targetScale: D.TARGET_SCALE,
      scaleOk,
      reputation: state.reputation,
      targetReputation: D.TARGET_REPUTATION,
      reputationOk,
      scoreOk,
      requirementMet: scoreOk && papersOk && ifOk && scaleOk && reputationOk,
      voteFailures: state.voteFailures || 0,
      voteChance: round(academicianVoteChance(state), 2),
      voteCooldownLeft: cooldownLeft,
      voteReady:
        state.phase === "playing" &&
        scoreOk &&
        papersOk &&
        ifOk &&
        scaleOk &&
        reputationOk &&
        cooldownLeft <= 0
    };
  }

  function applyForAcademician(state) {
    if (state.phase !== "playing") return { ok: false, message: "这局已经结束。" };
    const status = academicianStatus(state);
    if (!status.requirementMet) return { ok: false, message: "还没有达到院士提名的全部条件。" };
    if (!status.voteReady) {
      return { ok: false, message: `院士投票每 12 个月最多一次，还要等 ${status.voteCooldownLeft} 个月。` };
    }
    if (state.ap < D.VOTE_AP) return { ok: false, message: `提交提名需要 ${D.VOTE_AP} 点行动点。` };
    if (!canAfford(state, D.VOTE_FEE)) return { ok: false, message: `提名材料与学部差旅需要 ¥${D.VOTE_FEE.toLocaleString()}。` };
    spend(state, D.VOTE_FEE);
    spendAP(state, D.VOTE_AP);
    const chance = academicianVoteChance(state);
    const success = rand(state) < chance;
    if (success) {
      state.phase = "won";
      state.supervisorFavor = clamp(state.supervisorFavor + 12, 0, 100);
      state.reputation = clamp(state.reputation + 15, 0, 100);
      state.ending = {
        type: "academician",
        title: "当选院士",
        text: `学部投票通过。周启明教授当选院士，你的实验室成为学院里最亮的灯。`,
        voteChance: round(chance, 2),
        month: state.month
      };
      log(state, "学部投票通过！周启明教授当选院士。", "gold");
      return { ok: true, success: true, chance, status: academicianStatus(state) };
    }
    state.voteFailures = (state.voteFailures || 0) + 1;
    state.votePenalty = (state.votePenalty || 0) + 42;
    state.reputation = clamp(state.reputation - 12, 0, 100);
    state.supervisorFavor = clamp(state.supervisorFavor - 8, 0, 100);
    state.voteCooldownUntil = state.month + 12;
    updateSupervisorTask(state);
    log(state, "学部投票没有通过。评审意见尖锐，提名进度和声望都倒退了；一年后才能再次提名。", "bad");
    return { ok: true, success: false, chance, status: academicianStatus(state) };
  }

  function canAfford(state, amount) {
    return state.funds >= amount;
  }

  function spend(state, amount) {
    if (state.funds < amount) return false;
    state.funds -= amount;
    return true;
  }

  function spendAP(state, amount) {
    if (state.ap < amount) return false;
    state.ap -= amount;
    return true;
  }

  function nextRefreshMonth(state) {
    const remainder = state.month % 6;
    return state.month + (remainder === 0 ? 6 : 6 - remainder);
  }

  function personMods(person) {
    return traitMods(person);
  }

  function effectiveStat(person, key) {
    const value = Number(person.stats[key]) || 0;
    const mods = personMods(person);
    return clamp(value + (mods[key] || 0), 1, 99);
  }

  function fieldMatch(person, field) {
    if (person.primaryField === field && person.secondaryField === field) return 1.1;
    if (person.primaryField === field) return 1;
    if (person.secondaryField === field) return 0.55;
    if (fieldsCompatible(person.primaryField, field)) return 0.7;
    if (fieldsCompatible(person.secondaryField, field)) return 0.42;
    return 0.2;
  }

  function fieldLevel(person, field) {
    return Number(person.fieldLevels[field]) || 0;
  }

  function externalBookingsFor(state, projectId) {
    return (state.externalBookings || []).filter((booking) => {
      return booking.projectId === projectId && Number(booking.expiresMonth) > state.month;
    });
  }

  function projectRequirementStatus(state, project) {
    const requiredRoom = project.requiredRoom || null;
    const requiredInstrument = project.requiredInstrument || null;
    const room = requiredRoom ? state.rooms.find((item) => item.type === requiredRoom) : null;
    const ownedInstrument = requiredInstrument
      ? state.instruments.find((item) => item.key === requiredInstrument)
      : null;
    const external = requiredInstrument
      ? externalBookingsFor(state, project.id).find((booking) => booking.instrumentKey === requiredInstrument)
      : null;
    const missing = [];
    if (requiredRoom && !room) missing.push(D.ROOM_TYPES.find((item) => item.id === requiredRoom)?.name || requiredRoom);
    if (requiredInstrument && !ownedInstrument && !external) {
      missing.push(D.INSTRUMENTS.find((item) => item.id === requiredInstrument)?.name || requiredInstrument);
    }
    return {
      ok: missing.length === 0,
      missing,
      requiredRoom,
      requiredInstrument,
      room,
      ownedInstrument,
      external,
      roomName: requiredRoom ? (D.ROOM_TYPES.find((item) => item.id === requiredRoom)?.name || requiredRoom) : null,
      instrumentName: requiredInstrument ? (D.INSTRUMENTS.find((item) => item.id === requiredInstrument)?.name || requiredInstrument) : null
    };
  }

  function projectEquipmentBonus(state, project) {
    let bonus = 0;
    for (const instrument of state.instruments) {
      const info = instrumentInfo(instrument);
      if (fieldsCompatible(project.field, info.field)) bonus += info.bonus;
    }
    for (const room of state.rooms) {
      const info = roomInfo(room);
      if (fieldsCompatible(project.field, info.field)) {
        bonus += Math.round(info.bonus * 100 * room.level);
      }
    }
    for (const booking of externalBookingsFor(state, project.id)) {
      const platform = D.EXTERNAL_PLATFORM.find((item) => item.instrument === booking.instrumentKey);
      if (platform) bonus += platform.bonus;
    }
    return Math.min(80, bonus);
  }

  function projectEquipmentPaperBonus(state, project) {
    let bonus = 0;
    for (const instrument of state.instruments) {
      const info = instrumentInfo(instrument);
      if (fieldsCompatible(project.field, info.field)) bonus += info.paperBonus || 0;
    }
    for (const booking of externalBookingsFor(state, project.id)) {
      const platform = D.EXTERNAL_PLATFORM.find((item) => item.instrument === booking.instrumentKey);
      if (platform) bonus += platform.paperBonus || 0;
    }
    return bonus;
  }

  function projectPower(state, project) {
    const requirement = projectRequirementStatus(state, project);
    if (!requirement.ok) {
      return { power: 0, avgStat: 0, people: [], blocked: true, missing: requirement.missing };
    }
    const people = activePeople(state).filter((person) => {
      return project.team.indexOf(person.id) >= 0 && person.status === "active" && !person.training;
    });
    if (!people.length) return { power: 0, avgStat: 0, people: [], blocked: false, missing: [] };
    let total = 0;
    for (const person of people) {
      const stat =
        effectiveStat(person, "int") * 0.38 +
        effectiveStat(person, "hands") * 0.34 +
        effectiveStat(person, "innovation") * 0.18 +
        effectiveStat(person, "res") * 0.1;
      const match = fieldMatch(person, project.field);
      const level = fieldLevel(person, project.field);
      const moraleFactor = clamp(0.55 + person.morale / 180, 0.58, 1.12);
      const mods = personMods(person);
      const load = state.projects.filter((item) => item.status === "active" && item.team.indexOf(person.id) >= 0).length;
      const efficiency = 1 / (1 + Math.max(0, load - 1) * 0.35);
      const juniorOnTeam = people.some((member) => ["master", "phd"].indexOf(member.roleId) >= 0 && member.id !== person.id);
      const teachBonus = (mods.teach || 0) * (juniorOnTeam ? 1 : 0.45);
      const progressMod = 1 + (mods.progress || 0) + level * 0.035 + teachBonus;
      total += stat * 0.3 * (0.55 + match * 0.5 + level * 0.04) * moraleFactor * progressMod * efficiency;
    }
    const equip = 1 + projectEquipmentBonus(state, project) / 100;
    const teamBonus = 1 + Math.max(0, people.length - 1) * 0.06;
    const bondProgress = projectBonds(state, project).reduce((sum, bond) => sum + (bond.effects.progress || 0), 0);
    const bondMultiplier = 1 + bondProgress;
    const power = total * equip * teamBonus * bondMultiplier * researchMultiplier(state);
    const avgStat = people.reduce((sum, person) => {
      return sum +
        effectiveStat(person, "int") * 0.28 +
        effectiveStat(person, "hands") * 0.24 +
        effectiveStat(person, "writing") * 0.26 +
        effectiveStat(person, "innovation") * 0.22;
    }, 0) / people.length;
    return {
      power: round(power / project.difficulty, 1),
      avgStat: round(avgStat, 1),
      people,
      blocked: false,
      missing: [],
      bonds: projectBonds(state, project)
    };
  }

  function createProject(state, template, source, options) {
    const levels = { C: 0, B: 1, A: 2, S: 3 };
    const settings = options || {};
    const project = {
      id: uid(state, "project"),
      templateId: template.id,
      title: template.title,
      field: template.field,
      tier: template.tier,
      tierLevel: levels[template.tier] || 0,
      dataGoal: template.dataGoal,
      teamCap: template.teamCap,
      difficulty: template.difficulty,
      baseIF: template.baseIF,
      grant: template.grant,
      desc: template.desc,
      requiredRoom: template.requiredRoom || null,
      requiredInstrument: template.requiredInstrument || null,
      data: 0,
      team: [],
      status: settings.draft ? "draft" : "active",
      milestones: MILESTONES.map((value) => ({
        value,
        published: false,
        ready: false
      })),
      paperPreviews: {},
      createdAt: state.month,
      source: source || "实验室规划",
      proposalPersonId: settings.proposalPersonId || null,
      authorIds: [],
      firstAuthorId: null,
      quality: 0
    };
    state.projects.push(project);
    return project;
  }

  function generateTrainingOffers(state, count) {
    return shuffle(state, D.TRAINING).slice(0, count || 3);
  }

  function trainingOfferById(offerId) {
    return D.TRAINING.find((offer) => offer.id === offerId) || null;
  }

  function weightedPick(state, entries) {
    const total = entries.reduce((sum, entry) => sum + entry.weight, 0);
    let roll = rand(state) * total;
    for (const entry of entries) {
      roll -= entry.weight;
      if (roll <= 0) return entry.value;
    }
    return entries[entries.length - 1].value;
  }

  function generateCandidate(state, forcedKind, boost) {
    const kind = forcedKind || (rand(state) < 0.6 ? "student" : "staff");
    let roleId;
    if (kind === "student") {
      const postdocWeight = 3 + state.reputation * 0.12 + (boost ? 3 : 0);
      roleId = weightedPick(state, [
        { value: "master", weight: 45 },
        { value: "phd", weight: 42 },
        { value: "postdoc", weight: postdocWeight }
      ]);
    } else {
      const roleIds = D.STAFF_ROLE_IDS;
      roleId = roleIds[Math.floor(rand(state) * roleIds.length)];
    }
    const role = D.ROLES[roleId];
    const recruiter = recruiterBonus(state);
    const qualityBoost = clamp(state.reputation / 260 + recruiter * 0.035 + (boost ? 0.09 : 0), 0, 0.42);
    const weights = {
      C: Math.max(12, 52 - 26 * qualityBoost),
      B: 29 + 3 * qualityBoost,
      A: 13 + 11 * qualityBoost,
      S: 5 + 8 * qualityBoost,
      SSR: 1 + 4 * qualityBoost
    };
    let roll = rand(state) * Object.values(weights).reduce((sum, value) => sum + value, 0);
    let rarity = "C";
    for (const key of ["C", "B", "A", "S", "SSR"]) {
      roll -= weights[key];
      if (roll <= 0) {
        rarity = key;
        break;
      }
    }
    const rarityInfo = D.RARITIES[rarity];
    const traitCount = rarityInfo.level >= 3 ? 3 : rarityInfo.level >= 1 ? 2 : 1;
    const pool = shuffle(state, D.TRAITS);
    const traits = pool.slice(0, traitCount);
    if (!traits.some((trait) => trait.tone === "good")) {
      const good = shuffle(state, D.TRAITS.filter((trait) => trait.tone === "good"))[0];
      if (good && !traits.some((trait) => trait.id === good.id)) traits[0] = good;
    }
    if (traitCount > 1 && !traits.some((trait) => trait.tone !== "good") && rand(state) < 0.55) {
      const blemish = shuffle(state, D.TRAITS.filter((trait) => trait.tone !== "good"))[0];
      if (blemish) traits[traits.length - 1] = blemish;
    }
    const traitMods = {};
    for (const trait of traits) {
      for (const [key, value] of Object.entries(trait.mods || {})) traitMods[key] = (traitMods[key] || 0) + value;
    }
    const base = 26 + rarityInfo.level * 11 + rand(state) * 18;
    const stats = {};
    for (const key of D.STAT_KEYS) {
      stats[key] = clamp(
        Math.round(base * (role.weights[key] || 1)),
        12,
        98
      );
    }
    const primaryPool = role.primary || D.FIELD_LIST;
    const coreFields = state.coreFields && state.coreFields.length ? state.coreFields : D.FIELD_LIST;
    const primaryField = rand(state) < 0.62
      ? coreFields[Math.floor(rand(state) * coreFields.length)]
      : primaryPool[Math.floor(rand(state) * primaryPool.length)];
    const secondaryPool = D.FIELD_LIST.filter((field) => field !== primaryField);
    const secondaryField = secondaryPool[Math.floor(rand(state) * secondaryPool.length)];
    const fieldLevels = {};
    fieldLevels[primaryField] = clamp(2 + rarityInfo.level, 1, 5);
    fieldLevels[secondaryField] = clamp(1 + Math.floor(rarityInfo.level / 2), 1, 4);
    const ability = D.STAT_KEYS.reduce((sum, key) => sum + clamp(stats[key] + (traitMods[key] || 0), 1, 99), 0);
    const traitValue = traits.reduce((sum, trait) => {
      return sum + (trait.tone === "good" ? 1 : trait.tone === "bad" ? -0.6 : 0.15);
    }, 0);
    const salaryBase = role.salary[0] + rand(state) * (role.salary[1] - role.salary[0]);
    const salaryMultiplier = 0.82 + rarityInfo.level * 0.07 + ability / 900 + traitValue * 0.035;
    const salary = Math.max(2500, Math.round((salaryBase * salaryMultiplier) / 100) * 100);
    const signingCost = Math.max(
      8000,
      Math.round(
        (kind === "student" ? salary * 1.8 + ability * 110 : salary * 1.1 + ability * 230 + rarityInfo.level * 9000) *
          (1 + Math.max(0, traitValue) * 0.06) /
          100
      ) * 100
    );
    let named = null;
    const namedPool = D.NAMED_PEOPLE.filter((item) => (state.namedSeen || []).indexOf(item.name) < 0);
    if (namedPool.length && rand(state) < 0.38) {
      named = namedPool[Math.floor(rand(state) * namedPool.length)];
      if (!Array.isArray(state.namedSeen)) state.namedSeen = [];
      state.namedSeen.push(named.name);
    }
    const name = named
      ? named.name
      : D.SURNAMES[Math.floor(rand(state) * D.SURNAMES.length)] + D.GIVEN_NAMES[Math.floor(rand(state) * D.GIVEN_NAMES.length)];
    const genderAvatars = named
      ? (named.gender === "女"
          ? ["👩‍🔬", "👩‍🎓", "👩‍💻", "👩‍🌾", "👩‍🏫"]
          : ["👨‍🔬", "👨‍🎓", "👨‍💻", "👨‍🌾", "👨‍🏫"])
      : null;
    const avatar = named
      ? genderAvatars[Math.floor(rand(state) * genderAvatars.length)]
      : (rand(state) < 0.6 ? role.icon : D.AVATARS[Math.floor(rand(state) * D.AVATARS.length)]);
    const requirement = role.student ? D.STUDENT_REQUIREMENTS[role.student] : null;
    return {
      id: uid(state, "candidate"),
      kind,
      roleId,
      roleName: role.name,
      name,
      avatar,
      gender: named ? named.gender : "",
      special: Boolean(named),
      specialNote: named ? "来自人员信息表的特别候选人" : "",
      rarity,
      stats,
      primaryField,
      secondaryField,
      fieldLevels,
      traits: traits.map((trait) => trait.id),
      trait: traits[0].id,
      salary,
      signingCost,
      degree: requirement ? requirement.label : "",
      studentTrack: role.student || null,
      studentRequirements: requirement,
      favor: Math.round(46 + rand(state) * 16),
      morale: Math.round(66 + rand(state) * 15),
      monthsInLab: 0,
      status: "candidate",
      assignedProject: null,
      projects: [],
      training: null,
      publications: [],
      shortlisted: false
    };
  }

  function generateCandidatePool(state, count, boost) {
    const size = Math.max(3, count || 5) + recruiterBonus(state);
    const studentsWanted = Math.max(2, Math.round(size * 0.58));
    const candidates = [];
    for (let i = 0; i < size; i += 1) {
      candidates.push(generateCandidate(state, i < studentsWanted ? "student" : "staff", Boolean(boost)));
    }
    return shuffle(state, candidates);
  }

  function makeTask(state, type, target, deadline) {
    const definitions = {
      recruit: {
        title: "扩充课题组的兵源",
        desc: "导师希望看到实验室里多几张新面孔。招收学生或招聘工作人员。",
